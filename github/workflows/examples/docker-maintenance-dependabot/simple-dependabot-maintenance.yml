# =============================================================================
# Docker Maintenance with Dependabot - Example
# =============================================================================
# Simple Docker base image maintenance using GitHub's native Dependabot.
#
# Advantages:
# - No external app installation required
# - Native GitHub integration
# - Simpler configuration
#
# How it works:
# 1. Dependabot scans Dockerfiles for base image updates (Sundays 06:30 UTC)
# 2. Creates a PR with commit prefix "fix(docker):" for semantic release
# 3. CI runs your Docker build workflow on the PR
# 4. This workflow waits for that CI - until it is complete and has not
#    changed for 3 minutes, 5 minutes after the start at the earliest - and
#    merges the PR if no check failed and every workflow in
#    required-workflows ran on the PR and passed. Patch updates only by
#    default (merge-update-types); minor and major updates, failed CI and
#    PRs the required workflow did not test stay open. So do GitHub Actions
#    updates and every other PR that changes .github/ - CI that the PR
#    itself changes cannot vouch for it
# 5. Semantic release creates a PATCH version (e.g., 1.0.0 → 1.0.1) and the
#    Docker image is rebuilt and pushed - with the next push to main that is
#    not made by GITHUB_TOKEN, or when the release workflow is run by hand:
#    the merge itself is made with GITHUB_TOKEN, which starts no workflow
#
# Prerequisites:
# 1. Enable Dependabot in repository settings
# 2. Add .github/dependabot.yml (see below)
# 3. A PR CI workflow that builds and tests the update on `pull_request`,
#    named in required-workflows below - without it nothing is merged. No
#    ruleset, branch protection or "Allow auto-merge" is needed - a ruleset
#    with required checks would also block semantic-release from pushing to
#    main.
#    Keep the `paths:` below within the `pull_request` `paths:` of that CI:
#    a PR that does not start it stays open, as it was not tested. A passed
#    check that tests nothing (e.g. a secret scan) is not enough.
#
# Required .github/dependabot.yml in your repo:
# -----------------------------------------------------------------------------
# version: 2
# updates:
#   - package-ecosystem: "docker"
#     directory: "/"                    # or "/src" if Dockerfile is there
#     schedule:
#       interval: "weekly"
#       day: "sunday"
#       time: "06:30"
#       timezone: "Etc/UTC"
#     labels:
#       - "dependencies"
#       - "docker"
#       - "automated"
#     commit-message:
#       prefix: "fix(docker)"           # IMPORTANT: triggers PATCH release
#     open-pull-requests-limit: 5
# -----------------------------------------------------------------------------
# =============================================================================

name: Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only files whose change also starts the required workflow (Prerequisites 3).
    # These paths also decide which Dependabot PRs reach the workflow at all:
    # with Dockerfiles only, npm, pip or Composer updates never start it and
    # stay manual merges - see docs/workflows/docker-maintenance.md, section
    # "Decide which PRs reach it (trigger scope)".
    paths:
      - 'Dockerfile'
      - 'src/Dockerfile'

# The reusable workflow declares no permissions of its own - the token has
# exactly these. The three read scopes are needed in private repositories
# (public CI results are readable without them) - without them every PR stays
# open; see docs/workflows/docker-maintenance.md#permissions.
permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites
  statuses: read        # commit statuses
  actions: read         # workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      # The PR CI workflow(s) that must have run on the PR and passed, comma
      # separated. Empty: nothing is merged.
      required-workflows: .github/workflows/docker-release.yml
      merge-method: 'squash'
      auto-approve: true
      # e.g. 'patch,minor' to merge minor updates too. Below 1.0.0 any update
      # may break, so a minor update of 0.y.z (0.3.1 -> 0.4.0) and a patch
      # update of 0.0.z (0.0.3 -> 0.0.4) count as major and stay open unless
      # 'major' is listed too.
      merge-update-types: 'patch'
    secrets: inherit
