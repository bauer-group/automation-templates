# OBSOLETE - this example no longer starts as-is.
# Its release job calls modules-release-management.yml, which was removed on
# 2025-08-20 (switch from Release Please to semantic-release). GitHub rejects
# the whole run when a called workflow does not exist. Kept for reference
# only - for releases use modules-semantic-release.yml.

name: 🚀 Simple Release Example

# This is a simple example showing how to use the modular release workflows
# Perfect for small projects that need basic release management

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-release:
        description: 'Force create release'
        type: boolean
        default: false

# What the called workflows request; a called workflow can never hold more than its caller grants
permissions:
  contents: write
  packages: write
  actions: read

jobs:
  # Simple release workflow using the modular components
  release:
    name: Simple Release
    # OBSOLETE: modules-release-management.yml was removed on 2025-08-20 - use modules-semantic-release.yml
    uses: bauer-group/automation-templates/.github/workflows/modules-release-management.yml@main
    with:
      release-type: 'simple'
      force-release: ${{ inputs.force-release || false }}
      auto-merge-enabled: true
      cleanup-release-branch: true

  # Optional: Generate basic artifacts for the release
  artifacts:
    name: Generate Artifacts
    if: needs.release.outputs.release-created == 'true'
    needs: release
    uses: bauer-group/automation-templates/.github/workflows/modules-artifact-generation.yml@main
    with:
      artifact-types: 'source'
      tag-name: ${{ needs.release.outputs.tag-name }}
      version: ${{ needs.release.outputs.version }}
      release-url: ${{ needs.release.outputs.release-url }}
