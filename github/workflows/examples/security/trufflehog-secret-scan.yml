name: 🐷 TruffleHog Secret Scan

# Verified-first secret scanning with TruffleHog.
# Fast filesystem scan on every push/PR, weekly deep git-history scan.
# Copy this file to .github/workflows/ in your repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC - deep history scan
  workflow_dispatch:
    inputs:
      scan-mode:
        description: 'Scan mode'
        type: choice
        default: 'filesystem'
        options: ['filesystem', 'git-history']

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trufflehog:
    name: Secret Scan
    uses: bauer-group/automation-templates/.github/workflows/modules-trufflehog-scan.yml@main
    with:
      # Weekly run does a full history scan; everything else scans the working tree
      scan-mode: ${{ inputs.scan-mode || (github.event_name == 'schedule' && 'git-history' || 'filesystem') }}
      only-verified: true
      fail-on-findings: true
    secrets: inherit
