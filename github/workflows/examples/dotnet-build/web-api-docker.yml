name: Build and Deploy Web API

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    # Pushing the built image to ghcr.io needs `packages: write`. Both repository
    # default settings grant only `packages: read`, so without this the push fails
    # with 403. `contents: read` is required alongside it because naming any scope
    # sets every unnamed scope to `none`.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dotnet-build.yml
    with:
      # .NET Configuration
      dotnet-version: '8.0.x'
      configuration: 'Release'
      
      # Project Settings
      project-path: 'src/WebApi/WebApi.csproj'
      working-directory: '.'
      
      # Build Options
      treat-warnings-as-errors: true
      verbosity: 'minimal'
      
      # Testing
      run-tests: true
      test-filter: 'Category!=LongRunning'
      collect-coverage: true
      coverage-type: 'cobertura'
      coverage-threshold: 80
      
      # Code Analysis
      run-code-analysis: true
      analysis-level: 'recommended'
      
      # Publishing
      publish: true
      output-directory: './publish'
      self-contained: false
      
      # Docker
      build-docker: true
      dockerfile-path: './Dockerfile'
      # Note: the `env` context is NOT available in `with:` of a reusable
      # workflow call - these values must be literals or allowed contexts.
      docker-image-name: '${{ github.repository }}'
      docker-registry: 'ghcr.io'
      
      # Artifacts
      upload-artifacts: true
      artifact-name: 'web-api'
      artifact-retention-days: 7
      
    secrets:
      DOCKER_REGISTRY_USERNAME: ${{ github.actor }}
      DOCKER_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  
  deploy-staging:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Deploy to Kubernetes
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
  
  deploy-production:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add your deployment commands here