name: 🤖 Issue AI Summary

# Automatically summarize new issues and PRs using AI
# This workflow uses the modular AI summary component
#
# PAUSED: every caller in the organisation was removed on 2026-09-28 because
# no run produced a real AI summary any more; the module stays for the
# rework, tracked in https://github.com/bauer-group/automation-templates/issues/105.
# Do not roll this out before #105 is closed. Reference:
# docs/workflows/ai-issue-summary.md

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write
  copilot-requests: write   # Copilot CLI access; replaces the retired models: read
  contents: read

jobs:
  summarize-new-issue:
    name: Generate AI Summary
    if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
    uses: bauer-group/automation-templates/.github/workflows/modules-ai-issue-summary.yml@main
    with:
      summary-type: 'brief'           # Options: brief, detailed, technical, user-friendly
      add-labels: true                # Add suggested labels based on AI analysis
      add-priority: true               # Add priority labels based on AI analysis
      translate: ''                   # Leave empty or specify language (e.g., 'German', 'Spanish')
      model: 'gpt-5-mini'             # Copilot model; set ai-api-key to use OpenAI instead
      comment-template: |
        ## 🤖 AI Summary
        
        {summary}
        
        ---
        *This summary was automatically generated by AI to help with triage and may not be 100% accurate.*
    secrets: inherit