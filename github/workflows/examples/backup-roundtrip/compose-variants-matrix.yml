# =============================================================================
# Backup Round Trip - One Run per Compose Variant (local, Traefik, Coolify)
# =============================================================================
# Operators deploy the Traefik or Coolify file, not the local one, and the
# variants differ in exactly what a backup depends on: volume names, networks,
# the sidecar's environment. This caller runs the round trip once per variant.
#
# The Traefik and Coolify files join a proxy network that the proxy owns on a
# real host ('external: true'); external-networks: 'auto' creates it on the
# runner. The proxy itself is not started - its labels are inert - so routing
# and TLS are not tested, only everything behind them.
#
# Assumed repository layout:
#   docker-compose.local.yml      published ports, plain HTTP
#   docker-compose.traefik.yml    proxy network ${PROXY_NETWORK}, labels
#   docker-compose.coolify.yml    network 'coolify', SERVICE_FQDN_APP
#   src/app-backup/Dockerfile     FROM ghcr.io/bauer-group/cs-backuphelper/backuphelper:latest
#   tests/backup-roundtrip/       seed.sh, mutate.sh, check.sh
#
# Docs: docs/workflows/modules-backup-roundtrip-test.md#compose-variants-traefik-coolify
# =============================================================================

name: 🧪 Backup Round Trip (variants)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'docker-compose*.yml'
      - '.env.example'
      - 'tests/backup-roundtrip/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-roundtrip:
    name: 🧪 Backup Round Trip (${{ matrix.variant }})
    strategy:
      # A broken variant must not cancel the others - each leg tells its own story.
      fail-fast: false
      matrix:
        include:
          - variant: local
            compose-file: docker-compose.local.yml
          - variant: traefik
            compose-file: docker-compose.traefik.yml
          - variant: coolify
            compose-file: docker-compose.coolify.yml
    permissions:
      contents: read
      packages: read
    uses: bauer-group/automation-templates/.github/workflows/modules-backup-roundtrip-test.yml@main
    with:
      compose-file: ${{ matrix.compose-file }}
      profiles: 'backup'
      # Every network the variant declares external, by its resolved name
      # (PROXY_NETWORK from .env for Traefik, 'coolify' for Coolify). The
      # local variant has none; 'auto' then creates nothing.
      external-networks: 'auto'
      # Plain HTTP on a runner; the hostname the Traefik labels and the
      # Coolify magic variable expect.
      env-overrides: |
        APP_SCHEME=http
        SERVICE_HOSTNAME=app.example.com
        SERVICE_FQDN_APP=app.example.com
      generated-secrets: 'DATABASE_PASSWORD'
      build-images: '[{"service": "app-backup", "context": "src/app-backup"}]'
      backup-service: 'app-backup'
      require-components: 'app files'
      services-to-stop-before-restore: 'app'
      seed-script: 'tests/backup-roundtrip/seed.sh'
      mutate-script: 'tests/backup-roundtrip/mutate.sh'
      check-script: 'tests/backup-roundtrip/check.sh'
      # One artifact per leg - the names must not collide within a run.
      artifact-name: 'backup-roundtrip-${{ matrix.variant }}-diagnostics'
    secrets: inherit

  # A matrix job's result is 'success' only when every leg passed, so one
  # condition gates on all variants.
  gate:
    name: ✅ All Variants Restored
    needs: [backup-roundtrip]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 🔍 Check the round trips
        env:
          RESULT: ${{ needs.backup-roundtrip.result }}
        run: |
          echo "Round trips: $RESULT"
          [ "$RESULT" = "success" ]
