# Example: Python Package CI with Multi-Platform Testing
# This example demonstrates using the reusable Python build workflow for PyPI packages

name: Python Package CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  build:
    name: Build & Test Package
    uses: ./.github/workflows/python-build.yml
    with:
      # Matrix Configuration for multi-platform testing
      enable-matrix: true
      matrix-os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      matrix-python: '["3.9", "3.10", "3.11", "3.12"]'
      matrix-fail-fast: false

      # Basic Configuration
      working-directory: "."
      project-type: "package"

      # Dependencies
      requirements-files: '["requirements.txt", "requirements-dev.txt"]'
      install-dev-requirements: true
      package-manager: "pip"
      cache-dependencies: true

      # Testing
      run-tests: true
      test-framework: "pytest"
      test-path: "tests"
      collect-coverage: true
      coverage-threshold: 90
      coverage-format: "xml,html"
      coverage-fail-under: false

      # Code Quality
      run-lint: true
      linter: "ruff"
      run-format-check: true
      formatter: "black"
      format-check-only: true
      run-isort-check: true
      run-type-check: true
      type-checker: "mypy"

      # Security
      run-security-scan: true
      security-tools: '["bandit", "safety"]'
      security-fail-on-error: false

      # Package Building
      build-package: true
      build-tools: '["build", "twine"]'
      package-check: true

      # Artifacts
      upload-artifacts: true
      artifact-name: "python-package"

    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

# Publishing to TestPyPI / PyPI is intentionally NOT part of this example.
# The reusable workflow this example previously called
# (./.github/workflows/python-publish.yml) no longer exists.
#
# Choose one of the supported publishing paths instead:
#
#   1. Automatic, commit-driven releases (recommended):
#      Call the reusable workflow
#      bauer-group/automation-templates/.github/workflows/python-semantic-release.yml@main
#      from a separate workflow. It derives the version from the commit
#      messages, tags, publishes to PyPI and creates the GitHub release.
#      Note: it needs contents/id-token/issues/pull-requests write permissions,
#      which is why it does not belong in this read-only CI example.
#      See docs/workflows/python-semantic-release.md
#
#   2. Explicit publish on GitHub release / manual dispatch:
#      Copy the standalone python-publish.yml example from this same folder.
#      It uses PyPI Trusted Publishing plus environment gates (testpypi/pypi).
