name: Build MSIX Package

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Package/**'
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  create-msix:
    uses: ./.github/workflows/dotnet-desktop-build.yml
    with:
      # Build Configuration
      dotnet-version: '8.0.x'
      configurations: '["Release"]'
      platforms: '["x64", "x86", "arm64"]'
      
      # Project Paths
      solution-path: 'src/MyApp.sln'
      wap-project-path: 'Package/MyApp.Package.wapproj'
      
      # MSIX Configuration
      create-msix: true
      publish-type: 'msix'
      app-version: ${{ github.event.release.tag_name || '1.0.0' }}
      
      # Signing
      sign-output: true
      
      # Testing
      run-tests: true
      test-filter: 'Category!=Integration'
      
      # Artifacts
      upload-artifacts: true
      artifact-name: 'msix-packages'
      artifact-retention-days: 30
      
    secrets:
      DOTNET_SIGNING_CERTIFICATE_BASE64: ${{ secrets.DOTNET_SIGNING_CERTIFICATE_BASE64 }}
      DOTNET_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.DOTNET_SIGNING_CERTIFICATE_PASSWORD }}
  
  deploy-to-store:
    needs: create-msix
    runs-on: windows-latest
    if: github.event_name == 'release'
    
    steps:
      - name: Download MSIX Packages
        uses: actions/download-artifact@v8
        with:
          name: msix-packages
          path: packages
      
      - name: Upload to Microsoft Store
        uses: microsoft/store-submission@v1
        with:
          package-path: packages/*.msixbundle
          store-id: ${{ secrets.MICROSOFT_STORE_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}