name: 🔄 CI/CD Pipeline (Automatic Release)

# Main CI/CD pipeline using modular workflow components
# This demonstrates the new modular approach for this repository

# paths-ignore DISABLED on 2026-08-31 - kept commented out rather than deleted so the
# original intent stays visible.
#
# Why it was wrong HERE: the filter below is the sensible default for an application
# repository, where .github/** is build scaffolding around the product. In THIS repository
# .github/** IS the product - the reusable workflows and composite actions consumers call.
# Ignoring it meant a change to the thing we ship never cut a release.
#
# Demonstrated: commit 27dd66a (a security fix closing an unauthenticated RCE in
# .github/actions/labeler-triage) triggered no release at all, and the breaking change in
# d8919d2 (#71) produced no MAJOR. Releases only happened when a commit incidentally also
# touched a path outside the filter - v7.1.3 was cut by c7741b4 only because that sweep
# also touched github/workflows/examples/**.
#
# Why re-enabling the trigger cannot loop, verified against this repository's own history:
#   1. All three bots (semantic-release-bot, README Bot, Security Policy Bot) push with
#      GITHUB_TOKEN, and GitHub does not start `on: push` workflows for GITHUB_TOKEN pushes.
#      Confirmed empirically: f318554, decb698, 0fa97dd and 9ae540d ran ZERO push workflows,
#      while the human pushes c7741b4 and 27dd66a ran five and two respectively.
#   2. Independently, `chore` and `docs` map to "release": false in the releaseRules of
#      .github/config/release/semantic-release.json, so even a triggered run cuts nothing.
#
# Cost accepted: every push to main and every PR now runs this pipeline, including doc-only
# ones. That is the intended trade - correct release semantics over saved minutes.
#
# Compare .github/workflows/workflow-validation.yml, which already documents choosing
# `paths:` over `paths-ignore:` for exactly this reason.
on:
  push:
    branches: [main]
    # paths-ignore:
    #   - '.github/**'
    #   - 'docs/**'
    #   - '*.md'
    #   - '*.MD'
  pull_request:
    branches: [main]
    # paths-ignore:
    #   - '.github/**'
    #   - 'docs/**'
    #   - '*.md'
    #   - '*.MD'

  workflow_dispatch:
    inputs:
      security-engine:
        description: 'Security scan engine'
        type: choice
        default: 'both'
        options: ['gitleaks', 'gitguardian', 'both']
      force-release:
        description: 'Force create release'
        type: boolean
        default: false
      artifact-types:
        description: 'Artifact types to generate'
        type: choice
        default: 'source'
        options: ['source', 'binaries', 'docker', 'all']

# Permissions are granted per job rather than workflow-wide, so no job holds a scope
# it does not need. Each block mirrors exactly what the called module declares.
#
# This is mandatory, not cosmetic: with the repository default set to
# "Read repository contents and package permissions", an omitted block leaves every
# other scope at `none`, and GitHub refuses to START the run - a called workflow can
# only restrict the caller's permissions, never extend them. Note that this is checked
# for ALL called workflows before any `if:` is evaluated, so even a job that would be
# skipped must have its permissions satisfied. See docs/ghcr-internal-visibility.md.

jobs:
  # PR validation for pull requests
  pr-validation:
    name: PR Quality Gate
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      checks: write
    uses: ./.github/workflows/modules-pr-validation.yml
    with:
      enable-security-scan: true
      enable-license-check: true
      enable-commit-lint: true
      security-scan-engine: 'gitleaks'
      fail-on-security-issues: true
      fail-on-license-issues: false
    secrets: inherit

  # Comprehensive security scan for main branch
  security-scan:
    name: Security Analysis
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/modules-security-scan.yml
    with:
      scan-engine: ${{ inputs.security-engine || 'both' }}
      scan-type: 'all'
      fail-on-findings: false
      minimum-severity: 'medium'
    secrets: inherit

  # License compliance check
  license-compliance:
    name: License Compliance
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/modules-license-compliance.yml
    with:
      fail-on-forbidden: false
      fail-on-unknown: false
      scan-dependencies: true
      generate-sbom: true
    secrets: inherit

  # Release management
  release-management:
    name: Release Management
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [security-scan, license-compliance]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/modules-semantic-release.yml
    with:
      target-branch: 'main'
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
    secrets: inherit

  # Artifact generation for releases
  artifact-generation:
    name: Generate Artifacts
    if: needs.release-management.outputs.release-created == 'true'
    needs: release-management
    permissions:
      contents: write
      packages: write
      actions: read
    uses: ./.github/workflows/modules-artifact-generation.yml
    with:
      artifact-types: ${{ inputs.artifact-types || 'source' }}
      tag-name: ${{ needs.release-management.outputs.tag-name }}
      version: ${{ needs.release-management.outputs.version }}

  # Update documentation for new release
  update-documentation:
    name: Update Documentation
    if: needs.release-management.outputs.release-created == 'true'
    needs: [release-management, artifact-generation]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/documentation.yml
    with:
      force-update: true
      custom-version: ${{ needs.release-management.outputs.version }}
    secrets: inherit

  # Update security policy for new release  
  update-security:
    name: Update Security Policy
    if: needs.release-management.outputs.release-created == 'true'
    needs: [release-management, artifact-generation, update-documentation]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/security-management.yml
    with:
      force-update: true
      custom-version: ${{ needs.release-management.outputs.version }}
    secrets: inherit

  # Pipeline summary
  pipeline-summary:
    name: Pipeline Summary
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    needs: [security-scan, license-compliance, release-management, artifact-generation, update-documentation, update-security]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    
    steps:
      - name: 📊 Generate Pipeline Summary
        run: |
          echo "### 🔄 Modular CI/CD Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Repository:** automation-templates" >> "$GITHUB_STEP_SUMMARY"
          echo "**Architecture:** Modular Workflow Components" >> "$GITHUB_STEP_SUMMARY"
          echo "**Event:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          echo "| Module | Status | Details |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Security Scan** | ${{ needs.security-scan.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Score: ${{ needs.security-scan.outputs.security-score || 'N/A' }}/100 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **License Compliance** | ${{ needs.license-compliance.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Status: ${{ needs.license-compliance.outputs.compliance-status || 'N/A' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Release Management** | ${{ needs.release-management.result == 'success' && '✅ PASS' || '❌ FAIL' }} | Created: ${{ needs.release-management.outputs.release-created || 'false' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Artifact Generation** | ${{ needs.artifact-generation.result == 'success' && '✅ PASS' || needs.artifact-generation.result == 'skipped' && '⏭️ SKIP' || '❌ FAIL' }} | Generated: ${{ needs.artifact-generation.outputs.artifacts-generated || 'false' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ "${{ needs.release-management.outputs.release-created }}" = "true" ]; then
            echo "🎉 **Release ${{ needs.release-management.outputs.version }} created successfully!**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Release Information:**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Version: ${{ needs.release-management.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Tag: ${{ needs.release-management.outputs.tag-name }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.release-management.outputs.tag-name }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ **No release created.** Pipeline completed successfully." >> "$GITHUB_STEP_SUMMARY"
          fi
          
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "*Powered by **BAUER GROUP** modular workflow components* 🧩" >> "$GITHUB_STEP_SUMMARY"

  