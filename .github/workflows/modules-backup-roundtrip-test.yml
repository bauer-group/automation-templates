# =============================================================================
# Backup Round-Trip Test - Reusable Workflow
# =============================================================================
# Proves that a BackupHelper sidecar can back up AND restore a real stack, with
# real data, before the stack's images are released.
#
# The backup engine (bauer-group/CS-BackupHelper) has its own unit and e2e
# tests, but each consumer wires it differently: its own compose file, its own
# BACKUP_CONFIG_JSON, plugin sources, volumes and uid 1000 permissions. A green
# engine release says nothing about whether THIS stack's backup restores. This
# module runs the full cycle against the caller's own compose stack:
#
#   prepare .env -> build images under test -> up --wait -> seed -> create
#   -> show (every component error-free) -> verify -> delete the seeded data
#   -> restore -> data is back -> healthcheck -> logs on failure -> down -v
#
# Opt-in, off unless the caller sets them - every existing caller runs the
# cycle above unchanged:
#
#   upgrade-from        the stack starts with the PREVIOUS release, which seeds
#                       and backs up; then it is upgraded like an operator does
#                       (images switched, up -d), the data and the healthcheck
#                       are checked, and the OLD snapshot is restored with the
#                       NEW sidecar
#   s3-destination      a throwaway S3 server (MinIO) becomes the sidecar's S3
#                       destination: the snapshot must reach the bucket, the
#                       sidecar's local data is wiped like on a new host, and
#                       the restore pulls the snapshot back from S3
#   external-networks   creates the external networks a Traefik or Coolify
#                       compose variant expects, so every variant can run
#
# It runs in the CALLER's repository, so logs and artifacts of private stacks
# stay where they belong.
#
# Usage (see docs/workflows/modules-backup-roundtrip-test.md):
#   jobs:
#     backup-roundtrip:
#       permissions:
#         contents: read
#         packages: read
#       uses: bauer-group/automation-templates/.github/workflows/modules-backup-roundtrip-test.yml@main
#       with:
#         compose-file: 'docker-compose.local.yml'
#         profiles: 'backup'
#         generated-secrets: 'DATABASE_PASSWORD'
#         build-images: '[{"service": "app-backup", "context": "src/app-backup"}]'
#         backup-service: 'app-backup'
#         seed-script: 'tests/backup-roundtrip/seed.sh'
#         mutate-script: 'tests/backup-roundtrip/mutate.sh'
#         check-script: 'tests/backup-roundtrip/check.sh'
#       secrets: inherit
#
# Images are pulled from GHCR with the automatic GITHUB_TOKEN. Internal or
# private packages need 'packages: read' in the CALLING workflow - a reusable
# workflow can only restrict the caller's permissions, never extend them.
# =============================================================================

name: "🐳 Module | Backup Round-Trip Test"

on:
  workflow_call:
    inputs:
      # -- Stack --------------------------------------------------------------
      compose-file:
        description: "Compose file of the stack under test, relative to working-directory"
        required: false
        type: string
        default: "docker-compose.yml"
      compose-files:
        description: 'Several compose files as a JSON array, merged in order (e.g. ["docker-compose.local.yml", "tests/backup-roundtrip/ci.override.yml"]). Takes precedence over compose-file.'
        required: false
        type: string
        default: ""
      working-directory:
        description: "Directory the stack is started from. The generated .env is written here and the caller scripts run here."
        required: false
        type: string
        default: "."
      project-name:
        description: "Compose project name (COMPOSE_PROJECT_NAME)"
        required: false
        type: string
        default: "backup-roundtrip"
      profiles:
        description: "Comma-separated Compose profiles to activate (COMPOSE_PROFILES), usually the one that enables the backup sidecar, e.g. 'backup'"
        required: false
        type: string
        default: ""
      services:
        description: "Services to start, separated by spaces or newlines. Empty starts every service of the active profiles. Dependencies are started automatically."
        required: false
        type: string
        default: ""
      external-networks:
        description: "Networks to create before the stack starts, separated by spaces, commas or newlines - the proxy network a Traefik or Coolify compose variant declares 'external: true'. 'auto' creates every external network of the configuration. Networks that exist already are left alone; the ones created here are removed at the end."
        required: false
        type: string
        default: ""

      # -- Environment --------------------------------------------------------
      env-template:
        description: "File the .env is created from (relative to working-directory). A missing file starts from an empty .env."
        required: false
        type: string
        default: ".env.example"
      env-overrides:
        description: "Multiline KEY=VALUE pairs written over the template - lower memory limits for CI, disable sources that need external services, fixed test settings. Existing keys are replaced in place; lines starting with # are ignored. Never put real secrets here."
        required: false
        type: string
        default: ""
      generated-secrets:
        description: "Names of variables (separated by spaces, commas or newlines) that receive a random 48-character hex value at runtime, masked in the log. Use it for every password the stack needs."
        required: false
        type: string
        default: ""
      prepare-script:
        description: "Bash script (relative to working-directory) run once the .env exists and before env-overrides and generated-secrets are applied - for secrets with a specific format, typically the repository's own generator (e.g. 'python3 scripts/generate-env.py --update'). Every value it adds or changes is masked."
        required: false
        type: string
        default: ""

      # -- Images under test --------------------------------------------------
      build-images:
        description: >-
          JSON array of images to build from the caller repository before the stack
          starts. Each entry: service (required - the compose service whose image
          reference the build is tagged as, so Compose uses it instead of pulling),
          context (required), dockerfile, target, build-args (newline-separated
          KEY=VALUE string or a JSON object). Base images are always pulled fresh.
          Example: '[{"service": "app-backup", "context": "src/app-backup"}]'
        required: false
        type: string
        default: ""
      registry-login:
        description: "Log in to ghcr.io with the automatic GITHUB_TOKEN before building and pulling (needed for internal or private images)"
        required: false
        type: boolean
        default: true

      # -- Backup -------------------------------------------------------------
      backup-service:
        description: "Compose service of the BackupHelper sidecar. It must run as a daemon - the engine CLI is executed inside it with 'docker compose exec'."
        required: true
        type: string
      require-components:
        description: "Component names (separated by spaces, commas or newlines) that the snapshot must contain. Catches a source that is silently disabled or skipped."
        required: false
        type: string
        default: ""
      allow-component-warnings:
        description: "Accept components that report warnings (e.g. unreadable files skipped by a filesystem source). Off by default: a skipped file is data that would not come back."
        required: false
        type: boolean
        default: false
      services-to-stop-before-restore:
        description: "Services to stop before the restore (separated by spaces or newlines), typically the application containers that hold database connections. They are started again afterwards."
        required: false
        type: string
        default: ""
      restore-command:
        description: "Engine subcommand that restores a snapshot. Change it only for a consumer plugin that wraps restore (e.g. 'documenso restore')."
        required: false
        type: string
        default: "restore"
      restore-args:
        description: "Arguments after the snapshot id, e.g. '--force --only database'. Keep --force: there is no terminal to confirm the prompt."
        required: false
        type: string
        default: "--force"
      run-healthcheck:
        description: "Run 'backuphelper healthcheck' at the end (must report the new snapshot as fresh) and, with upgrade-from, right after the upgrade"
        required: false
        type: boolean
        default: true

      # -- Upgrade from a previous release (opt-in) ----------------------------
      upgrade-from:
        description: >-
          Tests the upgrade of an existing installation. The stack starts with a previous release,
          which seeds and backs up; then the images built from this commit replace it like an
          operator's upgrade (compose up -d), data and healthcheck are checked, and the OLD
          snapshot is restored with the NEW sidecar. 'latest-release' (the newest release of this
          repository; a leading 'v' of its tag is dropped for the image tag), one image tag for
          every build-images service (e.g. '1.4.2'), or a JSON object mapping build-images services
          to 'latest-release', a tag or a full image reference - services left out run this
          commit's image from the start. Empty: no upgrade test.
        required: false
        type: string
        default: ""
      upgrade-from-compose-files:
        description: 'Compose files the previous release is started with, as a JSON array - e.g. the files of this commit plus an override that restores the shape of the previous release. Empty: the files of compose-file/compose-files. The upgrade switches to those.'
        required: false
        type: string
        default: ""
      upgrade-script:
        description: "Bash script (relative to working-directory) run at the upgrade, after the old snapshot was taken and before the stack switches to the new images and compose files - for what the release notes tell operators to do, e.g. migrating the .env. Runs with ROUNDTRIP_PHASE=upgrade. Every value it adds to or changes in the .env is masked."
        required: false
        type: string
        default: ""

      # -- Off-site S3 destination (opt-in) ------------------------------------
      s3-destination:
        description: "Start a throwaway S3 server (MinIO) on the networks of the backup service and make it the sidecar's S3 destination through s3-env. The snapshot must reach the bucket; then the sidecar's local data is wiped like on a new host, and the restore pulls the snapshot back from S3."
        required: false
        type: boolean
        default: false
      s3-env:
        description: "Lines 'setting VARIABLE' (separated by whitespace) naming the .env variables the compose file builds its S3 destination from; the module writes the throwaway server's values into them. Settings: endpoint, bucket, access-key, secret-key (required), region, path-style, prefix (optional), each with a variable of its own. Example line: 'endpoint APP_BACKUP_S3_ENDPOINT'. No '=': secret scanners read 'access-key=NAME' as a credential."
        required: false
        type: string
        default: ""
      s3-image:
        description: "Image of the throwaway S3 server (s3-destination): MinIO-compatible, with curl for its healthcheck"
        required: false
        type: string
        default: "ghcr.io/bauer-group/cs-minio/minio:latest"
      s3-client-image:
        description: "Image that provides the MinIO client 'mc', used to create the bucket and to list what the sidecar uploaded (s3-destination)"
        required: false
        type: string
        default: "ghcr.io/bauer-group/cs-minio/minio-init:latest"

      # -- Test data ----------------------------------------------------------
      seed-script:
        description: "Bash script (relative to working-directory) that writes marker data into the running stack. Without seed and check scripts only the backup mechanics are tested, not the data."
        required: false
        type: string
        default: ""
      mutate-script:
        description: "Bash script that deletes or damages the seeded data after the backup, so the restore has something to bring back"
        required: false
        type: string
        default: ""
      check-script:
        description: "Bash script that exits 0 when the seeded data is in the state given by ROUNDTRIP_EXPECT (present or absent)"
        required: false
        type: string
        default: ""

      # -- Timeouts -----------------------------------------------------------
      wait-timeout:
        description: "Seconds 'docker compose up --wait' may take until every service is running or healthy (initial start and restart after the restore)"
        required: false
        type: number
        default: 600
      script-timeout:
        description: "Seconds each seed, mutate or check script may run"
        required: false
        type: number
        default: 600
      timeout-minutes:
        description: "Timeout of the whole job in minutes"
        required: false
        type: number
        default: 45

      # -- Runner and diagnostics ---------------------------------------------
      free-disk-space:
        description: "Remove unused preinstalled toolchains from the runner first. Turn it on for large stacks (several GB of images). GitHub-hosted Linux runners only - ignored on self-hosted runners."
        required: false
        type: boolean
        default: false
      artifact-name:
        description: "Name of the diagnostics artifact uploaded on failure. Set a distinct name when the module is called more than once in a workflow run."
        required: false
        type: string
        default: "backup-roundtrip-diagnostics"
      artifact-retention-days:
        description: "Days the diagnostics artifact is kept"
        required: false
        type: number
        default: 7
      runs-on:
        description: 'Runner to use. Use string for GitHub-hosted (e.g., "ubuntu-latest") or JSON array for self-hosted (e.g., ["self-hosted", "linux"])'
        required: false
        type: string
        default: "ubuntu-latest"

    outputs:
      snapshot-id:
        description: "Id of the snapshot the round trip created and restored"
        value: ${{ jobs.roundtrip.outputs.snapshot-id }}
      components:
        description: "JSON array of the snapshot's components ({name, kind, size, error})"
        value: ${{ jobs.roundtrip.outputs.components }}
      result:
        description: "Result of the round trip job: success, failure or cancelled"
        value: ${{ jobs.roundtrip.result }}

permissions:
  contents: read
  packages: read # Pull internal/private images from GHCR

jobs:
  roundtrip:
    name: "🧪 Backup Round Trip"
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    outputs:
      snapshot-id: ${{ steps.create.outputs.snapshot-id }}
      components: ${{ steps.inspect.outputs.components }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    # Shared by several steps and by the caller scripts (inherited through the
    # environment). Inputs are routed through env and never pasted into a script.
    env:
      BACKUP_SERVICE: ${{ inputs.backup-service }}
      SCRIPT_TIMEOUT: ${{ inputs.script-timeout }}
      WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
      START_SERVICES: ${{ inputs.services }}
      # s3-destination: the throwaway server, its client and the bucket.
      # Prefixed, because Compose reads the process environment before the
      # .env - a plain S3_BUCKET would override the caller's own variable.
      ROUNDTRIP_S3_SERVICE: roundtrip-s3
      ROUNDTRIP_S3_CLIENT: roundtrip-s3-client
      ROUNDTRIP_S3_BUCKET: backup-roundtrip

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v7

      - name: "🧹 Free Disk Space"
        # Never on self-hosted runners: the rm -rf would hit a persistent host.
        if: inputs.free-disk-space && runner.os == 'Linux' && runner.environment == 'github-hosted'
        working-directory: .
        run: |
          BEFORE=$(df --output=avail -BM / | tail -1 | tr -dc '0-9')
          echo "Before: $(df -h / | tail -1)"

          # Each removed with `|| true`: a runner image that drops one of these
          # must not fail the run over its absence. Only the CodeQL bundle out of
          # /opt/hostedtoolcache - the rest holds versions a setup-* step may expect.
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/android /usr/share/dotnet \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /opt/ghc || true

          AFTER=$(df --output=avail -BM / | tail -1 | tr -dc '0-9')
          echo "After:  $(df -h / | tail -1)"
          echo "🧹 Freed $(( (AFTER - BEFORE) / 1024 )) GB - ${AFTER} MB now available"

      # Everything that can be wrong with the inputs fails here, in seconds,
      # instead of after ten minutes of image pulls.
      - name: "🔍 Validate Inputs"
        id: validate
        # Tested by .github/workflows/tests/backup-roundtrip-module.test.sh
        env:
          COMPOSE_FILE_INPUT: ${{ inputs.compose-file }}
          COMPOSE_FILES_INPUT: ${{ inputs.compose-files }}
          PROFILES_INPUT: ${{ inputs.profiles }}
          PROJECT_NAME: ${{ inputs.project-name }}
          ENV_OVERRIDES: ${{ inputs.env-overrides }}
          GENERATED_SECRETS: ${{ inputs.generated-secrets }}
          BUILD_IMAGES: ${{ inputs.build-images }}
          PREPARE_SCRIPT: ${{ inputs.prepare-script }}
          SEED_SCRIPT: ${{ inputs.seed-script }}
          MUTATE_SCRIPT: ${{ inputs.mutate-script }}
          CHECK_SCRIPT: ${{ inputs.check-script }}
          STOP_SERVICES: ${{ inputs.services-to-stop-before-restore }}
          EXTERNAL_NETWORKS: ${{ inputs.external-networks }}
          S3_DESTINATION: ${{ inputs.s3-destination }}
          S3_ENV: ${{ inputs.s3-env }}
          S3_IMAGE: ${{ inputs.s3-image }}
          S3_CLIENT_IMAGE: ${{ inputs.s3-client-image }}
          UPGRADE_FROM: ${{ inputs.upgrade-from }}
          UPGRADE_FROM_COMPOSE_FILES: ${{ inputs.upgrade-from-compose-files }}
          UPGRADE_SCRIPT: ${{ inputs.upgrade-script }}
        run: |
          set -euo pipefail
          set -f # inputs are split on whitespace below, never globbed
          ERRORS=0
          fail() { echo "::error title=Backup round trip::$1"; ERRORS=$((ERRORS + 1)); }

          NAME_RE='^[A-Za-z0-9][A-Za-z0-9._-]*$'
          [[ "$BACKUP_SERVICE" =~ $NAME_RE ]] || fail "backup-service '$BACKUP_SERVICE' is not a valid service name"
          [[ "$PROJECT_NAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || fail "project-name must be lowercase letters, digits, '-' or '_'"
          [[ "${PROFILES_INPUT// /}" =~ ^[A-Za-z0-9_.,-]*$ ]] || fail "profiles must be a comma-separated list of profile names"
          for VALUE in "$SCRIPT_TIMEOUT" "$WAIT_TIMEOUT"; do
            [[ "$VALUE" =~ ^[1-9][0-9]*$ ]] || fail "timeouts must be positive integers (got '$VALUE')"
          done
          for NAME in $START_SERVICES $STOP_SERVICES; do
            [[ "$NAME" =~ $NAME_RE ]] || fail "'$NAME' is not a valid service name"
          done
          for NAME in $STOP_SERVICES; do
            [ "$NAME" != "$BACKUP_SERVICE" ] || fail "services-to-stop-before-restore must not contain the backup service - the restore runs inside it"
          done
          for NAME in ${EXTERNAL_NETWORKS//,/ }; do
            [ "$NAME" = "auto" ] || [[ "$NAME" =~ $NAME_RE ]] || fail "external-networks entry '$NAME' is neither 'auto' nor a network name"
          done

          if [ -n "$COMPOSE_FILES_INPUT" ]; then
            jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<< "$COMPOSE_FILES_INPUT" > /dev/null \
              || fail "compose-files must be a non-empty JSON array of paths"
            mapfile -t FILES < <(jq -r '.[]' <<< "$COMPOSE_FILES_INPUT" 2>/dev/null || true)
          else
            FILES=("$COMPOSE_FILE_INPUT")
          fi
          for FILE in "${FILES[@]}"; do
            [ -f "$FILE" ] || fail "compose file '$FILE' not found in $(pwd)"
            [[ "$FILE" != *:* ]] || fail "compose file '$FILE' must not contain ':'"
          done

          # Same trimming as Prepare Environment: leading whitespace is dropped.
          while IFS= read -r LINE; do
            LINE="${LINE#"${LINE%%[![:space:]]*}"}"
            [ -n "$LINE" ] || continue
            [[ "$LINE" == \#* ]] && continue
            [[ "$LINE" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]] || fail "env-overrides line is not KEY=VALUE: '${LINE%%=*}…'"
          done <<< "$ENV_OVERRIDES"

          for NAME in ${GENERATED_SECRETS//,/ }; do
            [[ "$NAME" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || fail "generated-secrets entry '$NAME' is not a variable name"
          done

          if [ -n "$BUILD_IMAGES" ]; then
            jq -e 'type == "array" and all(.[]; type == "object"
                     and (.service | type == "string" and length > 0)
                     and (.context | type == "string" and length > 0))' <<< "$BUILD_IMAGES" > /dev/null \
              || fail "build-images must be a JSON array of objects with 'service' and 'context'"
          fi

          for SCRIPT in "$PREPARE_SCRIPT" "$SEED_SCRIPT" "$MUTATE_SCRIPT" "$CHECK_SCRIPT" "$UPGRADE_SCRIPT"; do
            [ -z "$SCRIPT" ] || [ -f "$SCRIPT" ] || fail "script '$SCRIPT' not found in $(pwd)"
          done
          if { [ -n "$SEED_SCRIPT" ] || [ -n "$MUTATE_SCRIPT" ]; } && [ -z "$CHECK_SCRIPT" ]; then
            fail "seed-script and mutate-script need a check-script that proves the data state"
          fi

          # Characters of an image reference: [registry[:port]/]name[:tag][@digest]
          REF_RE='^[A-Za-z0-9][A-Za-z0-9._/:@-]*$'

          # s3-env is only read with s3-destination, so a matrix can switch
          # the S3 leg on and off without touching the mapping.
          if [ "$S3_DESTINATION" = "true" ]; then
            [ -n "$S3_ENV" ] || fail "s3-destination needs s3-env: the .env variables the compose file builds its S3 destination from"
            MAPPED=" "
            VARIABLES=" "
            while IFS= read -r LINE; do
              LINE="${LINE#"${LINE%%[![:space:]]*}"}"
              LINE="${LINE%"${LINE##*[![:space:]]}"}"
              [ -n "$LINE" ] || continue
              [[ "$LINE" == \#* ]] && continue
              if [[ ! "$LINE" =~ ^([a-z-]+)[[:space:]]+([A-Za-z_][A-Za-z0-9_]*)$ ]]; then
                fail "s3-env line is not 'setting VARIABLE' (whitespace, no '='): '$LINE'"
                continue
              fi
              SETTING="${BASH_REMATCH[1]}"
              VARIABLE="${BASH_REMATCH[2]}"
              case "$SETTING" in
                endpoint|bucket|access-key|secret-key|region|path-style|prefix) ;;
                *) fail "s3-env: unknown setting '$SETTING' (endpoint, bucket, access-key, secret-key, region, path-style, prefix)"; continue ;;
              esac
              [[ "$MAPPED" != *" $SETTING "* ]] || fail "s3-env maps '$SETTING' twice"
              MAPPED+="$SETTING "
              # One variable for two settings would silently keep the last value.
              [[ "$VARIABLES" != *" $VARIABLE "* ]] || fail "s3-env names '$VARIABLE' for two settings - each setting needs a variable of its own"
              VARIABLES+="$VARIABLE "
            done <<< "$S3_ENV"
            for SETTING in endpoint bucket access-key secret-key; do
              [[ "$MAPPED" == *" $SETTING "* ]] || fail "s3-env must map '$SETTING' - without it the sidecar does not reach the throwaway server"
            done
            for IMAGE in "$S3_IMAGE" "$S3_CLIENT_IMAGE"; do
              [[ "$IMAGE" =~ $REF_RE ]] || fail "'$IMAGE' is not an image reference (s3-image, s3-client-image)"
            done
          fi

          # upgrade-from: 'latest-release', a tag, or {"service": "tag | ref | latest-release"}.
          # A tag has no '/', ':' or '@'; anything with one is a full reference.
          TAG_RE='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          valid_spec() {
            [ "$1" = "latest-release" ] || [[ "$1" =~ $TAG_RE ]] || { [[ "$1" == *[/:@]* ]] && [[ "$1" =~ $REF_RE ]]; }
          }
          if [ -n "$UPGRADE_FROM" ]; then
            [ -n "$BUILD_IMAGES" ] || fail "upgrade-from needs build-images: the upgrade switches the stack to the images built from this commit"
            if [[ "$UPGRADE_FROM" == \{* ]]; then
              if jq -e 'type == "object" and length > 0 and all(.[]; type == "string")' <<< "$UPGRADE_FROM" > /dev/null 2>&1; then
                PLAN=$(jq -r 'to_entries[] | "\(.key)\t\(.value)"' <<< "$UPGRADE_FROM")
                while IFS=$'\t' read -r SERVICE SPEC; do
                  jq -e --arg s "$SERVICE" 'any(.[]; .service == $s)' <<< "${BUILD_IMAGES:-[]}" > /dev/null 2>&1 \
                    || fail "upgrade-from: '$SERVICE' is not a build-images service - only an image built from this commit can be upgraded to"
                  valid_spec "$SPEC" || fail "upgrade-from: '$SPEC' for '$SERVICE' is neither 'latest-release', an image tag nor an image reference"
                done <<< "$PLAN"
              else
                fail "upgrade-from must be a JSON object mapping build-images services to 'latest-release', a tag or an image reference"
              fi
            elif [ "$UPGRADE_FROM" != "latest-release" ] && [[ ! "$UPGRADE_FROM" =~ $TAG_RE ]]; then
              fail "upgrade-from must be 'latest-release', an image tag or a JSON object (got '$UPGRADE_FROM')"
            fi
          fi
          if [ -z "$UPGRADE_FROM" ] && { [ -n "$UPGRADE_FROM_COMPOSE_FILES" ] || [ -n "$UPGRADE_SCRIPT" ]; }; then
            fail "upgrade-from-compose-files and upgrade-script need upgrade-from"
          fi
          if [ -n "$UPGRADE_FROM_COMPOSE_FILES" ]; then
            jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<< "$UPGRADE_FROM_COMPOSE_FILES" > /dev/null 2>&1 \
              || fail "upgrade-from-compose-files must be a non-empty JSON array of paths"
            mapfile -t PREVIOUS_FILES < <(jq -r '.[]' <<< "$UPGRADE_FROM_COMPOSE_FILES" 2>/dev/null || true)
            for FILE in "${PREVIOUS_FILES[@]}"; do
              [ -f "$FILE" ] || fail "compose file '$FILE' (upgrade-from-compose-files) not found in $(pwd)"
              [[ "$FILE" != *:* ]] || fail "compose file '$FILE' must not contain ':'"
            done
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ $ERRORS input error(s) - nothing was started"
            exit 1
          fi
          echo "✅ Inputs are valid"

      - name: "🔧 Prepare Environment"
        id: prepare
        # Tested by .github/workflows/tests/backup-roundtrip-module.test.sh
        env:
          COMPOSE_FILE_INPUT: ${{ inputs.compose-file }}
          COMPOSE_FILES_INPUT: ${{ inputs.compose-files }}
          PROFILES_INPUT: ${{ inputs.profiles }}
          PROJECT_NAME: ${{ inputs.project-name }}
          ENV_TEMPLATE: ${{ inputs.env-template }}
          ENV_OVERRIDES: ${{ inputs.env-overrides }}
          GENERATED_SECRETS: ${{ inputs.generated-secrets }}
          PREPARE_SCRIPT: ${{ inputs.prepare-script }}
          S3_DESTINATION: ${{ inputs.s3-destination }}
          S3_ENV: ${{ inputs.s3-env }}
          S3_IMAGE: ${{ inputs.s3-image }}
          S3_CLIENT_IMAGE: ${{ inputs.s3-client-image }}
          UPGRADE_FROM_COMPOSE_FILES: ${{ inputs.upgrade-from-compose-files }}
        run: |
          set -euo pipefail
          set -f # inputs are split on whitespace below, never globbed
          ROUNDTRIP_DIR="$RUNNER_TEMP/backup-roundtrip"
          mkdir -p "$ROUNDTRIP_DIR/diagnostics"
          echo "ROUNDTRIP_DIR=$ROUNDTRIP_DIR" >> "$GITHUB_ENV"

          # Engine CLI, phase runner and .env helpers shared by this step and
          # the steps below.
          cat > "$ROUNDTRIP_DIR/lib.sh" << 'LIB'
          # Runs the BackupHelper CLI inside the running backup sidecar.
          bh() { docker compose exec -T "$BACKUP_SERVICE" backuphelper "$@"; }

          # Runs one caller script with the documented contract.
          run_phase() {
            local phase="$1" script="$2" expect="${3:-}"
            echo "▶ ${phase}: ${script}${expect:+ (expect ${expect})}"
            ROUNDTRIP_PHASE="$phase" ROUNDTRIP_EXPECT="$expect" \
              timeout --kill-after=10 "$SCRIPT_TIMEOUT" bash "$script"
          }

          # Runs the MinIO client against the throwaway S3 server
          # (s3-destination); its alias is "rt".
          s3c() { docker compose run --rm --no-deps -T "$ROUNDTRIP_S3_CLIENT" "$@"; }

          # A key appended to a last line without a newline would be glued onto
          # it, so the .env always ends with one - also after a caller script.
          end_with_newline() { [ ! -s .env ] || [ -z "$(tail -c 1 .env)" ] || echo >> .env; }

          # Masks the value of every .env line that is not in $1, a copy of the
          # .env taken before a caller script ran: everything the script added
          # or changed is treated as secret. Sets MASKED to the count.
          mask_env_changes() {
            local line value
            end_with_newline
            MASKED=0
            while IFS= read -r line; do
              [[ "$line" == *=* ]] || continue
              grep -qxF -- "$line" "$1" && continue
              value="${line#*=}"
              # Masked without its quotes: the application prints the bare
              # value, and masking it also covers the quoted form.
              if [[ "$value" =~ ^\"(.*)\"$ || "$value" =~ ^\'(.*)\'$ ]]; then
                value="${BASH_REMATCH[1]}"
              fi
              [ "${#value}" -ge 8 ] || continue
              echo "::add-mask::$value"
              MASKED=$((MASKED + 1))
            done < .env
          }
          LIB
          source "$ROUNDTRIP_DIR/lib.sh"

          # -- .env: template, prepare script, overrides, generated secrets ------
          if [ -f "$ENV_TEMPLATE" ]; then
            cp "$ENV_TEMPLATE" .env
            end_with_newline
            echo "📄 .env created from $ENV_TEMPLATE"
          else
            : > .env
            echo "::notice::env-template '$ENV_TEMPLATE' not found - starting from an empty .env"
          fi

          # The repository's own generator knows formats a generic one cannot
          # (RSA keys, base64 of N bytes, exact lengths). Everything it adds or
          # changes is treated as secret and masked.
          if [ -n "$PREPARE_SCRIPT" ]; then
            cp .env "$ROUNDTRIP_DIR/env.before"
            echo "▶ prepare: $PREPARE_SCRIPT"
            ROUNDTRIP_PHASE=prepare timeout --kill-after=10 "$SCRIPT_TIMEOUT" bash "$PREPARE_SCRIPT"
            [ -f .env ] || { echo "::error title=Backup round trip::prepare-script removed the .env"; exit 1; }
            mask_env_changes "$ROUNDTRIP_DIR/env.before"
            rm -f "$ROUNDTRIP_DIR/env.before"
            echo "🔐 prepare-script set $MASKED value(s), all masked"
          fi

          # Sets KEY=VALUE in .env. An existing key is replaced IN PLACE: a .env
          # may interpolate earlier lines (APP_NAME=${STACK_NAME}), and moving
          # STACK_NAME to the end would leave APP_NAME empty. A new key is
          # appended. Values pass through ENVIRON, so awk never unescapes them.
          set_env() {
            if grep -q -E "^[[:space:]]*${1}=" .env; then
              SET_KEY="$1" SET_VALUE="$2" awk '
                BEGIN { key = ENVIRON["SET_KEY"]; value = ENVIRON["SET_VALUE"] }
                $0 ~ "^[[:space:]]*" key "=" { if (!done) print key "=" value; done = 1; next }
                { print }
              ' .env > .env.tmp
              mv .env.tmp .env
            else
              printf '%s=%s\n' "$1" "$2" >> .env
            fi
          }

          OVERRIDDEN=0
          while IFS= read -r LINE; do
            LINE="${LINE#"${LINE%%[![:space:]]*}"}"
            [ -n "$LINE" ] || continue
            [[ "$LINE" == \#* ]] && continue
            set_env "${LINE%%=*}" "${LINE#*=}"
            OVERRIDDEN=$((OVERRIDDEN + 1))
          done <<< "$ENV_OVERRIDES"
          echo "🔧 $OVERRIDDEN override(s) applied"

          # Hex only: safe in JSON, URLs, connection strings and compose
          # interpolation, so no consumer has to escape a generated value.
          GENERATED=0
          for NAME in ${GENERATED_SECRETS//,/ }; do
            VALUE=$(openssl rand -hex 24)
            echo "::add-mask::$VALUE"
            set_env "$NAME" "$VALUE"
            GENERATED=$((GENERATED + 1))
          done
          echo "🔐 $GENERATED secret(s) generated"

          # -- s3-destination: the throwaway server's settings -----------------
          # Written last, so they win over the template and env-overrides. The
          # server and its client read the ROUNDTRIP_S3_* keys (Prepare S3
          # Destination); the caller's compose file reads its own variables,
          # named by s3-env.
          if [ "$S3_DESTINATION" = "true" ]; then
            S3_ACCESS_KEY="roundtrip-$(openssl rand -hex 6)"
            S3_SECRET_KEY=$(openssl rand -hex 24)
            echo "::add-mask::$S3_ACCESS_KEY"
            echo "::add-mask::$S3_SECRET_KEY"
            set_env ROUNDTRIP_S3_ACCESS_KEY "$S3_ACCESS_KEY"
            set_env ROUNDTRIP_S3_SECRET_KEY "$S3_SECRET_KEY"
            set_env ROUNDTRIP_S3_IMAGE "$S3_IMAGE"
            set_env ROUNDTRIP_S3_CLIENT_IMAGE "$S3_CLIENT_IMAGE"
            MAPPED=0
            while IFS= read -r LINE; do
              LINE="${LINE#"${LINE%%[![:space:]]*}"}"
              LINE="${LINE%"${LINE##*[![:space:]]}"}"
              [ -n "$LINE" ] || continue
              [[ "$LINE" == \#* ]] && continue
              VARIABLE="${LINE##*[[:space:]]}"
              case "${LINE%%[[:space:]]*}" in
                endpoint)   set_env "$VARIABLE" "http://$ROUNDTRIP_S3_SERVICE:9000" ;;
                bucket)     set_env "$VARIABLE" "$ROUNDTRIP_S3_BUCKET" ;;
                access-key) set_env "$VARIABLE" "$S3_ACCESS_KEY" ;;
                secret-key) set_env "$VARIABLE" "$S3_SECRET_KEY" ;;
                # MinIO accepts any region while it has none configured.
                region)     set_env "$VARIABLE" "us-east-1" ;;
                path-style) set_env "$VARIABLE" "true" ;;
                prefix)     set_env "$VARIABLE" "backup-roundtrip/" ;;
              esac
              MAPPED=$((MAPPED + 1))
            done <<< "$S3_ENV"
            echo "🪣 s3-destination: $MAPPED variable(s) point at http://$ROUNDTRIP_S3_SERVICE:9000, bucket $ROUNDTRIP_S3_BUCKET"
          fi

          # -- Compose context for every later step and the caller scripts ------
          if [ -n "$COMPOSE_FILES_INPUT" ]; then
            COMPOSE_FILE_LIST=$(jq -r 'join(":")' <<< "$COMPOSE_FILES_INPUT")
          else
            COMPOSE_FILE_LIST="$COMPOSE_FILE_INPUT"
          fi
          # The files of this commit. upgrade-from-compose-files starts the
          # previous release from other files; the upgrade switches to these.
          echo "ROUNDTRIP_COMPOSE_FILE_TARGET=$COMPOSE_FILE_LIST" >> "$GITHUB_ENV"
          if [ -n "$UPGRADE_FROM_COMPOSE_FILES" ]; then
            COMPOSE_FILE_LIST=$(jq -r 'join(":")' <<< "$UPGRADE_FROM_COMPOSE_FILES")
          fi
          PROFILES="${PROFILES_INPUT// /}"
          MARKER="rt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 4)"
          echo "COMPOSE_FILE=$COMPOSE_FILE_LIST" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "ROUNDTRIP_MARKER=$MARKER" >> "$GITHUB_ENV"
          echo "ROUNDTRIP_BACKUP_SERVICE=$BACKUP_SERVICE" >> "$GITHUB_ENV"
          # Only when set: an exported empty value would override the .env file.
          if [ -n "$PROFILES" ]; then
            echo "COMPOSE_PROFILES=$PROFILES" >> "$GITHUB_ENV"
          fi

          echo "::group::Tool versions"
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          df -h / | tail -1
          echo "::endgroup::"

      - name: "🔍 Validate Compose Configuration"
        run: |
          set -euo pipefail
          # Validates the configuration COMPOSE_FILE names and renders it to $1.
          check_config() {
            # Fails on undefined required variables and syntax errors before
            # anything is built or pulled.
            docker compose config --quiet
            # Captured first: piped straight into 'grep -q', compose can be
            # killed by SIGPIPE once grep has its match, and pipefail would
            # report the service as missing - depending on the service order.
            local services
            services=$(docker compose config --services)
            if ! grep -qxF "$BACKUP_SERVICE" <<< "$services"; then
              echo "::error title=Backup round trip::backup-service '$BACKUP_SERVICE' is not part of the configuration ($COMPOSE_FILE) - is its profile activated (profiles input)?"
              echo "Services: $(tr '\n' ' ' <<< "$services")"
              exit 1
            fi
            docker compose config --format json > "$1"
            echo "✅ $COMPOSE_FILE: $(jq '.services | length' "$1") service(s) configured, profiles: ${COMPOSE_PROFILES:-<none>}"
          }
          check_config "$ROUNDTRIP_DIR/compose-config.json"
          # upgrade-from-compose-files: the previous release starts from other
          # files, and the upgrade switches to the files of this commit - both
          # must be valid before anything is pulled.
          if [ "$COMPOSE_FILE" != "$ROUNDTRIP_COMPOSE_FILE_TARGET" ]; then
            (export COMPOSE_FILE="$ROUNDTRIP_COMPOSE_FILE_TARGET"; check_config "$ROUNDTRIP_DIR/compose-config.target.json")
          fi

      # The throwaway S3 server joins the project through a generated override
      # file, on the networks of the backup service, so the sidecar reaches it
      # by service name whatever the caller's network layout is. Its client
      # sits behind a profile of its own: it only runs on demand ('run').
      - name: "🪣 Prepare S3 Destination"
        id: s3-prepare
        if: inputs.s3-destination
        # Tested by .github/workflows/tests/backup-roundtrip-module.test.sh
        run: |
          set -euo pipefail
          CONFIG="$ROUNDTRIP_DIR/compose-config.json"
          for NAME in "$ROUNDTRIP_S3_SERVICE" "$ROUNDTRIP_S3_CLIENT"; do
            if jq -e --arg s "$NAME" '.services | has($s)' "$CONFIG" > /dev/null; then
              echo "::error title=Backup round trip::s3-destination: the configuration already has a service '$NAME'"
              exit 1
            fi
          done
          if [ -n "$(jq -r --arg s "$BACKUP_SERVICE" '.services[$s].network_mode // empty' "$CONFIG")" ]; then
            echo "::error title=Backup round trip::s3-destination: '$BACKUP_SERVICE' uses network_mode - the S3 server joins the networks of the backup service, and it has none of its own"
            exit 1
          fi
          # A service without 'networks' is on the project's default network.
          NETWORKS=$(jq -c --arg s "$BACKUP_SERVICE" '.services[$s].networks // {"default": null} | keys' "$CONFIG")

          OVERRIDE="$ROUNDTRIP_DIR/s3-destination.compose.yml"
          cat > "$OVERRIDE" << YAML
          # Generated by modules-backup-roundtrip-test.yml (s3-destination).
          # Image names and credentials come from the .env (ROUNDTRIP_S3_*).
          services:
            ${ROUNDTRIP_S3_SERVICE}:
              image: \${ROUNDTRIP_S3_IMAGE}
              command: ["server", "--address", ":9000", "/data"]
              environment:
                MINIO_ROOT_USER: \${ROUNDTRIP_S3_ACCESS_KEY}
                MINIO_ROOT_PASSWORD: \${ROUNDTRIP_S3_SECRET_KEY}
              healthcheck:
                test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
                interval: 5s
                timeout: 5s
                retries: 24
              networks: ${NETWORKS}
            ${ROUNDTRIP_S3_CLIENT}:
              image: \${ROUNDTRIP_S3_CLIENT_IMAGE}
              profiles: ["${ROUNDTRIP_S3_CLIENT}"]
              entrypoint: ["mc"]
              environment:
                MC_HOST_rt: http://\${ROUNDTRIP_S3_ACCESS_KEY}:\${ROUNDTRIP_S3_SECRET_KEY}@${ROUNDTRIP_S3_SERVICE}:9000
              networks: ${NETWORKS}
          YAML

          COMPOSE_FILE="$COMPOSE_FILE:$OVERRIDE"
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          # The upgrade (upgrade-from) keeps the server when it switches the
          # compose files.
          echo "ROUNDTRIP_COMPOSE_EXTRA=$OVERRIDE" >> "$GITHUB_ENV"
          docker compose config --quiet
          docker compose config --format json > "$CONFIG"
          echo "✅ $ROUNDTRIP_S3_SERVICE joins $(jq -r 'join(", ")' <<< "$NETWORKS") next to $BACKUP_SERVICE"

      # A Traefik or Coolify variant joins a proxy network that the proxy owns
      # on a real host ('external: true'); without it 'up' refuses to start.
      # The labels for the proxy are inert without one, so the network is all
      # the variant needs to run on a runner.
      - name: "🌐 Create External Networks"
        id: networks
        if: inputs.external-networks != ''
        # Tested by .github/workflows/tests/backup-roundtrip-module.test.sh
        env:
          EXTERNAL_NETWORKS: ${{ inputs.external-networks }}
        run: |
          set -euo pipefail
          set -f # the input is split on whitespace below, never globbed
          : > "$ROUNDTRIP_DIR/created-networks.txt"
          CONFIGS=("$ROUNDTRIP_DIR/compose-config.json")
          if [ -f "$ROUNDTRIP_DIR/compose-config.target.json" ]; then
            CONFIGS+=("$ROUNDTRIP_DIR/compose-config.target.json")
          fi

          NAMES=""
          for NAME in ${EXTERNAL_NETWORKS//,/ }; do
            if [ "$NAME" = "auto" ]; then
              # Every network the configuration declares external, by the name
              # Compose resolved - a name taken from the .env is its value.
              # With upgrade-from-compose-files, also those of the files the
              # upgrade switches to.
              DECLARED=$(jq -r '(.networks // {}) | to_entries[]
                                | select(.value.external == true) | .value.name // .key' \
                         "${CONFIGS[@]}")
              [ -n "$DECLARED" ] || echo "::notice::external-networks: 'auto' found no external network in the configuration"
              NAMES+="$DECLARED"$'\n'
            else
              NAMES+="$NAME"$'\n'
            fi
          done

          while IFS= read -r NAME; do
            [ -n "$NAME" ] || continue
            if docker network inspect "$NAME" > /dev/null 2>&1; then
              echo "🌐 $NAME exists already - left as it is"
            else
              docker network create "$NAME" > /dev/null
              echo "$NAME" >> "$ROUNDTRIP_DIR/created-networks.txt"
              echo "🌐 Created $NAME"
            fi
          done < <(printf '%s' "$NAMES" | sort -u)

      - name: "🔐 Log in to GitHub Container Registry"
        if: inputs.registry-login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # upgrade-from: the previous release takes the image references the
      # services resolve to, so Compose starts it like an installed release.
      # The images under test wait under staging tags until Upgrade Stack.
      - name: "⏮️ Pull Previous Release"
        id: previous
        if: inputs.upgrade-from != ''
        # Tested by .github/workflows/tests/backup-roundtrip-module.test.sh
        env:
          UPGRADE_FROM: ${{ inputs.upgrade-from }}
          BUILD_IMAGES: ${{ inputs.build-images }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONFIG="$ROUNDTRIP_DIR/compose-config.json"
          TAG_RE='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'

          # One spec per upgraded service: a tag, a full reference or
          # latest-release. A plain value applies to every build-images service.
          if [[ "$UPGRADE_FROM" == \{* ]]; then
            PLAN="$UPGRADE_FROM"
          else
            PLAN=$(jq -c --arg v "$UPGRADE_FROM" 'map({key: .service, value: $v}) | from_entries' <<< "$BUILD_IMAGES")
          fi
          REQUESTED="$PLAN"

          RELEASE=""
          if jq -e 'any(.[]; . == "latest-release")' <<< "$PLAN" > /dev/null; then
            if ! RESPONSE=$(curl -fsSL --retry 3 \
                 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                 "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest"); then
              echo "::error title=Backup round trip::upgrade-from: $GITHUB_REPOSITORY has no published release to upgrade from (GET releases/latest failed)"
              exit 1
            fi
            RELEASE=$(jq -r '.tag_name // empty' <<< "$RESPONSE")
            IMAGE_TAG="${RELEASE#v}"
            if [[ ! "$IMAGE_TAG" =~ $TAG_RE ]]; then
              echo "::error title=Backup round trip::upgrade-from: the latest release '$RELEASE' does not give an image tag - name the tag instead of 'latest-release'"
              exit 1
            fi
            echo "⏮️ Latest release of $GITHUB_REPOSITORY: $RELEASE (image tag $IMAGE_TAG)"
            PLAN=$(jq -c --arg t "$IMAGE_TAG" 'map_values(if . == "latest-release" then $t else . end)' <<< "$PLAN")
          fi

          : > "$ROUNDTRIP_DIR/previous-images.txt"
          : > "$ROUNDTRIP_DIR/upgrade-plan.tsv"
          PREVIOUS='{}'
          ENTRIES=$(jq -r 'to_entries[] | "\(.key)\t\(.value)"' <<< "$PLAN")
          while IFS=$'\t' read -r SERVICE SPEC; do
            REF=$(jq -r --arg s "$SERVICE" '.services[$s].image // empty' "$CONFIG")
            if [ -z "$REF" ]; then
              echo "::error title=Backup round trip::upgrade-from: service '$SERVICE' has no image reference in the configuration the previous release starts from"
              exit 1
            fi
            # A digest names one exact registry image: Docker refuses to tag
            # another image as it, so the previous release cannot take it.
            if [[ "$REF" == *@* ]]; then
              echo "::error title=Backup round trip::upgrade-from: service '$SERVICE' pins its image by digest ($REF) - no other image can be tagged as a digest reference. Give the service a tag for the round trip (env-overrides or a CI-only override file)."
              exit 1
            fi
            if [[ "$SPEC" == *[/:@]* ]]; then
              OLD="$SPEC"
            else
              # The repository of the reference the service resolves to, with
              # the release's tag: ghcr.io/acme/app:stable -> ghcr.io/acme/app:1.4.2
              REPOSITORY="$REF"
              [[ "${REPOSITORY##*/}" != *:* ]] || REPOSITORY="${REPOSITORY%:*}"
              OLD="$REPOSITORY:$SPEC"
            fi
            echo "::group::⏮️ $SERVICE: $OLD"
            if ! docker pull "$OLD"; then
              echo "::endgroup::"
              # A release exists before its images do: the release is created
              # first and its image jobs push the tags minutes later - or
              # never, when one of them failed.
              HINT=""
              if [ "$(jq -r --arg s "$SERVICE" '.[$s]' <<< "$REQUESTED")" = "latest-release" ]; then
                HINT=" $RELEASE is the latest release, but its images may not be published yet - its image jobs push them after the release is created, or failed to. Re-run once they are published (re-run a failed image job), or set upgrade-from to the release before until then."
              fi
              echo "::error title=Backup round trip::upgrade-from: '$OLD' could not be pulled - is the previous release published under that tag, and may this job read it (registry-login, packages: read)?$HINT"
              exit 1
            fi
            echo "::endgroup::"
            docker tag "$OLD" "$REF"
            echo "$REF" >> "$ROUNDTRIP_DIR/previous-images.txt"
            printf '%s\t%s\t%s\n' "$SERVICE" "$OLD" "$REF" >> "$ROUNDTRIP_DIR/upgrade-plan.tsv"
            PREVIOUS=$(jq -c --arg s "$SERVICE" --arg o "$OLD" '. + {($s): $o}' <<< "$PREVIOUS")
            echo "✅ $SERVICE starts as $OLD (tagged $REF)"
          done <<< "$ENTRIES"

          # For the scripts: what the stack started from.
          echo "ROUNDTRIP_PREVIOUS_RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "ROUNDTRIP_PREVIOUS_IMAGES=$PREVIOUS" >> "$GITHUB_ENV"

      # Each image is tagged with the exact reference its compose service
      # resolves to, so Compose starts the build instead of pulling the
      # released image - whether the reference comes from an env variable or is
      # written literally in the compose file.
      - name: "🐳 Build Images Under Test"
        id: build
        if: inputs.build-images != ''
        # Tested by .github/workflows/tests/backup-roundtrip-module.test.sh
        env:
          BUILD_IMAGES: ${{ inputs.build-images }}
        run: |
          set -euo pipefail
          CONFIG="$ROUNDTRIP_DIR/compose-config.json"
          UPGRADE_PLAN="$ROUNDTRIP_DIR/upgrade-plan.tsv"
          : > "$ROUNDTRIP_DIR/built-images.txt"

          COUNT=$(jq 'length' <<< "$BUILD_IMAGES")
          for ((i = 0; i < COUNT; i++)); do
            ENTRY=$(jq -c --argjson i "$i" '.[$i]' <<< "$BUILD_IMAGES")
            SERVICE=$(jq -r '.service' <<< "$ENTRY")
            CONTEXT=$(jq -r '.context' <<< "$ENTRY")
            DOCKERFILE=$(jq -r '.dockerfile // empty' <<< "$ENTRY")
            TARGET=$(jq -r '.target // empty' <<< "$ENTRY")
            IMAGE_REF=$(jq -r --arg s "$SERVICE" '.services[$s].image // empty' "$CONFIG")

            if [ -z "$IMAGE_REF" ]; then
              echo "::error title=Backup round trip::build-images: service '$SERVICE' has no image reference in the active configuration (unknown service, inactive profile, or no 'image:' key)"
              exit 1
            fi
            # A digest names one exact registry image; no build can be tagged
            # as it, and Compose would start the registry's image instead.
            if [[ "$IMAGE_REF" == *@* ]]; then
              echo "::error title=Backup round trip::build-images: service '$SERVICE' pins its image by digest ($IMAGE_REF) - a build cannot be tagged as a digest reference, so the stack would run the registry's image. Give the service a tag for the round trip (env-overrides or a CI-only override file)."
              exit 1
            fi

            ARGS=(--pull)
            UPGRADED=false
            if [ -f "$UPGRADE_PLAN" ]; then
              # upgrade-from: every build also waits under a staging tag for
              # Upgrade Stack. A service the previous release runs is NOT
              # tagged as its reference yet - the old image holds it.
              STAGED="roundtrip-staged/image-$i:build"
              ARGS+=(--tag "$STAGED")
              printf '%s\t%s\n' "$SERVICE" "$STAGED" >> "$ROUNDTRIP_DIR/staged-images.txt"
              if cut -f 1 "$UPGRADE_PLAN" | grep -qxF "$SERVICE"; then
                UPGRADED=true
              fi
            fi
            if [ "$UPGRADED" = "false" ]; then
              ARGS+=(--tag "$IMAGE_REF")
            fi
            [ -z "$DOCKERFILE" ] || ARGS+=(--file "$DOCKERFILE")
            [ -z "$TARGET" ] || ARGS+=(--target "$TARGET")
            while IFS= read -r BUILD_ARG; do
              [ -z "$BUILD_ARG" ] || ARGS+=(--build-arg "$BUILD_ARG")
            done < <(jq -r '."build-args" // empty
                            | if type == "object" then to_entries[] | "\(.key)=\(.value)"
                              else split("\n")[] end' <<< "$ENTRY")

            if [ "$UPGRADED" = "true" ]; then
              echo "::group::🐳 $SERVICE -> $STAGED (takes over $IMAGE_REF at the upgrade)"
              docker build "${ARGS[@]}" "$CONTEXT"
              echo "::endgroup::"
              echo "✅ Built $STAGED from $CONTEXT - the previous release runs first"
              continue
            fi
            echo "::group::🐳 $SERVICE -> $IMAGE_REF"
            docker build "${ARGS[@]}" "$CONTEXT"
            echo "::endgroup::"
            echo "$IMAGE_REF" >> "$ROUNDTRIP_DIR/built-images.txt"
            echo "✅ Built $IMAGE_REF from $CONTEXT"
          done

      - name: "📥 Pull Images"
        id: pull
        # Tested by .github/workflows/tests/backup-roundtrip-module.test.sh
        run: |
          set -euo pipefail
          touch "$ROUNDTRIP_DIR/built-images.txt" "$ROUNDTRIP_DIR/previous-images.txt"
          # The images under test and the previous release's (upgrade-from)
          # are local; pulling their references would replace them.
          BUILT=$(cat "$ROUNDTRIP_DIR/built-images.txt" "$ROUNDTRIP_DIR/previous-images.txt" \
            | jq -R -s 'split("\n") | map(select(length > 0))')
          read -r -a SERVICES <<< "$(echo "$START_SERVICES" | tr '\n' ' ')"
          STARTED=$(jq -n '$ARGS.positional' --args "${SERVICES[@]}")
          # Only what Start Stack starts: the 'services' input plus everything
          # they depend on, transitively - or every service when 'services' is
          # empty. Pulling the rest costs minutes and disk for images no step
          # uses (CS-n8n pulled ten worker and runner images it never starts).
          # Of those, everything except what was just built (pulling those
          # references would replace the images under test with the released
          # ones) and services with a build section, which 'up' builds itself
          # when the image is missing. A dependency missed here is not fatal:
          # 'up' pulls a missing image itself.
          mapfile -t PULL < <(jq -r --argjson built "$BUILT" --argjson started "$STARTED" '
              .services as $all
              | (if ($started | length) == 0 then ($all | keys)
                 else {todo: $started, seen: []}
                      | until(.todo | length == 0;
                          .seen += .todo
                          | .todo = (([.todo[] | ($all[.].depends_on // {})
                                       | if type == "array" then .[] else keys[] end] | unique) - .seen))
                      | .seen
                 end) as $needed
              | $all | to_entries[]
              | select(.key as $name | $needed | index($name))
              | select(.value.image != null and .value.build == null)
              | select(.value.image as $image | $built | index($image) | not)
              | .key' "$ROUNDTRIP_DIR/compose-config.json")
          if [ ${#PULL[@]} -eq 0 ]; then
            echo "Nothing to pull"
            exit 0
          fi
          echo "Pulling: ${PULL[*]}"
          docker compose pull --quiet "${PULL[@]}"

      # Before the stack, so the sidecar finds its destination from its first
      # run on. The bucket is created here: a caller's config may set
      # ensure_bucket to false, as it would against a real provider.
      - name: "🪣 Start S3 Server"
        id: s3-start
        if: inputs.s3-destination
        run: |
          set -euo pipefail
          source "$ROUNDTRIP_DIR/lib.sh"
          docker compose up -d --wait --wait-timeout "$WAIT_TIMEOUT" "$ROUNDTRIP_S3_SERVICE"
          s3c mb --ignore-existing "rt/$ROUNDTRIP_S3_BUCKET"
          echo "✅ $ROUNDTRIP_S3_SERVICE is up, bucket $ROUNDTRIP_S3_BUCKET is empty"

      - name: "🚀 Start Stack"
        run: |
          set -euo pipefail
          read -r -a SERVICES <<< "$(echo "$START_SERVICES" | tr '\n' ' ')"
          # --wait returns once every started service is running (or healthy, if
          # it has a healthcheck) and one-shot dependencies have completed.
          docker compose up -d --wait --wait-timeout "$WAIT_TIMEOUT" "${SERVICES[@]}"
          docker compose ps

          STATE=$(docker compose ps --format '{{.Service}} {{.State}}' | awk -v s="$BACKUP_SERVICE" '$1 == s {print $2}')
          if [ "$STATE" != "running" ]; then
            echo "::error title=Backup round trip::backup service '$BACKUP_SERVICE' is not running (state: ${STATE:-not started}). It must run as a daemon."
            exit 1
          fi

      # upgrade-from: the upgrade test means nothing unless the stack that
      # seeds and backs up really is the previous release. 'up' can replace
      # it: a service with 'pull_policy: always' pulls the reference from the
      # registry, one with 'pull_policy: build' builds it.
      - name: "⏮️ Check Previous Release"
        id: previous-running
        if: inputs.upgrade-from != ''
        # Tested by .github/workflows/tests/backup-roundtrip-module.test.sh
        run: |
          set -euo pipefail
          CONFIG="$ROUNDTRIP_DIR/compose-config.json"
          short_id() { local id="${1#sha256:}"; echo "${id:0:12}"; }
          ERRORS=0
          fail() { echo "::error title=Backup round trip::$1"; ERRORS=$((ERRORS + 1)); }

          # Per reference the previous image it was tagged with last - that
          # tag is the one that held.
          while IFS=$'\t' read -r REF OLD; do
            WANT=$(docker image inspect --format '{{.Id}}' "$OLD")
            NOW=$(docker image inspect --format '{{.Id}}' "$REF" 2> /dev/null || true)
            if [ "$NOW" != "$WANT" ]; then
              fail "upgrade-from: 'up' replaced $REF, which held the previous release $OLD ($(short_id "$WANT") -> $(short_id "${NOW:-none}")) - a service on it pulls (pull_policy: always) or builds (pull_policy: build) its image itself. Set pull_policy to missing or never for the round trip, e.g. in a CI-only override file."
              continue
            fi
            CHECKED=0
            for SERVICE in $(jq -r --arg r "$REF" '.services | to_entries[] | select(.value.image == $r) | .key' "$CONFIG"); do
              for CONTAINER in $(docker compose ps -a -q "$SERVICE"); do
                RUNNING=$(docker inspect --format '{{.Image}}' "$CONTAINER")
                [ "$RUNNING" = "$WANT" ] || fail "upgrade-from: '$SERVICE' runs $(short_id "$RUNNING"), not the previous release $OLD ($(short_id "$WANT"))"
                CHECKED=$((CHECKED + 1))
              done
            done
            if [ "$CHECKED" -eq 0 ]; then
              echo "::warning::upgrade-from: no started service runs $REF - the upgrade of $OLD is not tested"
            else
              echo "⏮️ $CHECKED container(s) on $REF run the previous release $OLD"
            fi
          done < <(tac "$ROUNDTRIP_DIR/upgrade-plan.tsv" | awk -F '\t' '!seen[$3]++ {print $3 "\t" $2}')

          [ "$ERRORS" -eq 0 ] || exit 1
          echo "✅ The stack runs the previous release - the upgrade starts from it"

      - name: "🧪 Seed Test Data"
        id: seed
        if: inputs.seed-script != ''
        env:
          SEED_SCRIPT: ${{ inputs.seed-script }}
          CHECK_SCRIPT: ${{ inputs.check-script }}
        run: |
          set -euo pipefail
          source "$ROUNDTRIP_DIR/lib.sh"
          run_phase seed "$SEED_SCRIPT"
          # The check must see the data before anything else counts.
          run_phase check "$CHECK_SCRIPT" present
          echo "✅ Seeded data is present (marker $ROUNDTRIP_MARKER)"

      - name: "💾 Create Backup"
        id: create
        # Tested by .github/workflows/tests/backup-roundtrip-module.test.sh
        run: |
          set -euo pipefail
          source "$ROUNDTRIP_DIR/lib.sh"
          SID_RE='^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}$'

          # Local snapshots only (size > 0); off-site-only rows report 0 bytes.
          local_ids() { awk -v re="$SID_RE" '$1 ~ re && $2 > 0 {print $1}' | sort; }

          LIST_BEFORE=$(bh list)
          local_ids <<< "$LIST_BEFORE" > "$ROUNDTRIP_DIR/ids-before.txt"

          # The exit code is kept rather than ending the step here. Since
          # BackupHelper 1.7.7 'create' exits 1 when a component failed, but the
          # snapshot is still stored - its id and manifest are what tells which
          # component failed and why, so they are resolved before the step fails.
          set +e
          bh create 2>&1 | tee "$ROUNDTRIP_DIR/diagnostics/create.log"
          CREATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "create-exit-code=$CREATE_EXIT" >> "$GITHUB_OUTPUT"

          if ! LIST_AFTER=$(bh list); then
            echo "::error title=Backup round trip::'backuphelper list' failed after 'backuphelper create' (exit code $CREATE_EXIT) - the sidecar is probably no longer running, see the service logs in the diagnostics artifact."
            exit 1
          fi
          echo "$LIST_AFTER"
          local_ids <<< "$LIST_AFTER" > "$ROUNDTRIP_DIR/ids-after.txt"
          mapfile -t NEW_IDS < <(comm -13 "$ROUNDTRIP_DIR/ids-before.txt" "$ROUNDTRIP_DIR/ids-after.txt")

          if [ ${#NEW_IDS[@]} -eq 0 ]; then
            if [ "$CREATE_EXIT" -ne 0 ]; then
              echo "::error title=Backup round trip::'backuphelper create' exited $CREATE_EXIT and stored no local snapshot - the run aborted (a pre_backup hook, a full disk) or the snapshot was stored on no destination. See create.log in the diagnostics artifact."
            else
              echo "::error title=Backup round trip::'backuphelper create' exited 0 but no new local snapshot appeared. Check that the config defines at least one job (a config the engine does not recognise runs zero jobs) and that keep_local is not dropping it."
            fi
            exit 1
          fi
          if [ ${#NEW_IDS[@]} -gt 1 ]; then
            echo "::warning::${#NEW_IDS[@]} new snapshots (a scheduled run fired as well) - using the newest"
          fi
          SNAPSHOT_ID="${NEW_IDS[-1]}"
          if [[ ! "$SNAPSHOT_ID" =~ $SID_RE ]]; then
            echo "::error::unexpected snapshot id format"; exit 1
          fi
          echo "snapshot-id=$SNAPSHOT_ID" >> "$GITHUB_OUTPUT"
          echo "ROUNDTRIP_SNAPSHOT_ID=$SNAPSHOT_ID" >> "$GITHUB_ENV"

          if [ "$CREATE_EXIT" -ne 0 ]; then
            echo "::error title=Backup round trip::'backuphelper create' exited $CREATE_EXIT: snapshot $SNAPSHOT_ID was stored, but the run ended in error - usually a failed component. Inspect Snapshot below names it."
            exit 1
          fi
          echo "✅ Snapshot $SNAPSHOT_ID created"

      # Also after a failed create, as long as it stored a snapshot: the
      # manifest names the failed component and its error, which 'create'
      # itself does not print for every source type. The job is failed by
      # Create Backup either way; the steps after this one do not run.
      - name: "📋 Inspect Snapshot"
        id: inspect
        if: ${{ !cancelled() && steps.create.outputs.snapshot-id != '' }}
        env:
          REQUIRE_COMPONENTS: ${{ inputs.require-components }}
          ALLOW_WARNINGS: ${{ inputs.allow-component-warnings }}
          SNAPSHOT_ID: ${{ steps.create.outputs.snapshot-id }}
        run: |
          set -euo pipefail
          set -f # require-components is split on whitespace below, never globbed
          source "$ROUNDTRIP_DIR/lib.sh"
          MANIFEST="$ROUNDTRIP_DIR/diagnostics/manifest.json"
          bh show "$SNAPSHOT_ID" > "$MANIFEST"
          jq -e 'type == "object"' "$MANIFEST" > /dev/null || { echo "::error::'show' did not print a JSON manifest"; cat "$MANIFEST"; exit 1; }

          # Warnings as a list of strings, whatever shape a plugin source writes.
          WARNINGS_DEF='def warnings: (.metadata.warnings // []) | if type == "array" then map(tostring) else [tostring] end;'

          echo "components=$(jq -c '[.components[] | {name, kind, size, error}]' "$MANIFEST")" >> "$GITHUB_OUTPUT"
          jq -r "$WARNINGS_DEF"'.components[] | "  \(.name) (\(.kind)): \(.size) bytes, error: \(.error // "none"), warnings: \(warnings | length)"' "$MANIFEST"

          ERRORS=0
          fail() { echo "::error title=Backup round trip::$1"; ERRORS=$((ERRORS + 1)); }

          [ "$(jq -r '.snapshot_id' "$MANIFEST")" = "$SNAPSHOT_ID" ] || fail "manifest belongs to another snapshot"
          [ -n "$(jq -r '.archive_sha256 // empty' "$MANIFEST")" ] || fail "manifest has no archive_sha256 - verify and restore cannot check the archive"
          [ "$(jq '.components | length' "$MANIFEST")" -gt 0 ] || fail "snapshot has no components"

          # Captured first, not read from a process substitution: there a jq
          # error is ignored and the gate would pass with nothing checked.
          FAILED=$(jq -r '.components[] | select(.error != null) | "\(.name)\t\(.error)"' "$MANIFEST")
          WARNED=$(jq -r "$WARNINGS_DEF"'.components[] | select(warnings | length > 0)
                          | "\(.name)\t\(warnings | join("; "))"' "$MANIFEST")

          while IFS=$'\t' read -r NAME ERROR; do
            [ -n "$NAME" ] || continue
            fail "component '$NAME' failed: $ERROR"
          done <<< "$FAILED"

          while IFS=$'\t' read -r NAME WARNINGS; do
            [ -n "$NAME" ] || continue
            if [ "$ALLOW_WARNINGS" = "true" ]; then
              echo "::warning::component '$NAME' reported warnings: $WARNINGS"
            else
              fail "component '$NAME' reported warnings (set allow-component-warnings to accept): $WARNINGS"
            fi
          done <<< "$WARNED"

          for NAME in ${REQUIRE_COMPONENTS//,/ }; do
            jq -e --arg n "$NAME" 'any(.components[]; .name == $n)' "$MANIFEST" > /dev/null \
              || fail "required component '$NAME' is missing - its source is disabled, skipped or misnamed (components: $(jq -r '[.components[].name] | join(", ")' "$MANIFEST"))"
          done

          [ "$ERRORS" -eq 0 ] || exit 1
          echo "✅ All $(jq '.components | length' "$MANIFEST") component(s) were backed up without errors"

      - name: "🔍 Verify Snapshot"
        env:
          SNAPSHOT_ID: ${{ steps.create.outputs.snapshot-id }}
        run: |
          set -euo pipefail
          source "$ROUNDTRIP_DIR/lib.sh"
          OUTPUT=$(bh verify "$SNAPSHOT_ID")
          echo "$OUTPUT"
          [ "$OUTPUT" = "OK $SNAPSHOT_ID" ] || { echo "::error::verify did not confirm the archive checksum"; exit 1; }

      # A failed S3 upload does not fail 'create': the run ends in 'warning'
      # and exits 0, because the local copy exists. Only the bucket shows
      # whether the off-site copy is there.
      - name: "🪣 Check Off-Site Copy"
        id: s3-upload
        if: inputs.s3-destination
        # Tested by .github/workflows/tests/backup-roundtrip-module.test.sh
        env:
          SNAPSHOT_ID: ${{ steps.create.outputs.snapshot-id }}
        run: |
          set -euo pipefail
          source "$ROUNDTRIP_DIR/lib.sh"
          OBJECTS="$ROUNDTRIP_DIR/diagnostics/s3-objects.json"
          LISTING=$(s3c ls --recursive --json "rt/$ROUNDTRIP_S3_BUCKET")
          # One JSON object per line; anything else the client prints is not
          # an object.
          grep '^{' <<< "$LISTING" > "$OBJECTS" || true
          # name<TAB>size of every object, the name without the caller's prefix
          OBJECT_SIZES=$(jq -r 'select(.key != null and (.type // "file") == "file")
                                | "\(.key | split("/") | last)\t\(.size)"' "$OBJECTS")
          echo "Objects in s3://$ROUNDTRIP_S3_BUCKET:"
          while IFS= read -r LINE; do echo "  $LINE"; done <<< "${OBJECT_SIZES:-<none>}"

          LOCAL_SIZE=$(bh list | awk -v id="$SNAPSHOT_ID" '$1 == id {print $2}')
          ARCHIVE=$(awk -F '\t' -v id="$SNAPSHOT_ID" \
            '$1 == id ".tar.gz" || $1 == id ".tar.gz.age" || $1 == id ".tar.gz.gpg"' <<< "$OBJECT_SIZES")
          MANIFEST=$(awk -F '\t' -v name="$SNAPSHOT_ID.manifest.json" '$1 == name && $2 > 0' <<< "$OBJECT_SIZES")

          ERRORS=0
          fail() { echo "::error title=Backup round trip::$1"; ERRORS=$((ERRORS + 1)); }
          [ -n "$MANIFEST" ] || fail "the manifest $SNAPSHOT_ID.manifest.json is not in the bucket"
          if [ -z "$ARCHIVE" ]; then
            fail "the archive of snapshot $SNAPSHOT_ID is not in the bucket"
          elif [ "$(cut -f 2 <<< "$ARCHIVE")" != "$LOCAL_SIZE" ]; then
            fail "the archive in the bucket has $(cut -f 2 <<< "$ARCHIVE") bytes, the local one ${LOCAL_SIZE:-?}"
          fi
          if [ "$ERRORS" -gt 0 ]; then
            echo "The upload failed or was skipped - 'create' exits 0 in that case. The reason is in create.log and the sidecar's log (artifact). Check that s3-env names the variables the compose file builds the S3 destination from."
            exit 1
          fi
          echo "✅ Snapshot $SNAPSHOT_ID is in s3://$ROUNDTRIP_S3_BUCKET: $(cut -f 1 <<< "$ARCHIVE") ($LOCAL_SIZE bytes, same as the local copy) and its manifest"

      # The previous release has seeded and backed up. Now the upgrade an
      # operator does: what the release notes say (upgrade-script), the
      # compose files of the new release, its images under the references the
      # services already use - like 'docker compose pull' - and 'up -d', which
      # recreates every container whose image changed. The snapshot taken
      # before stays for the restore below, which the NEW sidecar runs.
      - name: "⬆️ Upgrade Stack"
        id: upgrade
        if: inputs.upgrade-from != ''
        # Tested by .github/workflows/tests/backup-roundtrip-module.test.sh
        env:
          UPGRADE_SCRIPT: ${{ inputs.upgrade-script }}
          CHECK_SCRIPT: ${{ inputs.check-script }}
          RUN_HEALTHCHECK: ${{ inputs.run-healthcheck }}
        run: |
          set -euo pipefail
          source "$ROUNDTRIP_DIR/lib.sh"
          read -r -a SERVICES <<< "$(echo "$START_SERVICES" | tr '\n' ' ')"
          CONFIG="$ROUNDTRIP_DIR/compose-config.json"

          # Like prepare-script's, everything the hook adds to or changes in
          # the .env is masked: release notes may have it generate a secret
          # the new release needs.
          if [ -n "$UPGRADE_SCRIPT" ]; then
            cp .env "$ROUNDTRIP_DIR/env.before-upgrade"
            run_phase upgrade "$UPGRADE_SCRIPT"
            [ -f .env ] || { echo "::error title=Backup round trip::upgrade-script removed the .env"; exit 1; }
            mask_env_changes "$ROUNDTRIP_DIR/env.before-upgrade"
            rm -f "$ROUNDTRIP_DIR/env.before-upgrade"
            echo "🔐 upgrade-script set $MASKED value(s) in the .env, all masked"
          fi

          # The files of this commit, plus the module's own override files.
          COMPOSE_FILE="$ROUNDTRIP_COMPOSE_FILE_TARGET${ROUNDTRIP_COMPOSE_EXTRA:+:$ROUNDTRIP_COMPOSE_EXTRA}"
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          docker compose config --quiet
          docker compose config --format json > "$CONFIG"

          # The new release's images take over the references the services
          # resolve to - also a reference the upgrade-script changed. Each
          # reference is recorded with the id of the build it now holds.
          touch "$ROUNDTRIP_DIR/built-images.txt"
          EXPECTED="$ROUNDTRIP_DIR/upgrade-images.tsv"
          : > "$EXPECTED"
          while IFS=$'\t' read -r SERVICE STAGED; do
            REF=$(jq -r --arg s "$SERVICE" '.services[$s].image // empty' "$CONFIG")
            if [ -z "$REF" ]; then
              echo "::error title=Backup round trip::upgrade: service '$SERVICE' has no image reference in the configuration of this commit"
              exit 1
            fi
            docker tag "$STAGED" "$REF"
            printf '%s\t%s\n' "$REF" "$(docker image inspect --format '{{.Id}}' "$STAGED")" >> "$EXPECTED"
            grep -qxF "$REF" "$ROUNDTRIP_DIR/built-images.txt" || echo "$REF" >> "$ROUNDTRIP_DIR/built-images.txt"
            echo "⬆️ $SERVICE: $REF is now the image built from this commit"
          done < "$ROUNDTRIP_DIR/staged-images.txt"

          docker compose up -d --wait --wait-timeout "$WAIT_TIMEOUT" "${SERVICES[@]}"
          docker compose ps

          # Checked against the build ids recorded before 'up', never against
          # what the references hold after it: a service with 'pull_policy:
          # always' pulls the released image over its reference at 'up', one
          # with 'pull_policy: build' builds its own - its containers would
          # then match the reference and the stack would run that image.
          # Compose also recreates a container only when it sees its image
          # changed. The last row per reference is the tag that held.
          short_id() { local id="${1#sha256:}"; echo "${id:0:12}"; }
          STALE=0
          while IFS=$'\t' read -r REF WANT; do
            NOW=$(docker image inspect --format '{{.Id}}' "$REF" 2> /dev/null || true)
            if [ "$NOW" != "$WANT" ]; then
              echo "::error title=Backup round trip::upgrade: 'up' replaced the image under test $REF ($(short_id "$WANT") -> $(short_id "${NOW:-none}")) - a service on it pulls (pull_policy: always) or builds (pull_policy: build) its image itself, so the stack would not run the build of this commit. Set pull_policy to missing or never for the round trip, e.g. in a CI-only override file."
              STALE=1
            fi
            for SERVICE in $(jq -r --arg r "$REF" '.services | to_entries[] | select(.value.image == $r) | .key' "$CONFIG"); do
              for CONTAINER in $(docker compose ps -a -q "$SERVICE"); do
                RUNNING=$(docker inspect --format '{{.Image}}' "$CONTAINER")
                if [ "$RUNNING" != "$WANT" ]; then
                  echo "::error title=Backup round trip::upgrade: '$SERVICE' runs $(short_id "$RUNNING") after 'up -d', not the build of this commit $(short_id "$WANT") ($REF)"
                  STALE=1
                fi
              done
            done
          done < <(tac "$EXPECTED" | awk -F '\t' '!seen[$1]++')
          [ "$STALE" -eq 0 ] || exit 1
          echo "✅ Every container of an image under test runs the build of this commit"

          # The installation the operator now has: data intact, and the new
          # sidecar healthy with the previous release's snapshots and records.
          if [ -n "$CHECK_SCRIPT" ]; then
            run_phase check "$CHECK_SCRIPT" present
          fi
          if [ "$RUN_HEALTHCHECK" = "true" ]; then
            bh healthcheck
          fi
          echo "✅ Upgraded from ${ROUNDTRIP_PREVIOUS_RELEASE:-the previous release}: data intact, the new sidecar is healthy"

      - name: "🗑️ Remove Seeded Data"
        id: mutate
        if: inputs.mutate-script != ''
        env:
          MUTATE_SCRIPT: ${{ inputs.mutate-script }}
          CHECK_SCRIPT: ${{ inputs.check-script }}
        run: |
          set -euo pipefail
          source "$ROUNDTRIP_DIR/lib.sh"
          run_phase mutate "$MUTATE_SCRIPT"
          # Proves the check can tell the difference - otherwise a restore that
          # does nothing would pass.
          run_phase check "$CHECK_SCRIPT" absent
          echo "✅ Seeded data is gone"

      # Disaster recovery onto a new host: the sidecar's container and its
      # data dir are gone, only the bucket is left. The restore below then has
      # to pull the snapshot back from S3 (hydration) - the local copy that
      # every other round trip restores from no longer exists.
      - name: "🖥️ Simulate New Host"
        id: new-host
        if: inputs.s3-destination
        # Tested by .github/workflows/tests/backup-roundtrip-module.test.sh
        env:
          SNAPSHOT_ID: ${{ steps.create.outputs.snapshot-id }}
        run: |
          set -euo pipefail
          source "$ROUNDTRIP_DIR/lib.sh"
          CONTAINER=$(docker compose ps -q "$BACKUP_SERVICE")
          if [ -z "$CONTAINER" ]; then
            echo "::error title=Backup round trip::'$BACKUP_SERVICE' is not running"
            exit 1
          fi
          IMAGE=$(docker inspect --format '{{.Image}}' "$CONTAINER")
          DATA_DIR=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$CONTAINER" \
            | sed -n 's/^BACKUP_DATA_DIR=//p' | tail -n 1)
          DATA_DIR="${DATA_DIR:-/data}"
          [ "$DATA_DIR" = "/" ] || DATA_DIR="${DATA_DIR%/}"
          # The mount the data dir lives on: its own, or the deepest one above
          # it (a /data volume that holds the data dir /data/backups).
          MOUNT=$(docker inspect --format '{{json .Mounts}}' "$CONTAINER" \
            | jq -c --arg d "$DATA_DIR" 'map(select(.Destination as $m | $m == $d or ($d | startswith(($m | rtrimstr("/")) + "/"))))
                                         | max_by(.Destination | length) // empty')

          docker compose rm --stop --force "$BACKUP_SERVICE"
          if [ -z "$MOUNT" ]; then
            echo "🧹 $DATA_DIR is not on a mount - it went with the container"
          else
            DESTINATION=$(jq -r '.Destination' <<< "$MOUNT")
            # The data dir below the mount point: empty, or e.g. /backups.
            SUBPATH="${DATA_DIR#"${DESTINATION%/}"}"
            case "$(jq -r '.Type' <<< "$MOUNT")" in
              volume) SOURCE=$(jq -r '.Name' <<< "$MOUNT") ;;
              bind)   SOURCE=$(jq -r '.Source' <<< "$MOUNT") ;;
              *)
                echo "::error title=Backup round trip::the data dir $DATA_DIR of '$BACKUP_SERVICE' is on a $(jq -r '.Type' <<< "$MOUNT") mount - only volumes and bind mounts can be wiped"
                exit 1 ;;
            esac
            # The volume may be mounted elsewhere too (read-only into the
            # application), so the data dir is emptied rather than the volume
            # removed - and only the data dir, not what else is on the mount.
            # The sidecar's own image does it, as root: nothing else has to be
            # pulled.
            docker run --rm --user 0:0 --entrypoint sh -v "$SOURCE:/wipe" "$IMAGE" \
              -c 'D="/wipe$1"; [ -d "$D" ] || exit 0; rm -rf "$D"/* "$D"/.[!.]* "$D"/..?* && [ -z "$(ls -A "$D")" ]' \
              wipe "$SUBPATH"
            echo "🧹 $DATA_DIR wiped (${SOURCE}${SUBPATH:+, $SUBPATH below the mount at $DESTINATION})"
          fi
          docker compose up -d --no-deps --wait --wait-timeout "$WAIT_TIMEOUT" "$BACKUP_SERVICE"

          LIST=$(bh list)
          echo "$LIST"
          # Rows: <id> <size> bytes [(off-site only)]
          LOCAL=$(awk '$3 == "bytes" && $2 > 0 {print $1}' <<< "$LIST")
          if [ -n "$LOCAL" ]; then
            echo "::error title=Backup round trip::local snapshots survived the wipe: $(tr '\n' ' ' <<< "$LOCAL")- the sidecar keeps them outside $DATA_DIR (its BACKUP_DATA_DIR), or on a mount this step did not find"
            exit 1
          fi
          if ! awk -v id="$SNAPSHOT_ID" '$1 == id && $3 == "bytes" && $2 == 0 {found = 1} END {exit !found}' <<< "$LIST"; then
            echo "::error title=Backup round trip::the new sidecar does not list snapshot $SNAPSHOT_ID as off-site - it does not reach the bucket"
            exit 1
          fi
          echo "✅ New host: no local snapshot, $SNAPSHOT_ID is listed off-site only"

      - name: "🔄 Restore Snapshot"
        id: restore
        env:
          SNAPSHOT_ID: ${{ steps.create.outputs.snapshot-id }}
          STOP_SERVICES: ${{ inputs.services-to-stop-before-restore }}
          RESTORE_COMMAND: ${{ inputs.restore-command }}
          RESTORE_ARGS: ${{ inputs.restore-args }}
        run: |
          set -euo pipefail
          source "$ROUNDTRIP_DIR/lib.sh"
          read -r -a STOP <<< "$(echo "$STOP_SERVICES" | tr '\n' ' ')"
          read -r -a COMMAND <<< "$RESTORE_COMMAND"
          read -r -a ARGS <<< "$RESTORE_ARGS"
          read -r -a SERVICES <<< "$(echo "$START_SERVICES" | tr '\n' ' ')"

          if [ ${#STOP[@]} -gt 0 ]; then
            echo "⏹️ Stopping ${STOP[*]}"
            docker compose stop "${STOP[@]}"
          fi

          bh "${COMMAND[@]}" "$SNAPSHOT_ID" "${ARGS[@]}" 2>&1 | tee "$ROUNDTRIP_DIR/diagnostics/restore.log"

          echo "🚀 Starting the stack again"
          docker compose up -d --wait --wait-timeout "$WAIT_TIMEOUT" "${SERVICES[@]}"
          docker compose ps

      - name: "🪣 Check Hydrated Snapshot"
        id: s3-hydrated
        if: inputs.s3-destination
        env:
          SNAPSHOT_ID: ${{ steps.create.outputs.snapshot-id }}
        run: |
          set -euo pipefail
          source "$ROUNDTRIP_DIR/lib.sh"
          LIST=$(bh list)
          echo "$LIST"
          # Local again only because the restore downloaded it.
          if ! awk -v id="$SNAPSHOT_ID" '$1 == id && $3 == "bytes" && $2 > 0 {found = 1} END {exit !found}' <<< "$LIST"; then
            echo "::error title=Backup round trip::snapshot $SNAPSHOT_ID is not local after the restore - it was not hydrated from S3"
            exit 1
          fi
          OUTPUT=$(bh verify "$SNAPSHOT_ID")
          echo "$OUTPUT"
          [ "$OUTPUT" = "OK $SNAPSHOT_ID" ] || { echo "::error::the snapshot hydrated from S3 does not match its checksum"; exit 1; }
          echo "✅ Snapshot $SNAPSHOT_ID was pulled back from s3://$ROUNDTRIP_S3_BUCKET and matches its checksum"

      - name: "🧪 Check Restored Data"
        id: check
        if: inputs.check-script != ''
        env:
          CHECK_SCRIPT: ${{ inputs.check-script }}
        run: |
          set -euo pipefail
          source "$ROUNDTRIP_DIR/lib.sh"
          run_phase check "$CHECK_SCRIPT" present
          echo "✅ Restored data matches the seeded data"

      - name: "🔍 Backup Healthcheck"
        id: healthcheck
        if: inputs.run-healthcheck
        run: |
          set -euo pipefail
          source "$ROUNDTRIP_DIR/lib.sh"
          bh healthcheck
          echo "✅ Sidecar reports the newest snapshot as fresh"

      - name: "📋 Collect Diagnostics"
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          # Best effort: the shell runs with -e, and the typical failure (a
          # sidecar that crashed or never started) makes 'exec' fail - which
          # must not cost the files collected after it.
          set +e
          if [ -z "${ROUNDTRIP_DIR:-}" ]; then
            echo "Nothing was started - no diagnostics to collect"
            exit 0
          fi
          DIAG="$ROUNDTRIP_DIR/diagnostics"
          mkdir -p "$DIAG/logs"
          docker compose ps -a > "$DIAG/ps.txt" 2>&1
          for SERVICE in $(docker compose config --services 2>/dev/null); do
            docker compose logs --no-color --timestamps "$SERVICE" > "$DIAG/logs/$SERVICE.log" 2>&1
          done
          timeout 60 docker compose exec -T "$BACKUP_SERVICE" backuphelper list > "$DIAG/snapshots.txt" 2>&1
          { df -h /; echo; free -m; echo; docker system df; } > "$DIAG/runner.txt" 2>&1
          # Generated override files hold .env references, never credentials.
          cp -f "$ROUNDTRIP_DIR"/*.compose.yml "$ROUNDTRIP_DIR/upgrade-plan.tsv" "$DIAG/" 2> /dev/null
          # The .env holds the generated secrets and is never collected.
          ls -la "$DIAG" "$DIAG/logs"

      - name: "📤 Upload Diagnostics"
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/backup-roundtrip/diagnostics
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore

      - name: "🧹 Tear Down Stack"
        if: always()
        continue-on-error: true
        run: |
          if [ -f .env ]; then
            docker compose down --volumes --remove-orphans --timeout 30
            rm -f .env
          fi
          # Only the networks this run created (external-networks); one that
          # existed before belongs to someone else.
          if [ -s "${ROUNDTRIP_DIR:-/nonexistent}/created-networks.txt" ]; then
            while IFS= read -r NAME; do
              if docker network rm "$NAME" > /dev/null; then echo "🌐 Removed $NAME"; fi
            done < "$ROUNDTRIP_DIR/created-networks.txt"
          fi

      - name: "📊 Summary"
        if: always()
        env:
          SNAPSHOT_ID: ${{ steps.create.outputs.snapshot-id }}
          CREATE_EXIT: ${{ steps.create.outputs.create-exit-code }}
          JOB_STATUS: ${{ job.status }}
          HAS_SEED: ${{ inputs.seed-script != '' }}
          HAS_MUTATE: ${{ inputs.mutate-script != '' }}
          HAS_CHECK: ${{ inputs.check-script != '' }}
          OUTCOME_SEED: ${{ steps.seed.outcome }}
          OUTCOME_CREATE: ${{ steps.create.outcome }}
          OUTCOME_INSPECT: ${{ steps.inspect.outcome }}
          OUTCOME_MUTATE: ${{ steps.mutate.outcome }}
          OUTCOME_RESTORE: ${{ steps.restore.outcome }}
          OUTCOME_CHECK: ${{ steps.check.outcome }}
          OUTCOME_HEALTH: ${{ steps.healthcheck.outcome }}
          RUN_HEALTHCHECK: ${{ inputs.run-healthcheck }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          HAS_UPGRADE: ${{ inputs.upgrade-from != '' }}
          OUTCOME_PREVIOUS: ${{ steps.previous.outcome }}
          OUTCOME_PREVIOUS_RUNNING: ${{ steps.previous-running.outcome }}
          OUTCOME_UPGRADE: ${{ steps.upgrade.outcome }}
          HAS_S3: ${{ inputs.s3-destination }}
          OUTCOME_S3_UPLOAD: ${{ steps.s3-upload.outcome }}
          OUTCOME_NEW_HOST: ${{ steps.new-host.outcome }}
          OUTCOME_S3_HYDRATED: ${{ steps.s3-hydrated.outcome }}
        run: |
          # outcome, configured -> status cell
          cell() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "⏹️ Cancelled" ;;
              *) if [ "$2" = "true" ]; then echo "⏭️ Not reached"; else echo "⚪ Not configured"; fi ;;
            esac
          }

          {
            echo "## 🧪 Backup Round-Trip Test"
            echo ""
            if [ "$JOB_STATUS" = "success" ]; then
              PASSED="✅ **Passed** - snapshot \`$SNAPSHOT_ID\` was created, verified and restored."
              if [ "$HAS_UPGRADE" = "true" ]; then
                PASSED+=" The previous release (${ROUNDTRIP_PREVIOUS_RELEASE:-see below}) took it; the images built from this commit restored it after the upgrade."
              fi
              if [ "$HAS_S3" = "true" ]; then
                PASSED+=" It reached the S3 bucket, and the restore pulled it back from there after the sidecar's local data was wiped."
              fi
              echo "$PASSED"
            else
              echo "❌ **Failed** - see the failed step below. Diagnostics are attached as the \`$ARTIFACT_NAME\` artifact."
            fi
            echo ""
            echo "| Phase | Result |"
            echo "|-------|--------|"
            # Rows of opt-in phases only when they are configured.
            [ "$HAS_UPGRADE" != "true" ] || echo "| Pull previous release | $(cell "$OUTCOME_PREVIOUS" true) |"
            [ "$HAS_UPGRADE" != "true" ] || echo "| Previous release runs | $(cell "$OUTCOME_PREVIOUS_RUNNING" true) |"
            echo "| Seed test data | $(cell "$OUTCOME_SEED" "$HAS_SEED") |"
            echo "| Create backup | $(cell "$OUTCOME_CREATE" true) |"
            echo "| Inspect snapshot | $(cell "$OUTCOME_INSPECT" true) |"
            [ "$HAS_S3" != "true" ] || echo "| Off-site copy in S3 | $(cell "$OUTCOME_S3_UPLOAD" true) |"
            [ "$HAS_UPGRADE" != "true" ] || echo "| Upgrade to this commit (data + healthcheck) | $(cell "$OUTCOME_UPGRADE" true) |"
            echo "| Remove seeded data | $(cell "$OUTCOME_MUTATE" "$HAS_MUTATE") |"
            [ "$HAS_S3" != "true" ] || echo "| New host: local data wiped | $(cell "$OUTCOME_NEW_HOST" true) |"
            echo "| Restore snapshot | $(cell "$OUTCOME_RESTORE" true) |"
            [ "$HAS_S3" != "true" ] || echo "| Snapshot pulled back from S3 | $(cell "$OUTCOME_S3_HYDRATED" true) |"
            echo "| Check restored data | $(cell "$OUTCOME_CHECK" "$HAS_CHECK") |"
            echo "| Backup healthcheck | $(cell "$OUTCOME_HEALTH" "$RUN_HEALTHCHECK") |"
            echo ""
            if [ -n "$CREATE_EXIT" ] && [ "$CREATE_EXIT" != "0" ]; then
              if [ -n "$SNAPSHOT_ID" ]; then
                echo "> ❌ \`backuphelper create\` exited $CREATE_EXIT. Snapshot \`$SNAPSHOT_ID\` was stored anyway; *Inspect snapshot* and its component table name what failed."
              else
                echo "> ❌ \`backuphelper create\` exited $CREATE_EXIT and stored no local snapshot - see \`create.log\` in the diagnostics artifact."
              fi
              echo ""
            fi
            if [ "$HAS_CHECK" != "true" ]; then
              echo "> ⚠️ No check-script: only the backup mechanics were tested, not whether the data comes back."
              echo ""
            elif [ "$HAS_MUTATE" != "true" ]; then
              echo "> ⚠️ No mutate-script: the restore ran over intact data, so a restore that writes nothing would also pass."
              echo ""
            fi

            MANIFEST="${ROUNDTRIP_DIR:-/nonexistent}/diagnostics/manifest.json"
            if [ -s "$MANIFEST" ] && jq -e '.components' "$MANIFEST" > /dev/null 2>&1; then
              echo "### 📦 Snapshot \`$SNAPSHOT_ID\`"
              echo ""
              echo "| Component | Kind | Size | Status |"
              echo "|-----------|------|------|--------|"
              jq -r '.components[] | "| `\(.name)` | \(.kind) | \(.size) bytes | \(if .error then "❌ " + .error elif ((.metadata.warnings // []) | length) > 0 then "⚠️ Warnings" else "✅ OK" end) |"' "$MANIFEST"
              echo ""
            fi

            PLAN="${ROUNDTRIP_DIR:-/nonexistent}/upgrade-plan.tsv"
            if [ -s "$PLAN" ]; then
              echo "### ⬆️ Upgraded from \`${ROUNDTRIP_PREVIOUS_RELEASE:-the images below}\`"
              echo ""
              echo "| Service | Previous release | Started as |"
              echo "|---------|------------------|------------|"
              while IFS=$'\t' read -r SERVICE OLD REF; do
                echo "| \`$SERVICE\` | \`$OLD\` | \`$REF\` |"
              done < "$PLAN"
              echo ""
              echo "The upgrade gave those references the images built from this commit (*Images under test*)."
              echo ""
            fi

            OBJECTS="${ROUNDTRIP_DIR:-/nonexistent}/diagnostics/s3-objects.json"
            if [ -s "$OBJECTS" ] && jq -e -s 'length > 0' "$OBJECTS" > /dev/null 2>&1; then
              echo "### 🪣 Objects in \`s3://$ROUNDTRIP_S3_BUCKET\`"
              echo ""
              echo "| Object | Size |"
              echo "|--------|------|"
              jq -r 'select(.key != null) | "| `\(.key)` | \(.size) bytes |"' "$OBJECTS"
              echo ""
            fi

            if [ -s "${ROUNDTRIP_DIR:-/nonexistent}/built-images.txt" ]; then
              echo "### 🐳 Images under test"
              echo ""
              sed 's/^/- `/; s/$/`/' "$ROUNDTRIP_DIR/built-images.txt"
              echo ""
            fi

            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Compose files | \`${COMPOSE_FILE:-}\` |"
            echo "| Profiles | \`${COMPOSE_PROFILES:-none}\` |"
            echo "| Backup service | \`$BACKUP_SERVICE\` |"
            echo "| Marker | \`${ROUNDTRIP_MARKER:-}\` |"
            if [ -s "${ROUNDTRIP_DIR:-/nonexistent}/created-networks.txt" ]; then
              echo "| External networks created | \`$(paste -sd ' ' "$ROUNDTRIP_DIR/created-networks.txt")\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
