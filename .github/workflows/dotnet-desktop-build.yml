name: 🖥️ .NET Desktop Build

on:
  workflow_call:
    inputs:
      # Build Configuration
      dotnet-version:
        description: '.NET SDK version to use (e.g., 8.0.x, 9.0.x)'
        type: string
        required: false
        default: '8.0.x'
      
      configurations:
        description: 'Build configurations as JSON array (e.g., ["Debug", "Release"])'
        type: string
        required: false
        default: '["Release"]'
      
      platforms:
        description: 'Target platforms as JSON array (e.g., ["x64", "x86", "arm64"])'
        type: string
        required: false
        default: '["x64"]'
      
      # Project Paths
      solution-path:
        description: 'Path to solution file (e.g., src/MyApp.sln)'
        type: string
        required: false
        default: '**/*.sln'
      
      project-path:
        description: 'Path to main project file for single project builds'
        type: string
        required: false
        default: ''
      
      test-project-pattern:
        description: 'Pattern to find test projects (e.g., **/*Tests.csproj)'
        type: string
        required: false
        default: '**/*Tests.csproj'
      
      # Publishing Options
      publish-type:
        description: 'Publish type: single-file, framework-dependent, self-contained, msix'
        type: string
        required: false
        default: 'self-contained'
      
      include-native-libs:
        description: 'Include native libraries in single file'
        type: boolean
        required: false
        default: true
      
      enable-compression:
        description: 'Enable compression for single file'
        type: boolean
        required: false
        default: true
      
      trimming:
        description: 'Enable trimming for self-contained apps'
        type: boolean
        required: false
        default: false
      
      ready-to-run:
        description: 'Enable ReadyToRun compilation'
        type: boolean
        required: false
        default: true
      
      # MSIX/AppX Options
      create-msix:
        description: 'Create MSIX package'
        type: boolean
        required: false
        default: false
      
      wap-project-path:
        description: 'Windows Application Packaging project path'
        type: string
        required: false
        default: ''
      
      app-version:
        description: 'Application version (e.g., 1.0.0)'
        type: string
        required: false
        default: '1.0.0'
      
      # Code Signing
      sign-output:
        description: 'Sign the output files'
        type: boolean
        required: false
        default: false
      
      certificate-subject:
        description: 'Certificate subject for signing (for Windows cert store)'
        type: string
        required: false
        default: ''
      
      timestamp-server:
        description: 'Timestamp server URL'
        type: string
        required: false
        default: 'http://timestamp.digicert.com'
      
      # Testing Options
      run-tests:
        description: 'Run unit tests'
        type: boolean
        required: false
        default: true
      
      test-filter:
        description: 'Test filter expression'
        type: string
        required: false
        default: ''
      
      collect-coverage:
        description: 'Collect code coverage'
        type: boolean
        required: false
        default: false
      
      coverage-threshold:
        description: 'Minimum coverage threshold percentage'
        type: number
        required: false
        default: 0
      
      # Build Options
      verbosity:
        description: 'MSBuild verbosity level: quiet, minimal, normal, detailed, diagnostic'
        type: string
        required: false
        default: 'normal'
      
      treat-warnings-as-errors:
        description: 'Treat warnings as errors'
        type: boolean
        required: false
        default: false
      
      # Artifact Options
      upload-artifacts:
        description: 'Upload build artifacts'
        type: boolean
        required: false
        default: true
      
      artifact-name:
        description: 'Name for uploaded artifacts'
        type: string
        required: false
        default: 'dotnet-desktop-build'
      
      artifact-retention-days:
        description: 'Number of days to retain artifacts'
        type: number
        required: false
        default: 30
      
      # Authenticated Restore (private NuGet feeds)
      nuget-source-name:
        description: 'Package source key in the repository nuget.config to authenticate against (e.g. GITHUB). Empty means restore from public sources only.'
        type: string
        required: false
        default: ''

      nuget-source-url:
        description: 'Feed URL. Used only when nuget-source-name is not declared in any nuget.config; the source is then registered in the runner user-level config. The repository nuget.config is never modified.'
        type: string
        required: false
        default: ''

      nuget-username:
        description: 'HTTP Basic username for the private feed. Defaults to the workflow actor. GitHub Packages ignores it; Azure Artifacts and others do not.'
        type: string
        required: false
        default: ''

      # Runner Configuration
      runs-on:
        description: 'Runner to use. Use string for GitHub-hosted (e.g., windows-latest, windows-2022, windows-2019) or JSON array for self-hosted (e.g., ["self-hosted", "windows"])'
        type: string
        required: false
        default: 'windows-latest'
      
      timeout-minutes:
        description: 'Job timeout in minutes'
        type: number
        required: false
        default: 60
      
    secrets:
      DOTNET_SIGNING_CERTIFICATE_BASE64:
        description: 'Base64 encoded PFX certificate for .NET desktop application code signing'
        required: false
      
      DOTNET_SIGNING_CERTIFICATE_PASSWORD:
        description: 'Password for the .NET desktop application signing certificate'
        required: false
      
      DOTNET_NUGET_RESTORE_CREDENTIALS:
        description: >-
          Token used as the HTTP Basic password when RESTORING from the private feed
          named by nuget-source-name (for GitHub Packages: a PAT with read:packages).
          A NuGet.org API key is a publish credential and is not accepted here.
        required: false

      DOTNET_NUGET_API_KEY:
        description: >-
          DEPRECATED and unused. It never authenticated anything: it only triggered a
          step that overwrote the repository nuget.config with a nuget.org-only file,
          discarding packageSourceMapping (issue #77). Still declared so that callers
          passing it explicitly do not break; use DOTNET_NUGET_RESTORE_CREDENTIALS
          instead. Will be removed in the next major release.
        required: false

    outputs:
      version:
        description: 'Version of the built application'
        value: ${{ jobs.build.outputs.version }}
      
      artifacts-path:
        description: 'Path to the build artifacts'
        value: ${{ jobs.build.outputs.artifacts-path }}

jobs:
  build:
    name: Build .NET Desktop
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    
    strategy:
      matrix:
        configuration: ${{ fromJson(inputs.configurations) }}
        platform: ${{ fromJson(inputs.platforms) }}
      fail-fast: false
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifacts-path: ${{ steps.artifacts.outputs.path }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      
      - name: 🔧 Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      
      - name: 🔨 Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      
      - name: 📦 Setup NuGet
        uses: NuGet/setup-nuget@v4
      
      - name: 🔍 Find Solution/Project
        id: find-project
        shell: pwsh
        run: |
          if ("${{ inputs.project-path }}" -ne "") {
            $projectFile = "${{ inputs.project-path }}"
          } elseif ("${{ inputs.solution-path }}" -ne "") {
            $solutionFiles = Get-ChildItem -Path . -Filter "${{ inputs.solution-path }}" -Recurse
            if ($solutionFiles.Count -eq 0) {
              Write-Error "No solution file found matching pattern: ${{ inputs.solution-path }}"
              exit 1
            }
            $projectFile = $solutionFiles[0].FullName
          } else {
            Write-Error "No solution or project path specified"
            exit 1
          }
          
          Write-Output "project-file=$projectFile" >> $env:GITHUB_OUTPUT
          Write-Host "Using project/solution: $projectFile"
      
      - name: 🏷️ Determine Version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.app-version }}"
          
          # Try to extract version from project file if not specified
          if ($version -eq "1.0.0") {
            $projectContent = Get-Content "${{ steps.find-project.outputs.project-file }}" -Raw
            if ($projectContent -match '<Version>([^<]+)</Version>') {
              $version = $matches[1]
            } elseif ($projectContent -match '<AssemblyVersion>([^<]+)</AssemblyVersion>') {
              $version = $matches[1]
            }
          }
          
          # Append build number if not a release build
          if ("${{ matrix.configuration }}" -ne "Release") {
            $version = "$version-${{ matrix.configuration }}-${{ github.run_number }}"
          }
          
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
      
      # Replaces a step that used to overwrite the repository's nuget.config with a
      # nuget.org-only file whenever DOTNET_NUGET_API_KEY was set - deleting the
      # private source and its packageSourceMapping, and never binding the key to a
      # source (issue #77). The generated file was also invalid: the here-string was
      # indented, so the XML declaration did not start at byte 0.
      #
      # Nothing is written now. NuGet reads the credential from the environment before
      # it reads any config file, so the committed nuget.config is left untouched and
      # NuGet.exe, the dotnet CLI and MSBuild all pick the credential up - they share
      # the NuGet.Configuration assembly that resolves it.
      - name: 🔐 Authenticate Private NuGet Feed
        uses: bauer-group/automation-templates/.github/actions/dotnet-nuget-auth@main
        with:
          source-name: ${{ inputs.nuget-source-name }}
          source-url: ${{ inputs.nuget-source-url }}
          username: ${{ inputs.nuget-username }}
          credential: ${{ secrets.DOTNET_NUGET_RESTORE_CREDENTIALS }}

      - name: 📚 Restore Dependencies
        shell: pwsh
        run: |
          $projectFile = "${{ steps.find-project.outputs.project-file }}"
          
          if ($projectFile -match "\.sln$") {
            nuget restore $projectFile
          } else {
            dotnet restore $projectFile `
              --runtime win-${{ matrix.platform }} `
              --verbosity ${{ inputs.verbosity }}
          }
      
      - name: 🧪 Run Tests
        if: inputs.run-tests == true
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path . -Filter "${{ inputs.test-project-pattern }}" -Recurse
          
          if ($testProjects.Count -gt 0) {
            foreach ($testProject in $testProjects) {
              Write-Host "Running tests in: $($testProject.FullName)"
              
              $testArgs = @(
                "test",
                $testProject.FullName,
                "--configuration", "${{ matrix.configuration }}",
                "--no-restore",
                "--verbosity", "${{ inputs.verbosity }}",
                "--logger", "trx",
                "--results-directory", "TestResults"
              )
              
              if ("${{ inputs.test-filter }}" -ne "") {
                $testArgs += "--filter", "${{ inputs.test-filter }}"
              }
              
              if ("${{ inputs.collect-coverage }}" -eq "true") {
                $testArgs += "--collect", "Code Coverage"
              }
              
              & dotnet $testArgs
              
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Tests failed"
                exit 1
              }
            }
          } else {
            Write-Host "No test projects found"
          }
      
      - name: 🏗️ Build Application
        shell: pwsh
        run: |
          $projectFile = "${{ steps.find-project.outputs.project-file }}"
          $outputPath = "build\${{ matrix.configuration }}\${{ matrix.platform }}"
          
          $buildArgs = @{
            Configuration = "${{ matrix.configuration }}"
            Platform = "${{ matrix.platform }}"
            OutputPath = $outputPath
            Version = "${{ steps.version.outputs.version }}"
            TreatWarningsAsErrors = "${{ inputs.treat-warnings-as-errors }}"
          }
          
          if ("${{ inputs.publish-type }}" -eq "single-file") {
            $buildArgs.PublishSingleFile = "true"
            $buildArgs.IncludeNativeLibrariesForSelfExtract = "${{ inputs.include-native-libs }}"
            $buildArgs.EnableCompressionInSingleFile = "${{ inputs.enable-compression }}"
          }
          
          if ("${{ inputs.publish-type }}" -eq "self-contained") {
            $buildArgs.SelfContained = "true"
            $buildArgs.PublishTrimmed = "${{ inputs.trimming }}"
          }
          
          if ("${{ inputs.ready-to-run }}" -eq "true") {
            $buildArgs.PublishReadyToRun = "true"
          }
          
          $msbuildArgs = @()
          foreach ($key in $buildArgs.Keys) {
            $msbuildArgs += "/p:$key=$($buildArgs[$key])"
          }
          
          msbuild $projectFile /t:Build /v:${{ inputs.verbosity }} $msbuildArgs
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed"
            exit 1
          }
      
      - name: 📝 Prepare Certificate
        if: inputs.sign-output == true
        id: certificate
        shell: pwsh
        run: |
          # Only prepare certificate if one is provided
          if ("${{ secrets.DOTNET_SIGNING_CERTIFICATE_BASE64 }}" -ne "") {
            $certBytes = [Convert]::FromBase64String("${{ secrets.DOTNET_SIGNING_CERTIFICATE_BASE64 }}")
            $certPath = Join-Path $env:RUNNER_TEMP "signing_cert.pfx"
            [IO.File]::WriteAllBytes($certPath, $certBytes)
            Write-Output "path=$certPath" >> $env:GITHUB_OUTPUT
            Write-Host "✅ Certificate prepared for signing"
          } else {
            Write-Host "ℹ️ No certificate provided, skipping certificate preparation"
            Write-Output "path=" >> $env:GITHUB_OUTPUT
          }
      
      - name: 🔏 Sign Output Files
        if: inputs.sign-output == true
        shell: pwsh
        run: |
          $outputPath = "build\${{ matrix.configuration }}\${{ matrix.platform }}"
          $filesToSign = Get-ChildItem -Path $outputPath -Include *.exe,*.dll -Recurse
          
          foreach ($file in $filesToSign) {
            Write-Host "Signing: $($file.Name)"
            
            if ("${{ secrets.DOTNET_SIGNING_CERTIFICATE_BASE64 }}" -ne "") {
              # Use certificate file
              & signtool sign /f "${{ steps.certificate.outputs.path }}" `
                /p "${{ secrets.DOTNET_SIGNING_CERTIFICATE_PASSWORD }}" `
                /t "${{ inputs.timestamp-server }}" `
                /fd SHA256 `
                $file.FullName
            } elseif ("${{ inputs.certificate-subject }}" -ne "") {
              # Use certificate from store
              & signtool sign /n "${{ inputs.certificate-subject }}" `
                /t "${{ inputs.timestamp-server }}" `
                /fd SHA256 `
                $file.FullName
            }
          }
      
      - name: 📦 Create MSIX Package
        if: inputs.create-msix == true && inputs.wap-project-path != ''
        shell: pwsh
        run: |
          $wapProject = "${{ inputs.wap-project-path }}"
          
          $msbuildArgs = @(
            $wapProject,
            "/p:Configuration=${{ matrix.configuration }}",
            "/p:Platform=${{ matrix.platform }}",
            "/p:UapAppxPackageBuildMode=SideloadOnly",
            "/p:AppxBundle=Always",
            "/p:AppxBundlePlatforms=${{ matrix.platform }}",
            "/p:AppxPackageDir=msix-output",
            "/p:Version=${{ steps.version.outputs.version }}"
          )
          
          if ("${{ steps.certificate.outputs.path }}" -ne "") {
            $msbuildArgs += "/p:PackageCertificateKeyFile=${{ steps.certificate.outputs.path }}"
            $msbuildArgs += "/p:PackageCertificatePassword=${{ secrets.DOTNET_SIGNING_CERTIFICATE_PASSWORD }}"
          }
          
          msbuild $msbuildArgs
      
      - name: 🗑️ Cleanup Certificate
        if: always() && steps.certificate.outputs.path != ''
        shell: pwsh
        run: |
          if (Test-Path "${{ steps.certificate.outputs.path }}") {
            Remove-Item "${{ steps.certificate.outputs.path }}" -Force
          }
      
      - name: 📊 Check Coverage
        if: inputs.collect-coverage == true && inputs.coverage-threshold > 0
        shell: pwsh
        env:
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          $ErrorActionPreference = 'Stop'

          # This gate used to only count *.coverage files and print the count: it never
          # parsed any coverage value and never compared anything to coverage-threshold,
          # so a caller who explicitly asked for a minimum coverage always got a green
          # step - even at 0% coverage, or with no coverage data produced at all.
          # It now reads the real line coverage and fails when it is below the threshold
          # or cannot be determined, because an unmeasured result must never be reported
          # as a passing one. Only callers that opted in (collect-coverage = true AND
          # coverage-threshold > 0) reach this step, so no default configuration changes.
          $invariant = [System.Globalization.CultureInfo]::InvariantCulture
          $threshold = [double]::Parse("$env:COVERAGE_THRESHOLD", $invariant)
          Write-Host "Required minimum line coverage: $threshold%"

          if (-not (Test-Path -LiteralPath 'TestResults')) {
            Write-Host "::error title=Coverage gate::No TestResults directory - coverage could not be measured, so the $threshold% threshold cannot be verified."
            exit 1
          }

          # Cobertura/OpenCover XML is emitted directly by coverlet ('XPlat Code Coverage'
          # or MSBuild integration). The built-in 'Code Coverage' collector used by the
          # test step writes a binary *.coverage file instead, which is converted below.
          $reports = @(Get-ChildItem -Path 'TestResults' -Recurse -File -Include '*.cobertura.xml', '*.opencover.xml' -ErrorAction SilentlyContinue)

          if ($reports.Count -eq 0) {
            $binaryReports = @(Get-ChildItem -Path 'TestResults' -Recurse -File -Filter '*.coverage' -ErrorAction SilentlyContinue)

            if ($binaryReports.Count -eq 0) {
              Write-Host "::error title=Coverage gate::No coverage report found under TestResults - coverage could not be measured, so the $threshold% threshold cannot be verified."
              exit 1
            }

            Write-Host "Converting $($binaryReports.Count) binary coverage report(s) to Cobertura..."
            $toolsPath = Join-Path ([System.Environment]::GetFolderPath('UserProfile')) '.dotnet/tools'
            if (Test-Path -LiteralPath $toolsPath) { $env:PATH = "$toolsPath$([System.IO.Path]::PathSeparator)$env:PATH" }

            if (-not (Get-Command 'dotnet-coverage' -ErrorAction SilentlyContinue)) {
              try {
                & dotnet tool install --global dotnet-coverage | Out-Host
              } catch {
                Write-Host "::warning title=Coverage gate::dotnet tool install reported: $($_.Exception.Message)"
              }
              if (Test-Path -LiteralPath $toolsPath) { $env:PATH = "$toolsPath$([System.IO.Path]::PathSeparator)$env:PATH" }
            }

            if (-not (Get-Command 'dotnet-coverage' -ErrorAction SilentlyContinue)) {
              Write-Host "::error title=Coverage gate::The dotnet-coverage tool is unavailable, so the binary coverage report cannot be read and the $threshold% threshold cannot be verified."
              exit 1
            }

            $mergedReport = Join-Path 'TestResults' 'merged.cobertura.xml'
            try {
              & dotnet-coverage merge -o $mergedReport -f cobertura $binaryReports.FullName | Out-Host
            } catch {
              Write-Host "::warning title=Coverage gate::dotnet-coverage merge reported: $($_.Exception.Message)"
            }

            if (-not (Test-Path -LiteralPath $mergedReport)) {
              Write-Host "::error title=Coverage gate::Converting the binary coverage report failed, so the $threshold% threshold cannot be verified."
              exit 1
            }
            $reports = @(Get-Item -LiteralPath $mergedReport)
          }

          $linesCovered = 0.0
          $linesValid = 0.0
          $lineRates = @()

          foreach ($report in $reports) {
            try {
              $document = New-Object System.Xml.XmlDocument
              $document.XmlResolver = $null   # no external DTD/entity resolution
              $document.Load($report.FullName)
            } catch {
              Write-Host "::warning title=Coverage gate::Could not parse $($report.FullName): $($_.Exception.Message)"
              continue
            }

            $root = $document.DocumentElement
            if ($null -eq $root) { continue }

            if ($root.Name -eq 'coverage') {
              # Cobertura: prefer the absolute counters so several reports can be summed.
              $valid = $root.GetAttribute('lines-valid')
              $covered = $root.GetAttribute('lines-covered')
              $rate = $root.GetAttribute('line-rate')

              if ($valid -and $covered -and ([double]::Parse($valid, $invariant) -gt 0)) {
                $linesValid += [double]::Parse($valid, $invariant)
                $linesCovered += [double]::Parse($covered, $invariant)
              } elseif ($rate -and ($root.SelectNodes('.//class').Count -gt 0)) {
                # line-rate is only meaningful when the report actually describes classes.
                $lineRates += ([double]::Parse($rate, $invariant) * 100)
              } elseif ($rate) {
                # `dotnet-coverage merge -f cobertura` emits line-rate="1" with an EMPTY
                # <packages /> and no lines-covered/lines-valid when the collector gathered
                # no data at all. Trusting line-rate there reports a fabricated 100% and
                # passes any threshold - the exact failure this gate exists to prevent, and
                # worse than the old no-op because it publishes an authoritative-looking
                # number to the job summary. Absent counters together with no classes is the
                # signature of "nothing was measured", so contribute nothing and let the
                # fail-closed branch below reject the run.
                Write-Host "::warning title=Coverage gate::$($report.Name) reports line-rate=$rate but contains no classes - treating it as no measurement rather than as full coverage."
              }
            } elseif ($root.Name -eq 'CoverageSession') {
              # OpenCover
              $summary = $root.SelectSingleNode('Summary')
              if ($null -ne $summary) {
                $points = $summary.GetAttribute('numSequencePoints')
                $visited = $summary.GetAttribute('visitedSequencePoints')
                if ($points -and $visited) {
                  $linesValid += [double]::Parse($points, $invariant)
                  $linesCovered += [double]::Parse($visited, $invariant)
                }
              }
            }
          }

          if ($linesValid -gt 0) {
            $coverage = ($linesCovered / $linesValid) * 100
          } elseif ($lineRates.Count -gt 0) {
            # No absolute counters available - use the lowest reported rate.
            $coverage = ($lineRates | Measure-Object -Minimum).Minimum
          } else {
            Write-Host "::error title=Coverage gate::Coverage reports were found but contained no readable line coverage, so the $threshold% threshold cannot be verified."
            exit 1
          }

          $rounded = [math]::Round($coverage, 2)
          Write-Host "Line coverage: $rounded% (threshold: $threshold%)"
          if ($env:GITHUB_STEP_SUMMARY) {
            "### Code Coverage`n`nLine coverage: **$rounded%** (threshold: $threshold%)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          if ($coverage -lt $threshold) {
            Write-Host "::error title=Coverage below threshold::Line coverage $rounded% is below the required $threshold%."
            exit 1
          }

          Write-Host "Coverage gate passed."
      
      - name: 📤 Prepare Artifacts
        id: artifacts
        shell: pwsh
        run: |
          $artifactPath = "artifacts\${{ matrix.configuration }}\${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $artifactPath -Force
          
          # Copy build output
          $outputPath = "build\${{ matrix.configuration }}\${{ matrix.platform }}"
          if (Test-Path $outputPath) {
            Copy-Item -Path "$outputPath\*" -Destination $artifactPath -Recurse
          }
          
          # Copy MSIX if created
          if ("${{ inputs.create-msix }}" -eq "true" -and (Test-Path "msix-output")) {
            Copy-Item -Path "msix-output\*" -Destination $artifactPath -Recurse
          }
          
          Write-Output "path=$artifactPath" >> $env:GITHUB_OUTPUT
      
      - name: 📦 Upload Artifacts
        if: inputs.upload-artifacts == true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.configuration }}-${{ matrix.platform }}
          path: ${{ steps.artifacts.outputs.path }}
          retention-days: ${{ inputs.artifact-retention-days }}
      
      - name: 📊 Upload Test Results
        if: always() && inputs.run-tests == true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.configuration }}-${{ matrix.platform }}
          path: TestResults/
          retention-days: ${{ inputs.artifact-retention-days }}