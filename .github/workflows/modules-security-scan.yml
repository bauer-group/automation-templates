name: 📦 Module | Security Scanning

on:
  workflow_call:
    inputs:
      scan-engine:
        description: >-
          Secret scan engine. 'none' (default): Gitleaks is opt-in and does not run.
          'gitleaks': scan the git history with Gitleaks - enable it in repositories
          without GitHub secret scanning and push protection (organization repositories
          also need the GITLEAKS_LICENSE secret). 'both' still works and runs gitleaks.
          'gitguardian' is deprecated: GitGuardian was removed, so it runs no secret
          scanner and the run says so with a warning.
        required: false
        type: string
        default: 'none'
      scan-type:
        description: 'Type of security scan (secrets, vulnerabilities, all)'
        required: false
        type: string
        default: 'all'
      fail-on-findings:
        description: 'Fail the workflow if security issues are found'
        required: false
        type: boolean
        default: true
      # Kept so callers that still pass it do not fail: a reusable workflow rejects
      # undeclared inputs before any job starts.
      minimum-severity:
        description: 'Deprecated and ignored: it only ever configured GitGuardian, which was removed.'
        required: false
        type: string
        default: 'medium'
      exclude-paths:
        description: 'Paths to exclude from scanning (comma-separated)'
        required: false
        type: string
        default: '.git,node_modules,vendor'
      runs-on:
        description: 'Runner to use. Use string for GitHub-hosted (e.g., "ubuntu-latest") or JSON array for self-hosted (e.g., ["self-hosted", "linux"])'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      # Kept for the same reason as minimum-severity: a caller passing it explicitly
      # (not via `secrets: inherit`) would otherwise be rejected at startup.
      GITGUARDIAN_API_KEY:
        description: 'Deprecated and ignored: GitGuardian scanning was removed.'
        required: false
      GITLEAKS_LICENSE:
        description: >-
          Gitleaks license key (free from gitleaks.io). Needed only when scan-engine
          is 'gitleaks' in an organization repository, and only for push, schedule
          and workflow_dispatch runs; pull request runs scan with the gitleaks CLI and
          do not read it. Dependabot runs read it from the Dependabot secrets, not the
          Actions secrets.
        required: false
    outputs:
      secrets-found:
        description: >-
          Whether secrets were found: 'true', 'false', 'unknown' when the scan did not
          complete, or 'skipped' when no secret scan ran (Gitleaks not enabled, which
          is the default). Only 'false' means scanned and clean.
        value: ${{ jobs.security-scan.outputs.secrets-found }}
      secrets-count:
        description: 'Number of secrets found, or unknown if the scan did not complete'
        value: ${{ jobs.security-scan.outputs.secrets-count }}
      vulnerabilities-found:
        description: 'Whether vulnerabilities were found'
        value: ${{ jobs.security-scan.outputs.vulnerabilities-found }}
      security-score:
        description: 'Overall security score (0-100)'
        value: ${{ jobs.security-scan.outputs.security-score }}
      scan-results:
        description: 'Summary of scan results'
        value: ${{ jobs.security-scan.outputs.scan-results }}

# Do not add `pull-requests: read` here, although gitleaks-action needs it to scan a
# pull request. A called workflow can only narrow the caller's token, and GitHub
# refuses to start a caller that grants less than this block requests - every caller
# grants exactly these three. The security-scan action detects the missing scope and
# scans pull requests with the gitleaks CLI instead, which needs no API access.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    name: 🔐 Security Analysis
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    outputs:
      # Reads the action's aggregate output: 'true', 'false', 'unknown' (scan did not
      # complete) or 'skipped' (no secret scan ran).
      secrets-found: ${{ steps.security.outputs.secrets-found }}
      secrets-count: ${{ steps.security.outputs.gitleaks-secrets-count }}
      vulnerabilities-found: ${{ steps.security.outputs.vulnerabilities-found }}
      security-score: ${{ steps.security.outputs.security-score }}
      scan-results: ${{ steps.security.outputs.scan-results }}
    
    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🛡️ Run Security Scan
        id: security
        uses: bauer-group/automation-templates/.github/actions/security-scan@main
        with:
          scan-engine: ${{ inputs.scan-engine }}
          scan-type: ${{ inputs.scan-type }}
          fail-on-findings: ${{ inputs.fail-on-findings }}
          exclude-paths: ${{ inputs.exclude-paths }}
          gitleaks-license: ${{ secrets.GITLEAKS_LICENSE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Security Report Summary
        if: always()
        # Values arrive as environment variables rather than being interpolated into
        # the script: an unset ${{ }} expands to nothing mid-command, which is how
        # `[ "$SCORE" -ge 95 ]` came to be evaluated as `[ -ge 95 ]` and log
        # "integer expression expected" twice per run.
        env:
          SCAN_ENGINE: ${{ steps.security.outputs.engines-used || 'none' }}
          SCAN_ENGINE_INPUT: ${{ inputs.scan-engine }}
          SCAN_TYPE: ${{ inputs.scan-type }}
          SECURITY_SCORE: ${{ steps.security.outputs.security-score }}
          SECRETS_FOUND: ${{ steps.security.outputs.secrets-found }}
          SECRETS_COUNT: ${{ steps.security.outputs.gitleaks-secrets-count }}
          VULNERABILITIES_FOUND: ${{ steps.security.outputs.vulnerabilities-found }}
          VULN_TARGETS: ${{ steps.security.outputs.vulnerability-targets }}
          VULN_PACKAGES: ${{ steps.security.outputs.vulnerability-packages }}
          PYTHON_RESOLVED: ${{ steps.security.outputs.python-projects-resolved }}
          SCAN_RESULTS: ${{ steps.security.outputs.scan-results }}
        run: |
          set -uo pipefail

          # A missing value means the scan did not report, which is NOT the same as a
          # clean result. Defaulting it to 'false' is what let a run with a real
          # finding print "Secrets Found | false".
          SECRETS_FOUND="${SECRETS_FOUND:-unknown}"
          VULNERABILITIES_FOUND="${VULNERABILITIES_FOUND:-unknown}"
          SECRETS_COUNT="${SECRETS_COUNT:-unknown}"
          SCORE="${SECURITY_SCORE:-}"

          # Gitleaks is opt-in. Not enabling it is a configuration, not a gap the
          # run should alarm about - but it is not a clean secret scan either.
          GITLEAKS_DISABLED=false
          case "${SCAN_ENGINE_INPUT:-}" in
            none | '') GITLEAKS_DISABLED=true ;;
          esac

          case "$SECRETS_FOUND" in
            true)    SECRETS_CELL="🚨 yes ($SECRETS_COUNT)" ;;
            false)   SECRETS_CELL="✅ no" ;;
            skipped)
              if [ "$GITLEAKS_DISABLED" = true ]; then
                SECRETS_CELL="⏭️ disabled - Gitleaks is opt-in (enable with scan-engine: 'gitleaks')"
                SCAN_ENGINE="none (Gitleaks disabled)"
              else
                SECRETS_CELL="⏭️ not scanned - no secret scan ran"
              fi ;;
            *)       SECRETS_CELL="❓ unknown - the scan did not complete" ;;
          esac

          # 'unknown' from Trivy means it found no dependency file it can read, so no
          # dependency was checked. That used to show as "false" and 100/100.
          VULNS_SCANNED=false
          SCANNED="${VULN_TARGETS:-0} file(s), ${VULN_PACKAGES:-0} package(s)"
          if [ "${PYTHON_RESOLVED:-0}" != "0" ]; then
            SCANNED="${SCANNED}; ${PYTHON_RESOLVED} Python project(s) resolved from pyproject.toml"
          fi
          if [ "$SCAN_TYPE" = "secrets" ]; then
            VULNS_CELL="⏭️ not requested"
          else
            case "$VULNERABILITIES_FOUND" in
              true)  VULNS_CELL="⚠️ yes (${SCANNED})"; VULNS_SCANNED=true ;;
              false) VULNS_CELL="✅ no (${SCANNED})"; VULNS_SCANNED=true ;;
              *)     VULNS_CELL="❓ NOT scanned - no dependency file Trivy can read" ;;
            esac
          fi

          {
            echo "### 🛡️ Security Scan Results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Engine Used** | ${SCAN_ENGINE} |"
            echo "| **Scan Type** | ${SCAN_TYPE} |"
            echo "| **Security Score** | ${SCORE:-unknown}/100 |"
            echo "| **Secrets Found** | ${SECRETS_CELL} |"
            echo "| **Vulnerabilities (Trivy)** | ${VULNS_CELL} |"
            echo "| **Status** | ${SCAN_RESULTS:-Incomplete} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Only compare when there is actually a number to compare.
          if [ -z "$SCORE" ] || ! [ "$SCORE" -eq "$SCORE" ] 2>/dev/null; then
            echo "❓ **No security score was reported - treat this run as unscanned.**" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SECRETS_FOUND" = "unknown" ]; then
            echo "❓ **The secret scan did not complete - this is not a clean result.**" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SECRETS_FOUND" = "skipped" ] && [ "$SCAN_TYPE" = "secrets" ] && [ "$GITLEAKS_DISABLED" = true ]; then
            echo "⏭️ **Nothing was scanned: scan-type is 'secrets' and Gitleaks is disabled (opt-in, enable with \`scan-engine: 'gitleaks'\`).**" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SECRETS_FOUND" = "skipped" ] && [ "$SCAN_TYPE" != "vulnerabilities" ] && [ "$GITLEAKS_DISABLED" != true ]; then
            echo "⏭️ **No secret scan ran - the score does not cover secrets.**" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SCAN_TYPE" != "secrets" ] && [ "$VULNS_SCANNED" != "true" ]; then
            if [ "$SECRETS_FOUND" != "skipped" ]; then
              echo "❓ **Trivy scanned no dependencies - the score covers the secret scan only.**" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$GITLEAKS_DISABLED" = true ] && [ "$SCAN_TYPE" != "vulnerabilities" ]; then
              echo "❓ **Nothing was scanned: Trivy found no dependency file and Gitleaks is disabled (opt-in).**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❓ **Nothing was scanned: Trivy found no dependency file it can read.**" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            if [ "$SECRETS_FOUND" = "skipped" ] && [ "$SCAN_TYPE" != "vulnerabilities" ]; then
              echo "⏭️ **Gitleaks is disabled (opt-in) - the score covers dependencies only.** Enable it with \`scan-engine: 'gitleaks'\` in repositories without GitHub secret scanning and push protection." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$SCORE" -ge 95 ]; then
              echo "✅ **Excellent security posture!**" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$SCORE" -ge 80 ]; then
              echo "⚠️ **Good security with room for improvement.**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ **Security issues require attention.**" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi