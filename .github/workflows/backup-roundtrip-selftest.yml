name: "🧪 Backup Round-Trip Self-Test"

# Runs modules-backup-roundtrip-test.yml end to end against the fixture stack in
# .github/workflows/tests/backup-roundtrip/ (PostgreSQL, a uid 1000 file volume
# and a thin meta image on the public BackupHelper engine).
#
# actionlint proves the module is well-formed; only a real run proves that it
# builds, seeds, backs up, deletes, restores and finds the data again. The fixture
# uses every input class a consumer needs: profiles, env-overrides that disable
# an external source and add a key the template lacks, generated secrets, a
# prepare script for a secret with its own format (left on an unterminated last
# line), an image built from the repository, required components and a service
# stopped for the restore. A second run starts selected services only, next to
# a configured service whose image cannot be pulled. A matrix runs one round
# trip per compose variant; the proxy variant needs an external network the
# module creates. Two runs use a throwaway MinIO as the S3 destination and
# restore from it after the sidecar's local data was wiped. Three runs start
# from a previous engine release and restore its snapshot after the upgrade.
#
# What a real stack cannot show without turning this workflow red - a create
# that exits 1 for a failed component - is covered by the Step Tests job, which
# runs tests/backup-roundtrip-module.test.sh against the module's step bodies.
#
# Path-filtered on purpose: a stack round trip costs a few runner minutes and
# is only worth spending when the module or its fixture changes.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modules-backup-roundtrip-test.yml'
      - '.github/workflows/backup-roundtrip-selftest.yml'
      - '.github/workflows/tests/backup-roundtrip/**'
      - '.github/workflows/tests/backup-roundtrip-module.test.sh'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/modules-backup-roundtrip-test.yml'
      - '.github/workflows/backup-roundtrip-selftest.yml'
      - '.github/workflows/tests/backup-roundtrip/**'
      - '.github/workflows/tests/backup-roundtrip-module.test.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Seconds, no stack: the decisions of Create Backup and Pull Images against
  # a stubbed engine and docker.
  step-tests:
    name: "🧪 Step Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v7

      - name: "🧪 Create Backup and Pull Images"
        shell: bash
        run: bash .github/workflows/tests/backup-roundtrip-module.test.sh

  roundtrip:
    name: "🧪 Fixture Round Trip"
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/modules-backup-roundtrip-test.yml
    with:
      working-directory: '.github/workflows/tests/backup-roundtrip'
      compose-file: 'docker-compose.yml'
      profiles: 'backup'
      env-overrides: |
        # A key the template lacks, appended after prepare.sh's unterminated line
        APP_MODE=ci
        SAAS_EXPORT_ENABLED=false
      generated-secrets: 'DATABASE_PASSWORD'
      prepare-script: 'prepare.sh'
      build-images: '[{"service": "backup", "context": "backup"}]'
      backup-service: 'backup'
      require-components: 'database files'
      services-to-stop-before-restore: 'app'
      seed-script: 'seed.sh'
      mutate-script: 'mutate.sh'
      check-script: 'check.sh'
      wait-timeout: 180
      timeout-minutes: 15
      artifact-name: 'backup-roundtrip-selftest-diagnostics'
    secrets: inherit

  # Selected services: 'app' and 'backup' plus what they depend on (database,
  # files-init). The "decoy" profile adds a configured service whose image
  # cannot be pulled; the run only passes if Pull Images leaves it alone.
  roundtrip-services:
    name: "🧪 Fixture Round Trip (Selected Services)"
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/modules-backup-roundtrip-test.yml
    with:
      working-directory: '.github/workflows/tests/backup-roundtrip'
      compose-file: 'docker-compose.yml'
      profiles: 'backup,decoy'
      services: 'app backup'
      env-overrides: |
        APP_MODE=ci
        SAAS_EXPORT_ENABLED=false
      generated-secrets: 'DATABASE_PASSWORD'
      prepare-script: 'prepare.sh'
      build-images: '[{"service": "backup", "context": "backup"}]'
      backup-service: 'backup'
      require-components: 'database files'
      services-to-stop-before-restore: 'app'
      seed-script: 'seed.sh'
      mutate-script: 'mutate.sh'
      check-script: 'check.sh'
      wait-timeout: 180
      timeout-minutes: 15
      artifact-name: 'backup-roundtrip-selftest-services-diagnostics'
    secrets: inherit

  # The off-site path: the throwaway MinIO as the fixture's S3 destination,
  # mapped through s3-env like a consumer maps its own variables. The region
  # is left at the fixture's default (eu-central-1), which MinIO must accept.
  # The restore runs after the sidecar's data volume was wiped, so it only
  # passes when the snapshot comes back from the bucket.
  roundtrip-s3:
    name: "🧪 Fixture Round Trip (S3, new host)"
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/modules-backup-roundtrip-test.yml
    with:
      working-directory: '.github/workflows/tests/backup-roundtrip'
      compose-file: 'docker-compose.yml'
      profiles: 'backup'
      env-overrides: |
        APP_MODE=ci
        SAAS_EXPORT_ENABLED=false
      generated-secrets: 'DATABASE_PASSWORD'
      prepare-script: 'prepare.sh'
      build-images: '[{"service": "backup", "context": "backup"}]'
      backup-service: 'backup'
      require-components: 'database files'
      services-to-stop-before-restore: 'app'
      seed-script: 'seed.sh'
      mutate-script: 'mutate.sh'
      check-script: 'check.sh'
      s3-destination: true
      s3-env: |
        endpoint=BACKUP_S3_ENDPOINT
        bucket=BACKUP_S3_BUCKET
        access-key=BACKUP_S3_ACCESS_KEY
        secret-key=BACKUP_S3_SECRET_KEY
      wait-timeout: 180
      timeout-minutes: 15
      artifact-name: 'backup-roundtrip-selftest-s3-diagnostics'
    secrets: inherit

  # The upgrade of an existing installation: the "previous release" is the
  # engine image 1.7.7 itself (the fixture's sidecar only adds labels to it),
  # started from previous-release.yml. It seeds and backs up; upgrade.sh
  # proves that state and migrates the .env; the module switches to the
  # sidecar built from this commit (FROM the newest engine) and to
  # docker-compose.yml alone, checks data and healthcheck, and the new
  # sidecar restores the 1.7.7 snapshot.
  roundtrip-upgrade:
    name: "🧪 Fixture Round Trip (upgrade)"
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/modules-backup-roundtrip-test.yml
    with:
      working-directory: '.github/workflows/tests/backup-roundtrip'
      compose-file: 'docker-compose.yml'
      profiles: 'backup'
      env-overrides: |
        APP_MODE=ci
        SAAS_EXPORT_ENABLED=false
      generated-secrets: 'DATABASE_PASSWORD'
      prepare-script: 'prepare.sh'
      build-images: '[{"service": "backup", "context": "backup"}]'
      backup-service: 'backup'
      require-components: 'database files'
      services-to-stop-before-restore: 'app'
      seed-script: 'seed.sh'
      mutate-script: 'mutate.sh'
      check-script: 'check.sh'
      # A full reference per service: the release whose snapshots must stay
      # restorable.
      upgrade-from: '{"backup": "ghcr.io/bauer-group/cs-backuphelper/backuphelper:1.7.7"}'
      upgrade-from-compose-files: '["docker-compose.yml", "previous-release.yml"]'
      upgrade-script: 'upgrade.sh'
      wait-timeout: 180
      timeout-minutes: 15
      artifact-name: 'backup-roundtrip-selftest-upgrade-diagnostics'
    secrets: inherit

  # One round trip per compose variant, the pattern consumers use for their
  # local, Traefik and Coolify files. The proxy variant joins an external
  # network that only exists because external-networks creates it ('auto'
  # finds it in the configuration); on the base variant 'auto' finds none.
  # Both legs combine every opt-in capability, as CS-ZAMMAD's gate does: the
  # S3 destination with every optional setting mapped, and an upgrade given
  # as a plain tag - the sidecar's reference becomes the engine repository
  # (BACKUP_IMAGE), so tag 1.9.0 names the engine release 1.9.0.
  roundtrip-variants:
    name: "🧪 Fixture Round Trip (${{ matrix.variant }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            compose-files: '["docker-compose.yml"]'
          - variant: proxy
            compose-files: '["docker-compose.yml", "docker-compose.proxy.yml"]'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/modules-backup-roundtrip-test.yml
    with:
      working-directory: '.github/workflows/tests/backup-roundtrip'
      compose-files: ${{ matrix.compose-files }}
      profiles: 'backup'
      external-networks: 'auto'
      env-overrides: |
        APP_MODE=ci
        SAAS_EXPORT_ENABLED=false
        BACKUP_IMAGE=ghcr.io/bauer-group/cs-backuphelper/backuphelper
      generated-secrets: 'DATABASE_PASSWORD'
      prepare-script: 'prepare.sh'
      build-images: '[{"service": "backup", "context": "backup"}]'
      backup-service: 'backup'
      require-components: 'database files'
      services-to-stop-before-restore: 'app'
      seed-script: 'seed.sh'
      mutate-script: 'mutate.sh'
      check-script: 'check.sh'
      s3-destination: true
      s3-env: |
        # The fixture's names for its S3 destination settings
        endpoint=BACKUP_S3_ENDPOINT
        bucket=BACKUP_S3_BUCKET
        access-key=BACKUP_S3_ACCESS_KEY
        secret-key=BACKUP_S3_SECRET_KEY
        region=BACKUP_S3_REGION
        path-style=BACKUP_S3_PATH_STYLE
        prefix=BACKUP_S3_PREFIX
      upgrade-from: '1.9.0'
      wait-timeout: 180
      timeout-minutes: 15
      artifact-name: 'backup-roundtrip-selftest-${{ matrix.variant }}-diagnostics'
    secrets: inherit

  # The outputs are part of the module's contract - callers gate on them.
  check-outputs:
    name: "📋 Check Module Outputs"
    needs: [roundtrip, roundtrip-services, roundtrip-s3, roundtrip-upgrade, roundtrip-variants]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: "🔍 Assert Outputs"
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # A matrix job reports the outputs of one of its legs and the
          # result of all of them.
          for JOB in roundtrip roundtrip-services roundtrip-s3 roundtrip-upgrade roundtrip-variants; do
            SNAPSHOT_ID=$(jq -r --arg j "$JOB" '.[$j].outputs["snapshot-id"] // ""' <<< "$NEEDS_JSON")
            COMPONENTS=$(jq -r --arg j "$JOB" '.[$j].outputs.components // ""' <<< "$NEEDS_JSON")
            RESULT=$(jq -r --arg j "$JOB" '.[$j].outputs.result // ""' <<< "$NEEDS_JSON")
            echo "== $JOB"
            echo "snapshot-id: $SNAPSHOT_ID"
            echo "components:  $COMPONENTS"
            echo "result:      $RESULT"
            [[ "$SNAPSHOT_ID" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] \
              || { echo "::error::$JOB: snapshot-id is not a snapshot id"; exit 1; }
            jq -e '[.[].name] | sort == ["database", "files"]' <<< "$COMPONENTS" > /dev/null \
              || { echo "::error::$JOB: components must list exactly database and files (saas-export is disabled)"; exit 1; }
            jq -e 'all(.[]; .error == null and .size > 0)' <<< "$COMPONENTS" > /dev/null \
              || { echo "::error::$JOB: every component must be error-free and non-empty"; exit 1; }
            [ "$RESULT" = "success" ] || { echo "::error::$JOB: result must be success"; exit 1; }
          done
          echo "✅ Outputs match the contract"
