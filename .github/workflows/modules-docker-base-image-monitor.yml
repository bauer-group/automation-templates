# =============================================================================
# Docker Base Image Monitor - Reusable Workflow
# =============================================================================
# Monitors Docker base images for digest changes and triggers rebuilds.
# Solves the problem that Dependabot cannot track floating tags (stable/latest).
#
# Features:
# - Monitors multiple images via JSON config or inline definition
# - Retries transient registry errors (3 attempts, 10s/20s backoff)
# - Auto-creates GitHub variables for digest storage
# - Creates semantic-release compatible commits for automatic versioning
# - Triggers target workflows via workflow_dispatch (with optional inputs)
# - With a target workflow, a digest counts as handled only once the run
#   dispatched for it has succeeded: the run is recorded in
#   <variable>_PENDING, the next check reads its result, stores the digest on
#   success and dispatches again when the run failed (e.g. a red release gate),
#   with a new release commit if the failed run had already tagged its release
# - Stops after max-release-attempts failed release runs for one digest and
#   fails the job, instead of cutting a new release on every check
# - Supports dry-run mode for testing
#
# Usage (config file + workflow dispatch):
#   uses: bauer-group/automation-templates/.github/workflows/modules-docker-base-image-monitor.yml@main
#   with:
#     config-file: '.github/config/docker-base-image-monitor/base-images.json'
#     target-workflow: 'ci.yml'
#     target-workflow-inputs: '{"force-release": "true"}'
#   secrets: inherit
#
# Usage (inline images):
#   uses: bauer-group/automation-templates/.github/workflows/modules-docker-base-image-monitor.yml@main
#   with:
#     images: '[{"name": "n8n", "image": "n8nio/n8n", "tag": "stable", "variable": "N8N_STABLE_DIGEST"}]'
#   secrets: inherit
#
# Required Secret: PAT_READWRITE_ORGANISATION
#   - Classic PAT: 'repo' scope OR
#   - Fine-grained PAT:
#       - Contents (Read/Write)  - checkout + commit/push
#       - Variables (Read/Write) - digest storage
#       - Actions (Read/Write)   - workflow_dispatch and reading the result of
#                                  the dispatched run (only if target-workflow is used)
#   No packages scope is needed: the registry login does not use this PAT.
#
# Optional Secret: REGISTRY_READ_TOKEN
#   Only for registries outside this enterprise. The GHCR login defaults to
#   github.token, which reads internal and private packages across orgs of the
#   same enterprise.
#
# Monitoring internal or private GHCR packages requires the CALLING workflow to
# grant 'packages: read' - a reusable workflow can only restrict caller
# permissions, never add to them:
#
#   jobs:
#     monitor:
#       permissions:
#         packages: read
#       uses: bauer-group/automation-templates/.github/workflows/modules-docker-base-image-monitor.yml@main
#       secrets: inherit
#
# See docs/ghcr-internal-visibility.md.
# =============================================================================

name: "🔍 Module | Docker Base Image Monitor"

on:
  workflow_call:
    inputs:
      images:
        description: "JSON array of images to monitor (alternative to config-file)"
        required: false
        type: string
        default: ""
      config-file:
        description: "Path to JSON config file (alternative to images)"
        required: false
        type: string
        default: ""
      target-workflow:
        description: "Workflow file to trigger on update (optional, uses commit trigger if empty). The new digest is stored once the dispatched run has succeeded; a failed run is dispatched again by the next check."
        required: false
        type: string
        default: ""
      target-workflow-ref:
        description: "Branch for workflow_dispatch"
        required: false
        type: string
        default: "main"
      target-workflow-inputs:
        description: "JSON object of inputs to pass to target workflow (e.g. '{\"force-release\": \"true\"}')"
        required: false
        type: string
        default: ""
      max-release-attempts:
        description: "With target-workflow: release runs dispatched for one digest before the monitor gives up. When the last one failed too, it stops dispatching and fails the job until the cause is fixed. 0 = no limit."
        required: false
        type: number
        default: 3
      commit-prefix:
        description: "Commit message prefix for semantic release"
        required: false
        type: string
        default: "chore(deps)"
      commit-and-release:
        description: "Create commit to trigger semantic release"
        required: false
        type: boolean
        default: true
      dry-run:
        description: "Only check, do not trigger or update variables"
        required: false
        type: boolean
        default: false
      fail-on-unreachable-image:
        description: "Fail the job if an image manifest cannot be read (auth, network or a wrong tag). Set to false to downgrade to a warning - the run then reports success while some images were never verified."
        required: false
        type: boolean
        default: true
      runs-on:
        description: 'Runner to use. Use string for GitHub-hosted (e.g., "ubuntu-latest") or JSON array for self-hosted (e.g., ["self-hosted", "linux"])'
        required: false
        type: string
        default: "ubuntu-latest"

    secrets:
      PAT_READWRITE_ORGANISATION:
        description: "GitHub PAT with variable write and contents write permissions. NOT used for the registry login - see REGISTRY_READ_TOKEN."
        required: true
      REGISTRY_READ_TOKEN:
        description: "Optional token for the GHCR login used to read image manifests. Only needed for registries outside this enterprise - github.token covers internal and private packages across orgs of the same enterprise, provided the CALLING workflow grants 'packages: read'."
        required: false

    outputs:
      updates-found:
        description: "True if at least one image needs a release: a new digest, or a digest whose dispatched release failed"
        value: ${{ jobs.monitor.outputs.updates-found }}
      updated-images:
        description: "JSON array of image names that need a release (new digests and retried ones)"
        value: ${{ jobs.monitor.outputs.updated-images }}
      retried-images:
        description: "JSON array of image names whose previously dispatched release run failed and that were dispatched again"
        value: ${{ jobs.monitor.outputs.retried-images }}
      pending-images:
        description: "JSON array of image names whose dispatched release run has not finished yet"
        value: ${{ jobs.monitor.outputs.pending-images }}
      exhausted-images:
        description: "JSON array of image names whose release failed max-release-attempts times; they are no longer dispatched and the job fails"
        value: ${{ jobs.monitor.outputs.exhausted-images }}
      dispatched-run-id:
        description: "Id of the target workflow run dispatched by this check (empty if none was dispatched or GitHub did not return it)"
        value: ${{ jobs.monitor.outputs.dispatched-run-id }}
      dispatched-run-url:
        description: "URL of the target workflow run dispatched by this check"
        value: ${{ jobs.monitor.outputs.dispatched-run-url }}
      triggered:
        description: "True if target workflow was triggered or commit was pushed"
        value: ${{ jobs.monitor.outputs.triggered }}
      commit-sha:
        description: "SHA of the created commit"
        value: ${{ jobs.monitor.outputs.commit-sha }}
      new-digests:
        description: "JSON object with new digests per image"
        value: ${{ jobs.monitor.outputs.new-digests }}
      images-configured:
        description: "Number of images declared in the configuration"
        value: ${{ jobs.monitor.outputs.images-configured }}
      images-checked:
        description: "Number of images whose digest was actually read. Lower than images-configured means the result is incomplete."
        value: ${{ jobs.monitor.outputs.images-checked }}
      unreachable-images:
        description: "JSON array of image references that could not be read"
        value: ${{ jobs.monitor.outputs.unreachable-images }}

jobs:
  monitor:
    name: "🔍 Check Base Images"
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    # Typical runs take under a minute and the slowest seen in 1,460 runs took
    # about 10. The cap leaves room for the manifest retries below without
    # letting a hung registry call hold a runner for the 6-hour default.
    timeout-minutes: 20
    outputs:
      updates-found: ${{ steps.check.outputs.updates-found }}
      updated-images: ${{ steps.check.outputs.updated-images }}
      retried-images: ${{ steps.check.outputs.retried-images }}
      pending-images: ${{ steps.check.outputs.pending-images }}
      exhausted-images: ${{ steps.check.outputs.exhausted-images }}
      dispatched-run-id: ${{ steps.dispatch.outputs.run-id }}
      dispatched-run-url: ${{ steps.dispatch.outputs.run-url }}
      triggered: ${{ steps.release.outputs.triggered || steps.dispatch.outputs.triggered || 'false' }}
      commit-sha: ${{ steps.release.outputs.commit-sha }}
      new-digests: ${{ steps.check.outputs.new-digests }}
      images-configured: ${{ steps.check.outputs.images-configured }}
      images-checked: ${{ steps.check.outputs.images-checked }}
      unreachable-images: ${{ steps.check.outputs.unreachable-images }}

    steps:
      - name: "🔐 Validate PAT_READWRITE_ORGANISATION secret"
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_READWRITE_ORGANISATION }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "::error::❌ Secret 'PAT_READWRITE_ORGANISATION' is not defined!"
            echo ""
            echo "═══════════════════════════════════════════════════════════════════"
            echo "  MISSING SECRET: PAT_READWRITE_ORGANISATION"
            echo "═══════════════════════════════════════════════════════════════════"
            echo ""
            echo "  This workflow requires a Personal Access Token (PAT) with"
            echo "  read/write permissions for Variables and Contents."
            echo ""
            echo "  Setup instructions:"
            echo "  1. Create a PAT at: https://github.com/settings/tokens"
            echo "     - Classic: Select 'repo' scope"
            echo "     - Fine-grained: Select 'Variables' + 'Contents' (Read/Write)"
            echo ""
            echo "  2. Add the secret to your repository:"
            echo "     Repository → Settings → Secrets and variables → Actions"
            echo "     → New repository secret"
            echo "     Name: PAT_READWRITE_ORGANISATION"
            echo ""
            echo "  3. Call this workflow with 'secrets: inherit'"
            echo ""
            echo "═══════════════════════════════════════════════════════════════════"
            exit 1
          fi
          echo "✅ PAT_READWRITE_ORGANISATION secret is configured"

      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_READWRITE_ORGANISATION }}
          fetch-depth: 0

      # `docker manifest inspect` below is anonymous without this, which fails for
      # internal/private GHCR packages.
      # Defaults to github.token, matching modules-auto-maintenance.yml: it exists in
      # every run, needs no setup, and carries packages: read whenever the CALLING
      # workflow grants it (a reusable workflow cannot grant itself that scope - a
      # permissions block only restricts what the caller already holds). Internal
      # visibility resolves across orgs of the same enterprise for github.token too.
      # PAT_READWRITE_ORGANISATION is deliberately NOT in this chain: it is
      # `required: true`, so it would always win and the default would never apply.
      # Its validation only proves the secret is present, not that it carries
      # read:packages - an org-wide write PAT is also far more than a manifest read
      # needs, and a fine-grained one is org-bound and cannot reach another org's
      # packages at all. Set REGISTRY_READ_TOKEN for registries outside the
      # enterprise, where github.token does not apply.
      # continue-on-error: a failed login must not break repos that monitor only
      # public images; a genuinely unreadable manifest is still caught downstream by
      # fail-on-unreachable-image.
      # Unconditional and harmless for Docker Hub-only setups: a ghcr.io login does
      # not affect anonymous pulls from other registries.
      - name: "🔐 Log in to GitHub Container Registry"
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_READ_TOKEN || github.token }}

      - name: "🔍 Check for image updates"
        id: check
        env:
          GH_TOKEN: ${{ secrets.PAT_READWRITE_ORGANISATION }}
          CONFIG_FILE: ${{ inputs.config-file }}
          INLINE_IMAGES: ${{ inputs.images }}
          COMMIT_PREFIX_INPUT: ${{ inputs.commit-prefix }}
          DRY_RUN: ${{ inputs.dry-run }}
          FAIL_ON_UNREACHABLE: ${{ inputs.fail-on-unreachable-image }}
          TARGET_WORKFLOW: ${{ inputs.target-workflow }}
          MAX_ATTEMPTS: ${{ inputs.max-release-attempts }}
        shell: bash
        # Tested by .github/workflows/tests/docker-base-image-monitor.test.sh
        run: |
          set -euo pipefail

          if [[ ! "$MAX_ATTEMPTS" =~ ^[0-9]+$ ]]; then
            echo "::error::max-release-attempts must be a whole number (0 = no limit), got '$MAX_ATTEMPTS'"
            exit 1
          fi
          MAX_LABEL=""
          [ "$MAX_ATTEMPTS" -eq 0 ] || MAX_LABEL=" of $MAX_ATTEMPTS"

          # Load configuration directly in this step to avoid JSON escaping issues
          echo "::group::📄 Loading Configuration"
          if [ -n "$CONFIG_FILE" ]; then
            echo "📂 Loading config from file: $CONFIG_FILE"

            if [ ! -f "$CONFIG_FILE" ]; then
              echo "::error::Config file not found: $CONFIG_FILE"
              exit 1
            fi

            IMAGES=$(jq -c '.images' "$CONFIG_FILE")
            COMMIT_PREFIX=$(jq -r '.settings."commit-prefix" // "'"$COMMIT_PREFIX_INPUT"'"' "$CONFIG_FILE")
            echo "✅ Loaded $(printf '%s' "$IMAGES" | jq 'length') images from config file"

          elif [ -n "$INLINE_IMAGES" ]; then
            echo "📋 Using inline images configuration"

            if ! printf '%s' "$INLINE_IMAGES" | jq -e '.' > /dev/null 2>&1; then
              echo "::error::Invalid JSON in 'images' input"
              exit 1
            fi

            IMAGES="$INLINE_IMAGES"
            COMMIT_PREFIX="$COMMIT_PREFIX_INPUT"
            echo "✅ Loaded $(printf '%s' "$IMAGES" | jq 'length') images from inline config"
          else
            echo "::error::Either 'images' or 'config-file' must be provided"
            exit 1
          fi

          # Save commit-prefix for later steps
          echo "commit-prefix=$COMMIT_PREFIX" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::📋 Image Configuration"
          printf '%s' "$IMAGES" | jq -r '.[] | "  - \(.name): \(.image):\(.tag)"'
          echo "::endgroup::"

          UPDATES_FOUND="false"
          UPDATED_IMAGES="[]"
          NEW_IMAGES="[]"
          NEW_DIGESTS="{}"
          NEW_DETAILS=""
          RETRY_DETAILS=""
          RETRIED="[]"
          PENDING="[]"
          CONFIRMED="[]"
          EXHAUSTED="[]"
          # Only collected here; the "Persist state" step writes them once
          # commit, push and dispatch have succeeded.
          #   VARIABLE_UPDATES  variable -> digest that counts as handled
          #   DISPATCH_UPDATES  variable -> digest a release is dispatched for;
          #                     stored as <variable>_PENDING with the run id
          #   DISPATCH_ATTEMPTS variable -> attempt number of that run
          #   PENDING_DELETES   variables whose <variable>_PENDING is resolved
          # Storing the digest right after the dispatch made a failed release
          # look handled: the next run read the new digest back, reported
          # "No update" and the rebuild never happened. With a target workflow
          # the digest is therefore stored only once its run has succeeded.
          VARIABLE_UPDATES="{}"
          DISPATCH_UPDATES="{}"
          DISPATCH_ATTEMPTS="{}"
          PENDING_DELETES="[]"

          # Must be initialised before first read: `set -euo pipefail` above enables
          # -u, which aborts on an unset variable.
          CONFIGURED_COUNT=$(printf '%s' "$IMAGES" | jq 'length')
          CHECKED_COUNT=0
          UNREACHABLE_IMAGES="[]"

          # Reads a manifest with up to 3 attempts (backoff 10s, 20s). Rate limits,
          # 5xx answers and network resets are transient - a single 429 from
          # lscr.io with a retry-after of microseconds used to fail the whole run.
          # Errors that waiting cannot fix (auth, unknown tag) return at once.
          # Progress goes to stderr so stdout stays the bare manifest.
          inspect_manifest() {
            local ref="$1" out="" attempt
            for attempt in 1 2 3; do
              if out=$(docker manifest inspect "$ref" 2>&1); then
                printf '%s' "$out"
                return 0
              fi
              case "$out" in
                *unauthorized*|*denied*|*forbidden*|*401*|*403*|*"manifest unknown"*|*"no such manifest"*)
                  break
                  ;;
              esac
              if [ "$attempt" -lt 3 ]; then
                echo "⏳ Attempt $attempt/3 for $ref failed (${out%%$'\n'*}), retrying in $((attempt * 10))s" >&2
                sleep $((attempt * 10))
              fi
            done
            printf '%s' "$out"
            return 1
          }

          # Result of the release run recorded in a <variable>_PENDING value
          # ({"digest", "run_id", "run_url", "attempt"}) for the given digest, as
          # "<state> <conclusion> <url>":
          #   none        - no run recorded for this digest
          #   in_progress - queued, waiting or running
          #   success     - the run succeeded
          #   failed      - any other conclusion, or the run no longer exists
          #   unknown     - the run could not be read right now
          # Only a completed, successful run counts. "unknown" is never
          # treated as failed: re-dispatching on a transient API error would
          # start a second release next to one that may well succeed.
          release_state() {
            local record="$1" digest="$2" run_id info status conclusion url
            run_id=$(printf '%s' "$record" | jq -r --arg d "$digest" \
              'select(type == "object" and .digest == $d) | .run_id // empty | tostring' 2>/dev/null || true)
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "none - -"
              return 0
            fi
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            if ! info=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                          --jq '[.status, (.conclusion // "none"), .html_url] | join(" ")' 2>&1 < /dev/null); then
              case "$info" in
                *"HTTP 404"*) echo "failed deleted $url" ;;
                *) echo "unknown - $url" ;;
              esac
              return 0
            fi
            read -r status conclusion url <<< "$info"
            if [ "$status" != "completed" ]; then
              echo "in_progress - $url"
            elif [ "$conclusion" = "success" ]; then
              echo "success success $url"
            else
              echo "failed $conclusion $url"
            fi
          }

          # Process each image (using process substitution to preserve variables)
          while IFS= read -r img; do
            NAME=$(printf '%s' "$img" | jq -r '.name')
            IMAGE=$(printf '%s' "$img" | jq -r '.image')
            TAG=$(printf '%s' "$img" | jq -r '.tag')
            VARIABLE=$(printf '%s' "$img" | jq -r '.variable')

            echo "::group::🐳 Checking $NAME ($IMAGE:$TAG)"

            # Get current digest from registry
            echo "📡 Fetching current digest from registry..."

            # Try to get digest, handling multi-arch manifests
            CURRENT_DIGEST=""
            if ! MANIFEST_OUTPUT=$(inspect_manifest "$IMAGE:$TAG"); then
              # The case split only picks the message; the failure itself is always
              # recorded. Registry error strings vary between implementations and
              # versions, so a grep that silently stops matching must never be what
              # decides whether we report a problem.
              case "$MANIFEST_OUTPUT" in
                *unauthorized*|*denied*|*forbidden*|*401*|*403*)
                  echo "::error::Access denied for $IMAGE:$TAG - if this package is internal or private, the CALLING workflow must grant 'packages: read' (a permissions block that omits 'packages' sets it to none). For registries outside this enterprise, set the REGISTRY_READ_TOKEN secret. See docs/ghcr-internal-visibility.md"
                  ;;
                *)
                  echo "::error::Could not fetch manifest for $IMAGE:$TAG"
                  ;;
              esac
              echo "$MANIFEST_OUTPUT"
              UNREACHABLE_IMAGES=$(printf '%s' "$UNREACHABLE_IMAGES" | jq -c --arg i "$IMAGE:$TAG" '. + [$i]')
              echo "::endgroup::"
              continue
            fi

            # Try to extract digest (handles both single and multi-arch)
            CURRENT_DIGEST=$(echo "$MANIFEST_OUTPUT" | jq -r '
              if .config.digest then
                .config.digest
              elif .manifests then
                .manifests | sort_by(.platform.architecture) | .[0].digest
              else
                empty
              end
            ' 2>/dev/null || echo "")

            if [ -z "$CURRENT_DIGEST" ]; then
              echo "::error::Could not extract digest for $IMAGE:$TAG"
              UNREACHABLE_IMAGES=$(printf '%s' "$UNREACHABLE_IMAGES" | jq -c --arg i "$IMAGE:$TAG" '. + [$i]')
              echo "::endgroup::"
              continue
            fi

            CHECKED_COUNT=$((CHECKED_COUNT + 1))

            echo "📦 Current digest: ${CURRENT_DIGEST:0:20}..."

            # Get stored digest from variable (auto-create if missing)
            echo "🔎 Fetching stored digest from variable $VARIABLE..."
            STORED_DIGEST=$(gh variable get "$VARIABLE" 2>/dev/null || echo "")

            if [ -z "$STORED_DIGEST" ]; then
              echo "ℹ️  Variable $VARIABLE does not exist (will be created)"
            else
              echo "📦 Stored digest: ${STORED_DIGEST:0:20}..."
            fi

            if [ "$CURRENT_DIGEST" = "$STORED_DIGEST" ]; then
              echo ""
              echo "ℹ️  No update for $NAME (digest unchanged)"
              echo "::endgroup::"
              continue
            fi

            # The digest differs from the stored one. With a target workflow a
            # release may already have been dispatched for exactly this digest;
            # then the result of that run decides, not the comparison.
            REASON="new"
            # Attempt number of the release run this check dispatches.
            ATTEMPT=1
            if [ -n "$TARGET_WORKFLOW" ]; then
              PENDING_RECORD=$(gh variable get "${VARIABLE}_PENDING" 2>/dev/null < /dev/null || echo "")
              read -r RUN_STATE RUN_CONCLUSION RUN_URL <<< "$(release_state "$PENDING_RECORD" "$CURRENT_DIGEST")"
              ENTRY=$(jq -nc --arg name "$NAME" --arg state "$RUN_STATE" --arg conclusion "$RUN_CONCLUSION" --arg url "$RUN_URL" \
                '{name: $name, state: $state, conclusion: $conclusion, url: $url}')
              case "$RUN_STATE" in
                in_progress|unknown)
                  if [ "$RUN_STATE" = "unknown" ]; then
                    echo "::warning::Could not read the release run for $NAME ($RUN_URL) - the next check reads it again"
                  else
                    echo "⏳ The release dispatched for this digest is still running: $RUN_URL"
                  fi
                  PENDING=$(printf '%s' "$PENDING" | jq -c --argjson e "$ENTRY" '. + [$e]')
                  echo "::endgroup::"
                  continue
                  ;;
                success)
                  echo "✅ The release dispatched for this digest succeeded: $RUN_URL"
                  echo "💾 $VARIABLE will be stored"
                  CONFIRMED=$(printf '%s' "$CONFIRMED" | jq -c --argjson e "$ENTRY" '. + [$e]')
                  VARIABLE_UPDATES=$(printf '%s' "$VARIABLE_UPDATES" | jq -c --arg v "$VARIABLE" --arg d "$CURRENT_DIGEST" '. + {($v): $d}')
                  PENDING_DELETES=$(printf '%s' "$PENDING_DELETES" | jq -c --arg v "$VARIABLE" '. + [$v]')
                  echo "::endgroup::"
                  continue
                  ;;
                failed)
                  # Records without an attempt count as the first one.
                  FAILED_ATTEMPT=$(printf '%s' "$PENDING_RECORD" | \
                    jq -r '.attempt | if type == "number" and . >= 1 then floor else 1 end' 2>/dev/null || echo 1)
                  [[ "$FAILED_ATTEMPT" =~ ^[0-9]+$ ]] || FAILED_ATTEMPT=1
                  ENTRY=$(printf '%s' "$ENTRY" | jq -c --argjson a "$FAILED_ATTEMPT" '. + {attempt: $a}')
                  # Every retry after a tagged release cuts another release, so
                  # a failure that persists must not be retried on every check.
                  if [ "$MAX_ATTEMPTS" -gt 0 ] && [ "$FAILED_ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
                    echo "::error::The release for $NAME ($IMAGE:$TAG) failed $FAILED_ATTEMPT time(s), the last run ended with '$RUN_CONCLUSION' ($RUN_URL). It is not dispatched again: fix the cause, then delete the repository variable ${VARIABLE}_PENDING so the next check starts over."
                    EXHAUSTED=$(printf '%s' "$EXHAUSTED" | jq -c --argjson e "$ENTRY" '. + [$e]')
                    echo "::endgroup::"
                    continue
                  fi
                  ATTEMPT=$((FAILED_ATTEMPT + 1))
                  echo "::warning::The release dispatched for $NAME ($IMAGE:$TAG) ended with '$RUN_CONCLUSION' ($RUN_URL) - the image is still built from the old base. Dispatching the release again (attempt $ATTEMPT$MAX_LABEL)."
                  RETRIED=$(printf '%s' "$RETRIED" | jq -c --argjson e "$ENTRY" '. + [$e]')
                  REASON="retry"
                  ;;
              esac
            fi

            echo ""
            if [ "$REASON" = "new" ]; then
              echo "✅ Update detected for $NAME!"
              echo "   Old: ${STORED_DIGEST:-<none>}"
              echo "   New: $CURRENT_DIGEST"
              NEW_IMAGES=$(printf '%s' "$NEW_IMAGES" | jq -c --arg name "$NAME" '. + [$name]')
              # Build update details for commit message
              NEW_DETAILS="${NEW_DETAILS}
          - $NAME ($IMAGE:$TAG)
            Old: ${STORED_DIGEST:-<none>}
            New: $CURRENT_DIGEST"
            else
              echo "🔁 Release retry for $NAME ($CURRENT_DIGEST)"
              # Only used if the retry gets a release commit, see below.
              RETRY_DETAILS="${RETRY_DETAILS}
          - $NAME ($IMAGE:$TAG)
            Digest: $CURRENT_DIGEST
            Failed run: $RUN_URL ($RUN_CONCLUSION)"
            fi

            UPDATES_FOUND="true"
            UPDATED_IMAGES=$(printf '%s' "$UPDATED_IMAGES" | jq -c --arg name "$NAME" '. + [$name]')
            NEW_DIGESTS=$(printf '%s' "$NEW_DIGESTS" | jq -c --arg name "$NAME" --arg digest "$CURRENT_DIGEST" '. + {($name): $digest}')

            if [ -n "$TARGET_WORKFLOW" ]; then
              DISPATCH_UPDATES=$(printf '%s' "$DISPATCH_UPDATES" | jq -c --arg v "$VARIABLE" --arg d "$CURRENT_DIGEST" '. + {($v): $d}')
              DISPATCH_ATTEMPTS=$(printf '%s' "$DISPATCH_ATTEMPTS" | jq -c --arg v "$VARIABLE" --argjson a "$ATTEMPT" '. + {($v): $a}')
              PERSIST_NOTE="${VARIABLE}_PENDING will record the dispatched run; $VARIABLE is stored once that run succeeded"
            else
              VARIABLE_UPDATES=$(printf '%s' "$VARIABLE_UPDATES" | jq -c --arg v "$VARIABLE" --arg d "$CURRENT_DIGEST" '. + {($v): $d}')
              PERSIST_NOTE="$VARIABLE will be stored after the release commit was pushed"
            fi
            if [ "$DRY_RUN" != "true" ]; then
              echo "💾 $PERSIST_NOTE"
            else
              echo "🔍 DRY RUN: nothing is stored ($PERSIST_NOTE)"
            fi

            echo "::endgroup::"
          done < <(printf '%s' "$IMAGES" | jq -c '.[]')

          # A retry has to give the dispatched run something to release. If
          # the failed run had already tagged the base image commit (a build,
          # scan or push job failed after the release job), a bare dispatch
          # finds no new commit: semantic-release cuts no release, every build
          # is skipped and the run still ends "success" - which the next check
          # would confirm while the image stays on the old base. Such a retry
          # gets a release commit of its own. While the base image commit is
          # still unreleased (the run failed before tagging, e.g. a red release
          # gate), the dispatch releases that commit and no new one is added.
          RETRY_COMMIT="false"
          if [ "$(printf '%s' "$RETRIED" | jq 'length')" -gt 0 ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            # Captured first: `git log | grep -q` fails under pipefail when
            # grep exits early and git log is killed by SIGPIPE.
            UNRELEASED=$(git log --format=%s "${LAST_TAG:+${LAST_TAG}..}HEAD" 2>/dev/null || true)
            if grep -qF -- "${COMMIT_PREFIX}: update base image" <<< "$UNRELEASED"; then
              echo "🔁 A base image commit after ${LAST_TAG:-the first commit} is not released yet - the retry dispatches the release without a new commit"
            else
              RETRY_COMMIT="true"
              echo "🔁 The base image commit was already released${LAST_TAG:+ ($LAST_TAG)} - the retry gets a new release commit"
            fi
          fi

          COMMIT_IMAGES="$NEW_IMAGES"
          UPDATE_DETAILS=""
          if [ -n "$NEW_DETAILS" ]; then
            printf -v UPDATE_DETAILS 'Base image digest changed:\n%s' "$NEW_DETAILS"
          fi
          if [ "$RETRY_COMMIT" = "true" ]; then
            COMMIT_IMAGES=$(jq -nc --argjson n "$NEW_IMAGES" --argjson r "$RETRIED" '$n + ($r | map(.name))')
            printf -v UPDATE_DETAILS '%s%sRelease retried - the previous run failed after its release was tagged:\n%s' \
              "$UPDATE_DETAILS" "${UPDATE_DETAILS:+$'\n\n'}" "$RETRY_DETAILS"
          fi

          # Write outputs
          # UNREACHABLE_IMAGES survives the loop because it is fed by process
          # substitution above, not a pipe - a pipe would run the loop in a subshell
          # and discard everything accumulated in it.
          UNREACHABLE_COUNT=$(printf '%s' "$UNREACHABLE_IMAGES" | jq 'length')
          COMMIT_NEEDED=$(printf '%s' "$COMMIT_IMAGES" | jq 'length > 0')
          STATE_CHANGED=$(jq -n --argjson v "$VARIABLE_UPDATES" --argjson d "$DISPATCH_UPDATES" --argjson p "$PENDING_DELETES" \
            '($v | length) + ($d | length) + ($p | length) > 0')
          {
            echo "updates-found=$UPDATES_FOUND"
            echo "updated-images=$UPDATED_IMAGES"
            echo "new-images=$NEW_IMAGES"
            echo "commit-needed=$COMMIT_NEEDED"
            echo "commit-images=$COMMIT_IMAGES"
            echo "retry-commit=$RETRY_COMMIT"
            echo "new-digests=$NEW_DIGESTS"
            echo "retried=$RETRIED"
            echo "retried-images=$(printf '%s' "$RETRIED" | jq -c 'map(.name)')"
            echo "pending=$PENDING"
            echo "pending-images=$(printf '%s' "$PENDING" | jq -c 'map(.name)')"
            echo "confirmed=$CONFIRMED"
            echo "exhausted=$EXHAUSTED"
            echo "exhausted-images=$(printf '%s' "$EXHAUSTED" | jq -c 'map(.name)')"
            echo "dispatch-attempts=$DISPATCH_ATTEMPTS"
            echo "variable-updates=$VARIABLE_UPDATES"
            echo "dispatch-updates=$DISPATCH_UPDATES"
            echo "pending-deletes=$PENDING_DELETES"
            echo "state-changed=$STATE_CHANGED"
            echo "images-configured=$CONFIGURED_COUNT"
            echo "images-checked=$CHECKED_COUNT"
            echo "unreachable-images=$UNREACHABLE_IMAGES"
          } >> "$GITHUB_OUTPUT"

          # Store update details for commit message (using delimiter for multiline)
          # This writes to GITHUB_ENV, where a forged entry becomes an environment
          # variable for every later step, so the delimiter must not be guessable.
          DETAILS_DELIMITER="EOF_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "UPDATE_DETAILS<<$DETAILS_DELIMITER"
            echo "$UPDATE_DETAILS"
            echo "$DETAILS_DELIMITER"
          } >> "$GITHUB_ENV"

          echo ""
          echo "═══════════════════════════════════════════"
          echo "📊 Summary"
          echo "═══════════════════════════════════════════"
          echo "Images checked: $CHECKED_COUNT of $CONFIGURED_COUNT configured"
          echo "Updates found: $UPDATES_FOUND"
          if [ "$UPDATES_FOUND" = "true" ]; then
            echo "Updated images: $(printf '%s' "$UPDATED_IMAGES" | jq -r 'join(", ")')"
          fi
          for LIST in "Release retries exhausted:$EXHAUSTED" "Release retried:$RETRIED" "Release running:$PENDING" "Release confirmed:$CONFIRMED"; do
            if [ "$(printf '%s' "${LIST#*:}" | jq 'length')" -gt 0 ]; then
              echo "${LIST%%:*}: $(printf '%s' "${LIST#*:}" | jq -r 'map(.name) | join(", ")')"
            fi
          done

          if [ "$UNREACHABLE_COUNT" -gt 0 ]; then
            echo "Unreachable: $(printf '%s' "$UNREACHABLE_IMAGES" | jq -r 'join(", ")')"
            echo ""
            if [ "$FAIL_ON_UNREACHABLE" = "true" ]; then
              echo "::error::$UNREACHABLE_COUNT of $CONFIGURED_COUNT base image(s) could not be checked. Failing rather than reporting a clean result for images that were never read. Set 'fail-on-unreachable-image: false' to downgrade this to a warning."
              exit 1
            fi
            echo "::warning::$UNREACHABLE_COUNT of $CONFIGURED_COUNT base image(s) could not be checked (fail-on-unreachable-image is false). This run did NOT verify them."
          fi

      # For new digests, and for a retry whose failed run had already
      # released the previous base image commit: without a new commit the
      # dispatched run would have nothing to release and skip every build.
      # A retry whose base image commit is still unreleased (the run failed
      # before tagging) gets none - the dispatch releases that commit.
      - name: "📝 Create release commit"
        id: release
        if: steps.check.outputs.commit-needed == 'true' && inputs.commit-and-release == true && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.PAT_READWRITE_ORGANISATION }}
          COMMIT_PREFIX: ${{ steps.check.outputs.commit-prefix }}
          UPDATED_IMAGES_JSON: ${{ steps.check.outputs.commit-images }}
          TARGET_WORKFLOW: ${{ inputs.target-workflow }}
        shell: bash
        # Tested by .github/workflows/tests/docker-base-image-monitor.test.sh
        run: |
          set -euo pipefail

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Get list of updated images for commit message
          UPDATED=$(printf '%s' "$UPDATED_IMAGES_JSON" | jq -r 'join(", ")')

          # With a target workflow the release is started by workflow_dispatch
          # below, so this commit only gives semantic-release a commit to
          # release. [skip ci] stops it from also starting every push workflow
          # on an unchanged tree. It only affects push/pull_request triggers -
          # the dispatched run is not skipped.
          SKIP_CI=""
          if [ -n "$TARGET_WORKFLOW" ]; then
            SKIP_CI=" [skip ci]"
          fi

          # Create commit message using heredoc for proper formatting.
          # UPDATE_DETAILS (from the check) lists changed digests and, for a
          # retry that needs a commit, the failed run.
          COMMIT_MSG=$(cat <<COMMIT_EOF
          ${COMMIT_PREFIX}: update base image ${UPDATED}${SKIP_CI}

          ${UPDATE_DETAILS}

          Triggered by: Docker Base Image Monitor
          COMMIT_EOF
          )

          # Create an empty commit (the actual change is in GitHub variables)
          git commit --allow-empty -m "$COMMIT_MSG"

          # Push
          git push origin HEAD

          # Get commit SHA
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit-sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "triggered=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "✅ Created commit: $COMMIT_SHA"
          if [ -n "$TARGET_WORKFLOW" ]; then
            echo "🚀 Release will be started via workflow_dispatch of $TARGET_WORKFLOW"
          else
            echo "🚀 Semantic release will be triggered by push event"
          fi

      - name: "🚀 Trigger target workflow"
        id: dispatch
        if: steps.check.outputs.updates-found == 'true' && inputs.target-workflow != '' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.PAT_READWRITE_ORGANISATION }}
          TARGET_WORKFLOW: ${{ inputs.target-workflow }}
          TARGET_REF: ${{ inputs.target-workflow-ref }}
          TARGET_INPUTS: ${{ inputs.target-workflow-inputs }}
        shell: bash
        # Tested by .github/workflows/tests/docker-base-image-monitor.test.sh
        run: |
          set -euo pipefail
          echo "🚀 Triggering workflow: $TARGET_WORKFLOW"

          # The REST endpoint instead of `gh workflow run`: with
          # return_run_details it answers with the id of the run it created,
          # which the next check needs to read the run's result. The endpoint
          # takes a file name or an id; `gh workflow run` also took a workflow
          # name, which is resolved here so existing callers keep working.
          WORKFLOW="$TARGET_WORKFLOW"
          if [[ "$WORKFLOW" =~ \.ya?ml$ ]]; then
            WORKFLOW="${WORKFLOW##*/}"
          elif [[ ! "$WORKFLOW" =~ ^[0-9]+$ ]]; then
            WORKFLOW_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
              | jq -rs --arg name "$WORKFLOW" '[.[].workflows[] | select(.name == $name) | .id] | first // empty')
            if [ -z "$WORKFLOW_ID" ]; then
              echo "::error::No workflow named '$TARGET_WORKFLOW' in ${GITHUB_REPOSITORY}"
              exit 1
            fi
            WORKFLOW="$WORKFLOW_ID"
          fi

          INPUTS="${TARGET_INPUTS:-}"
          [ -n "$INPUTS" ] || INPUTS='{}'
          if ! printf '%s' "$INPUTS" | jq -e 'type == "object"' > /dev/null 2>&1; then
            echo "::error::target-workflow-inputs must be a JSON object, e.g. '{\"force-release\": \"true\"}'"
            exit 1
          fi
          # Values as strings, exactly as `gh workflow run --field` sent them.
          BODY=$(jq -nc --arg ref "$TARGET_REF" --argjson inputs "$INPUTS" \
            '{ref: $ref, inputs: ($inputs | map_values(tostring)), return_run_details: true}')
          if [ "$(printf '%s' "$INPUTS" | jq 'length')" -gt 0 ]; then
            echo "📋 With inputs:"
            printf '%s' "$BODY" | jq -r '.inputs | to_entries[] | "  - \(.key)=\(.value)"'
          fi

          RESPONSE=$(printf '%s' "$BODY" | gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" --input -)
          echo "triggered=true" >> "$GITHUB_OUTPUT"

          RUN_ID=$(printf '%s' "$RESPONSE" | jq -r '.workflow_run_id // empty' 2>/dev/null || true)
          RUN_URL=$(printf '%s' "$RESPONSE" | jq -r '.html_url // empty' 2>/dev/null || true)
          if [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            [ -n "$RUN_URL" ] || RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
            echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "run-url=$RUN_URL" >> "$GITHUB_OUTPUT"
            echo "✅ Workflow triggered successfully: $RUN_URL"
          else
            # Only a GitHub without return_run_details (an older GHES) answers
            # without a run. The digests are then stored right away, as before.
            echo "::warning::The dispatch did not return a run id, so the result of the release is not tracked - its digests are stored right away"
            echo "✅ Workflow triggered successfully"
          fi

      # Last on purpose: success() turns false as soon as the check (e.g. an
      # unreachable image), the commit, the push or the dispatch failed.
      # Nothing is stored then and the next run detects the same update again
      # instead of dropping it. Failing here is the cheaper direction: the next
      # run only repeats a release that was already started.
      #
      # With a target workflow the digest itself is not stored here yet: the
      # dispatched run is recorded in <variable>_PENDING, and the digest is
      # stored by the check that finds that run succeeded.
      - name: "💾 Persist state"
        id: persist
        if: success() && steps.check.outputs.state-changed == 'true' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.PAT_READWRITE_ORGANISATION }}
          VARIABLE_UPDATES: ${{ steps.check.outputs.variable-updates }}
          DISPATCH_UPDATES: ${{ steps.check.outputs.dispatch-updates }}
          DISPATCH_ATTEMPTS: ${{ steps.check.outputs.dispatch-attempts }}
          PENDING_DELETES: ${{ steps.check.outputs.pending-deletes }}
          RUN_ID: ${{ steps.dispatch.outputs.run-id }}
          RUN_URL: ${{ steps.dispatch.outputs.run-url }}
        shell: bash
        # Tested by .github/workflows/tests/docker-base-image-monitor.test.sh
        run: |
          set -euo pipefail

          FAILED=""
          # Up to 3 attempts (5s/10s backoff) per write.
          with_retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" < /dev/null && return 0
              [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
            done
            return 1
          }
          store() {
            if with_retry gh variable set "$1" --body "$2"; then
              echo "✅ Stored $1 = ${3:-$2}"
            else
              echo "::error::Could not store $1 - the next run will detect this update again"
              FAILED="$FAILED $1"
            fi
          }
          # A record that does not exist is already gone.
          drop() {
            local out attempt
            for attempt in 1 2 3; do
              if out=$(gh variable delete "$1" 2>&1 < /dev/null); then
                echo "🧹 Removed $1"
                return 0
              fi
              case "$out" in *"HTTP 404"*|*"not found"*|*"Not Found"*) return 0 ;; esac
              [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
            done
            echo "::warning::Could not remove $1 ($out) - it is left over and ignored once the digest changes"
          }

          while IFS=$'\t' read -r VARIABLE DIGEST; do
            if [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
              ATTEMPT=$(printf '%s' "${DISPATCH_ATTEMPTS:-}" | jq -r --arg v "$VARIABLE" '.[$v] // 1' 2>/dev/null || true)
              [[ "$ATTEMPT" =~ ^[0-9]+$ ]] || ATTEMPT=1
              RECORD=$(jq -nc --arg d "$DIGEST" --argjson r "$RUN_ID" --arg u "$RUN_URL" --argjson a "$ATTEMPT" \
                '{digest: $d, run_id: $r, run_url: $u, attempt: $a}')
              store "${VARIABLE}_PENDING" "$RECORD" "run $RUN_ID for ${DIGEST:0:20}... (attempt $ATTEMPT)"
            else
              # No run to follow up on: store the digest as before.
              store "$VARIABLE" "$DIGEST" "${DIGEST:0:20}..."
              drop "${VARIABLE}_PENDING"
            fi
          done < <(printf '%s' "$DISPATCH_UPDATES" | jq -r 'to_entries[] | "\(.key)\t\(.value)"')

          while IFS=$'\t' read -r VARIABLE DIGEST; do
            store "$VARIABLE" "$DIGEST" "${DIGEST:0:20}..."
          done < <(printf '%s' "$VARIABLE_UPDATES" | jq -r 'to_entries[] | "\(.key)\t\(.value)"')

          # Only once the digest is stored: a record removed before that would
          # turn the confirmed release into a new update on the next run.
          while IFS= read -r VARIABLE; do
            case " $FAILED " in
              *" $VARIABLE "*) ;;
              *) drop "${VARIABLE}_PENDING" ;;
            esac
          done < <(printf '%s' "$PENDING_DELETES" | jq -r '.[]')

          if [ -n "$FAILED" ]; then
            exit 1
          fi

      - name: "📋 Summary"
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          STATE_CHANGED: ${{ steps.check.outputs.state-changed }}
          UPDATES_FOUND: ${{ steps.check.outputs.updates-found }}
          UPDATED_IMAGES_JSON: ${{ steps.check.outputs.updated-images }}
          NEW_DIGESTS_JSON: ${{ steps.check.outputs.new-digests }}
          RETRIED_JSON: ${{ steps.check.outputs.retried }}
          PENDING_JSON: ${{ steps.check.outputs.pending }}
          CONFIRMED_JSON: ${{ steps.check.outputs.confirmed }}
          EXHAUSTED_JSON: ${{ steps.check.outputs.exhausted }}
          MAX_ATTEMPTS: ${{ inputs.max-release-attempts }}
          RETRY_COMMIT: ${{ steps.check.outputs.retry-commit }}
          RELEASE_TRIGGERED: ${{ steps.release.outputs.triggered }}
          RELEASE_SHA: ${{ steps.release.outputs.commit-sha }}
          RELEASE_PREFIX: ${{ steps.check.outputs.commit-prefix }}
          DISPATCH_TRIGGERED: ${{ steps.dispatch.outputs.triggered }}
          DISPATCH_RUN_URL: ${{ steps.dispatch.outputs.run-url }}
          TARGET_WORKFLOW: ${{ inputs.target-workflow }}
          IMAGES_CONFIGURED: ${{ steps.check.outputs.images-configured }}
          IMAGES_CHECKED: ${{ steps.check.outputs.images-checked }}
          UNREACHABLE_JSON: ${{ steps.check.outputs.unreachable-images }}
        shell: bash
        run: |
          # Length of a JSON array output; 0 when the check never wrote it.
          count() {
            if [ -n "$1" ]; then printf '%s' "$1" | jq 'length'; else echo 0; fi
          }
          UNREACHABLE_COUNT=$(count "$UNREACHABLE_JSON")
          RETRIED_COUNT=$(count "$RETRIED_JSON")
          PENDING_COUNT=$(count "$PENDING_JSON")
          CONFIRMED_COUNT=$(count "$CONFIRMED_JSON")
          EXHAUSTED_COUNT=$(count "$EXHAUSTED_JSON")
          STORED_LABEL="stored"
          if [ "$DRY_RUN" = "true" ]; then
            STORED_LABEL="not stored (dry run)"
          fi

          {
            echo "## 🔍 Docker Base Image Monitor Results"
            echo ""

            if [ "$DRY_RUN" = "true" ]; then
              echo "> ⚠️ **Dry run mode** - No changes were made"
              echo ""
            fi

            # Coverage first: the difference between configured and checked is the
            # single number that reveals a partially blind run. Reporting "up to
            # date" without it is what let two unreadable images go unnoticed.
            if [ -n "$IMAGES_CONFIGURED" ]; then
              echo "**Coverage:** $IMAGES_CHECKED of $IMAGES_CONFIGURED configured image(s) verified"
              echo ""
            fi

            if [ "$UNREACHABLE_COUNT" -gt 0 ]; then
              echo "### ⚠️ Incomplete check"
              echo ""
              echo "The following image(s) could not be read and were **not** verified:"
              echo ""
              printf '%s' "$UNREACHABLE_JSON" | jq -r '.[] | "- `" + . + "`"'
              echo ""
              echo "A common cause is an internal or private package: the calling workflow must grant \`packages: read\`."
              echo "See [GHCR Internal Visibility](https://github.com/bauer-group/automation-templates/blob/main/docs/ghcr-internal-visibility.md)."
              echo ""
            fi

            # Before the updates: a failed release is the one thing in this
            # summary that somebody has to look at.
            if [ "$EXHAUSTED_COUNT" -gt 0 ]; then
              echo "### 🛑 Release retries exhausted"
              echo ""
              echo "The release for these digests failed in each of its $MAX_ATTEMPTS attempt(s). It is no longer dispatched, and this job fails on every check until the cause is fixed."
              echo ""
              echo "| Image | Last failed run | Result |"
              echo "|-------|-----------------|--------|"
              printf '%s' "$EXHAUSTED_JSON" | jq -r '.[] | "| `\(.name)` | [\(.url | split("/") | last)](\(.url)) | ❌ Failed (\(.conclusion)), attempt \(.attempt) |"'
              echo ""
              echo "Fix the cause in the failed run, then delete the image's \`<variable>_PENDING\` repository variable: the next check dispatches the release again. A newer digest of the image starts over by itself."
              echo ""
            fi

            if [ "$RETRIED_COUNT" -gt 0 ]; then
              echo "### ❌ Release failed"
              echo ""
              echo "The release dispatched for these digests did not succeed, so the images are still built from the old base."
              if [ "$DRY_RUN" = "true" ]; then
                echo "A real run would dispatch the release again."
              else
                echo "The release is dispatched again below; every check repeats this until a run succeeds or \`max-release-attempts\` runs have failed."
              fi
              if [ "$RETRY_COMMIT" = "true" ] && [ "$RELEASE_TRIGGERED" = "true" ]; then
                echo "The failed run had already released the base image commit, so the retry comes with a new release commit - otherwise the run would find nothing to release and skip every build."
              fi
              echo ""
              echo "| Image | Failed run | Result |"
              echo "|-------|------------|--------|"
              printf '%s' "$RETRIED_JSON" | jq -r '.[] | "| `\(.name)` | [\(.url | split("/") | last)](\(.url)) | ❌ Failed (\(.conclusion)), attempt \(.attempt) |"'
              echo ""
            fi

            if [ "$UPDATES_FOUND" = "true" ]; then
              echo "### ✅ Updates found!"
              echo ""
              echo "**Updated images:**"
              printf '%s' "$UPDATED_IMAGES_JSON" | jq -r '.[] | "- `" + . + "`"'
              echo ""
              echo "**New digests:**"
              echo '```json'
              printf '%s' "$NEW_DIGESTS_JSON" | jq '.'
              echo '```'

              if [ "$RELEASE_TRIGGERED" = "true" ]; then
                echo ""
                echo "### 📝 Commit created"
                echo ""
                echo "| Property | Value |"
                echo "|----------|-------|"
                echo "| **Commit** | \`$RELEASE_SHA\` |"
                echo "| **Prefix** | \`$RELEASE_PREFIX\` |"
              fi

              if [ "$DISPATCH_TRIGGERED" = "true" ]; then
                echo ""
                echo "### 🚀 Workflow dispatched"
                echo ""
                if [ -n "$DISPATCH_RUN_URL" ]; then
                  echo "Target workflow \`$TARGET_WORKFLOW\` was triggered via \`workflow_dispatch\`: [run ${DISPATCH_RUN_URL##*/}]($DISPATCH_RUN_URL)."
                  echo ""
                  echo "The new digests are stored once this run has succeeded. The next check reads its result and dispatches the release again if it failed."
                else
                  echo "Target workflow \`$TARGET_WORKFLOW\` was triggered via \`workflow_dispatch\`."
                  echo ""
                  echo "> ⚠️ GitHub returned no run id, so the result of this release is not tracked - the new digests were stored right away."
                fi
              fi
            elif [ "$UNREACHABLE_COUNT" -gt 0 ]; then
              echo "### ℹ️ No updates among the images that could be read"
              echo ""
              echo "This is **not** a clean result - $UNREACHABLE_COUNT image(s) were never checked."
            elif [ "$PENDING_COUNT" -eq 0 ] && [ "$CONFIRMED_COUNT" -eq 0 ] && [ "$EXHAUSTED_COUNT" -eq 0 ]; then
              echo "### ℹ️ No updates found"
              echo ""
              echo "All base images are up to date."
            fi

            if [ "$PENDING_COUNT" -gt 0 ]; then
              echo ""
              echo "### ⏳ Release still running"
              echo ""
              echo "| Image | Run | Status |"
              echo "|-------|-----|--------|"
              printf '%s' "$PENDING_JSON" | jq -r '.[] | "| `\(.name)` | [\(.url | split("/") | last)](\(.url)) | \(if .state == "unknown" then "⚠️ Unknown - the run could not be read" else "⏳ Running" end) |"'
              echo ""
              echo "Each digest is stored once its run has succeeded; the next check reads the result again."
            fi

            if [ "$CONFIRMED_COUNT" -gt 0 ]; then
              echo ""
              echo "### ✅ Release confirmed"
              echo ""
              echo "| Image | Run | Result |"
              echo "|-------|-----|--------|"
              printf '%s' "$CONFIRMED_JSON" | jq -r '.[] | "| `\(.name)` | [\(.url | split("/") | last)](\(.url)) | ✅ Succeeded |"'
              echo ""
              echo "The new digests are $STORED_LABEL."
            fi

            if [ "$DRY_RUN" != "true" ] && [ "$STATE_CHANGED" = "true" ] && [ "$PERSIST_OUTCOME" != "success" ]; then
              echo ""
              echo "> ⚠️ The new state was **not** stored because a step failed. The next run detects this update again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, after the summary. Failing the check itself would also hold
      # back the updates and confirmations of every other image.
      - name: "🛑 Fail on exhausted release retries"
        if: steps.check.outputs.exhausted-images != '' && steps.check.outputs.exhausted-images != '[]'
        env:
          EXHAUSTED_IMAGES: ${{ steps.check.outputs.exhausted-images }}
        shell: bash
        run: |
          echo "::error::The release of $(printf '%s' "$EXHAUSTED_IMAGES" | jq -r 'join(", ")') failed max-release-attempts times and is no longer dispatched - see the summary"
          exit 1
