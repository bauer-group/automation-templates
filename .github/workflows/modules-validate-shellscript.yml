name: 🐚 Module | Validate Shell Scripts

on:
  workflow_call:
    inputs:
      scan-directory:
        description: 'Directory to scan for shell scripts'
        required: false
        type: string
        default: '.'

      scan-paths:
        description: 'Specific paths to scan (JSON array, e.g., ["scripts/", "bin/"])'
        required: false
        type: string
        default: ''

      severity:
        description: 'Minimum severity level (error, warning, info, style)'
        required: false
        type: string
        default: 'warning'

      shell-dialect:
        description: 'Shell dialect to check (sh, bash, dash, ksh, auto)'
        required: false
        type: string
        default: 'auto'

      exclude-patterns:
        description: 'Patterns to exclude (JSON array, e.g., ["*.bak", "vendor/*"])'
        required: false
        type: string
        default: ''

      exclude-codes:
        description: 'ShellCheck codes to exclude (JSON array, e.g., ["SC1091", "SC2034"])'
        required: false
        type: string
        default: ''

      enable-optional:
        description: 'Enable optional checks (JSON array, e.g., ["require-variable-braces", "check-unassigned-uppercase"])'
        required: false
        type: string
        default: ''

      external-sources:
        description: 'Allow shellcheck to follow source statements'
        required: false
        type: boolean
        default: true

      format:
        description: 'Output format (tty, checkstyle, diff, json1, json, gcc, quiet)'
        required: false
        type: string
        default: 'tty'

      fail-on-findings:
        description: 'Fail the workflow if issues are found'
        required: false
        type: boolean
        default: true

      additional-files:
        description: 'Additional file patterns to check (JSON array, e.g., ["*.sh.tpl", "Dockerfile.tmpl"])'
        required: false
        type: string
        default: ''

      runs-on:
        description: 'Runner to use. Use string for GitHub-hosted (e.g., "ubuntu-latest") or JSON array for self-hosted (e.g., ["self-hosted", "linux"])'
        required: false
        type: string
        default: 'ubuntu-latest'

    outputs:
      passed:
        description: 'Whether all scripts passed validation'
        value: ${{ jobs.shellcheck.outputs.passed }}

      files-checked:
        description: 'Number of files checked'
        value: ${{ jobs.shellcheck.outputs.files-checked }}

      issues-found:
        description: 'Number of issues found'
        value: ${{ jobs.shellcheck.outputs.issues-found }}

      error-count:
        description: 'Number of errors found'
        value: ${{ jobs.shellcheck.outputs.error-count }}

      warning-count:
        description: 'Number of warnings found'
        value: ${{ jobs.shellcheck.outputs.warning-count }}

permissions:
  contents: read

jobs:
  shellcheck:
    name: 🐚 ShellCheck
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}

    outputs:
      passed: ${{ steps.shellcheck.outputs.passed || steps.no-files.outputs.passed }}
      files-checked: ${{ steps.shellcheck.outputs.files-checked || steps.no-files.outputs.files-checked }}
      issues-found: ${{ steps.shellcheck.outputs.issues-found || steps.no-files.outputs.issues-found }}
      error-count: ${{ steps.shellcheck.outputs.error-count || steps.no-files.outputs.error-count }}
      warning-count: ${{ steps.shellcheck.outputs.warning-count || steps.no-files.outputs.warning-count }}

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v7

      - name: 📋 Find Shell Scripts
        id: find-scripts
        shell: bash
        run: |
          echo "🔍 Searching for shell scripts..."

          # Prepare scan paths
          SCAN_PATHS="${{ inputs.scan-directory }}"
          if [ -n '${{ inputs.scan-paths }}' ] && [ '${{ inputs.scan-paths }}' != '' ]; then
            SCAN_PATHS=$(echo '${{ inputs.scan-paths }}' | python3 -c "
          import sys, json
          paths = json.load(sys.stdin)
          print(' '.join(paths))
          ")
          fi

          echo "📂 Scan paths: $SCAN_PATHS"

          # Prepare exclude patterns for find command
          EXCLUDE_FIND=""
          if [ -n '${{ inputs.exclude-patterns }}' ] && [ '${{ inputs.exclude-patterns }}' != '' ]; then
            while IFS= read -r pattern; do
              EXCLUDE_FIND="$EXCLUDE_FIND -not -path '*${pattern}*'"
            done < <(echo '${{ inputs.exclude-patterns }}' | python3 -c "
          import sys, json
          for p in json.load(sys.stdin):
              print(p)
          ")
          fi

          # Always exclude common non-shell directories
          EXCLUDE_FIND="$EXCLUDE_FIND -not -path '*/.git/*' -not -path '*/node_modules/*' -not -path '*/__pycache__/*'"

          # Find shell scripts - ONLY .sh files by default
          SCRIPT_FILES=""

          for path in $SCAN_PATHS; do
            if [ -d "$path" ]; then
              # Find .sh files only
              while IFS= read -r file; do
                [ -n "$file" ] && SCRIPT_FILES="$SCRIPT_FILES $file"
              done < <(eval "find \"$path\" -type f -name '*.sh' $EXCLUDE_FIND 2>/dev/null")
            elif [ -f "$path" ]; then
              SCRIPT_FILES="$SCRIPT_FILES $path"
            fi
          done

          # Add additional file patterns if specified
          if [ -n '${{ inputs.additional-files }}' ] && [ '${{ inputs.additional-files }}' != '' ]; then
            while IFS= read -r pattern; do
              for path in $SCAN_PATHS; do
                if [ -d "$path" ]; then
                  while IFS= read -r file; do
                    [ -n "$file" ] && SCRIPT_FILES="$SCRIPT_FILES $file"
                  done < <(eval "find \"$path\" -type f -name '$pattern' $EXCLUDE_FIND 2>/dev/null")
                fi
              done
            done < <(echo '${{ inputs.additional-files }}' | python3 -c "
          import sys, json
          for p in json.load(sys.stdin):
              print(p)
          ")
          fi

          # Remove duplicates and count (use || true to prevent grep exit code 1 on empty input)
          SCRIPT_FILES=$(echo "$SCRIPT_FILES" | tr ' ' '\n' | sort -u | grep -v '^$' || true)
          SCRIPT_FILES=$(echo "$SCRIPT_FILES" | tr '\n' ' ')
          FILE_COUNT=$(echo "$SCRIPT_FILES" | wc -w | tr -d ' ')

          if [ "$FILE_COUNT" -gt 0 ]; then
            echo "📄 Found $FILE_COUNT shell script(s):"
            echo "$SCRIPT_FILES" | tr ' ' '\n' | grep -v '^$' | head -30 | while read -r f; do
              echo "   - $f"
            done

            if [ "$FILE_COUNT" -gt 30 ]; then
              echo "   ... and $((FILE_COUNT - 30)) more"
            fi
          fi

          # Save to file for next step
          echo "$SCRIPT_FILES" > /tmp/script-files.txt
          echo "file-count=$FILE_COUNT" >> "$GITHUB_OUTPUT"

          # Handle no files found
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ℹ️ No shell scripts found - skipping validation"
            echo "no-files=true" >> "$GITHUB_OUTPUT"
          else
            echo "no-files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🐚 Run ShellCheck
        id: shellcheck
        if: steps.find-scripts.outputs.no-files != 'true'
        shell: bash
        run: |
          echo "🔍 Running ShellCheck analysis..."

          # Build shellcheck arguments (without format - we'll add it per-use)
          SHELLCHECK_ARGS="--severity=${{ inputs.severity }}"

          # Shell dialect
          if [ "${{ inputs.shell-dialect }}" != "auto" ]; then
            SHELLCHECK_ARGS="$SHELLCHECK_ARGS --shell=${{ inputs.shell-dialect }}"
          fi

          # External sources
          if [ "${{ inputs.external-sources }}" = "true" ]; then
            SHELLCHECK_ARGS="$SHELLCHECK_ARGS --external-sources"
          fi

          # Exclude codes
          if [ -n '${{ inputs.exclude-codes }}' ] && [ '${{ inputs.exclude-codes }}' != '' ]; then
            EXCLUDE_CODES=$(echo '${{ inputs.exclude-codes }}' | python3 -c "
          import sys, json
          codes = json.load(sys.stdin)
          print(','.join(codes))
          ")
            SHELLCHECK_ARGS="$SHELLCHECK_ARGS --exclude=$EXCLUDE_CODES"
          fi

          # Enable optional checks
          if [ -n '${{ inputs.enable-optional }}' ] && [ '${{ inputs.enable-optional }}' != '' ]; then
            ENABLE_OPTS=$(echo '${{ inputs.enable-optional }}' | python3 -c "
          import sys, json
          opts = json.load(sys.stdin)
          print(','.join(opts))
          ")
            SHELLCHECK_ARGS="$SHELLCHECK_ARGS --enable=$ENABLE_OPTS"
          fi

          echo "📋 ShellCheck arguments: $SHELLCHECK_ARGS"
          echo ""

          # Read script files
          SCRIPT_FILES=$(cat /tmp/script-files.txt | tr '\n' ' ')
          FILE_COUNT=${{ steps.find-scripts.outputs.file-count }}

          # Run shellcheck once with JSON format for counting.
          #
          # ShellCheck's own exit status is what tells us whether a result exists:
          #   0    = scanned, no findings
          #   1    = scanned, findings reported
          #   >= 2 = ShellCheck could NOT do its job (unreadable input file, unknown
          #          flag, bad --severity/--shell/--exclude/--format value)
          # On exit 2 ShellCheck still prints a valid but empty "[]" on stdout, and on
          # exit 3/4 it prints nothing at all. The previous form discarded the status
          # with "|| true" and parsed the result under a bare "except", so every one of
          # those crashes came out as "0 issues found" - a gate that reported pass
          # without having checked anything. Now the status is captured and anything
          # above 1 fails the step. set +e is required here: "if ! cmd; then rc=$?"
          # would capture the status of the negation (always 0), not of ShellCheck.
          set +e
          # shellcheck disable=SC2086
          JSON_OUTPUT=$(shellcheck --format=json $SHELLCHECK_ARGS $SCRIPT_FILES 2>/tmp/shellcheck-stderr.txt)
          SHELLCHECK_RC=$?
          set -e

          if [ "$SHELLCHECK_RC" -gt 1 ]; then
            echo ""
            echo "❌ ShellCheck could not complete the analysis (exit code $SHELLCHECK_RC)"
            echo "   No verdict was produced, so this gate fails instead of reporting a clean run."
            if [ -s /tmp/shellcheck-stderr.txt ]; then
              echo "   ShellCheck reported:"
              sed 's/^/     /' /tmp/shellcheck-stderr.txt
            fi
            exit 1
          fi

          # Parse JSON to count issues. Unreadable output must not read as "no issues"
          # either, so the parser now fails loudly instead of swallowing the error.
          set +e
          COUNTS=$(printf '%s' "$JSON_OUTPUT" | python3 -c "
          import sys, json
          raw = sys.stdin.read().strip()
          data = json.loads(raw) if raw else []
          if not isinstance(data, list):
              raise SystemExit('ShellCheck JSON payload is not a list')
          errors = sum(1 for c in data if c.get('level') == 'error')
          warnings = sum(1 for c in data if c.get('level') == 'warning')
          print(f'{len(data)} {errors} {warnings}')
          ")
          PARSE_RC=$?
          set -e

          if [ "$PARSE_RC" -ne 0 ]; then
            echo ""
            echo "❌ Could not parse the ShellCheck JSON output (parser exit code $PARSE_RC)"
            echo "   Refusing to report a clean run from output that could not be read."
            exit 1
          fi

          read -r ISSUES_FOUND ERROR_COUNT WARNING_COUNT <<< "$COUNTS"

          # ShellCheck exits 1 only when it actually emitted findings - the --severity
          # and --exclude filters lower the exit code to 0 along with the payload - so
          # "exit 1 but nothing counted" means the count cannot be trusted. Fail rather
          # than let an uncountable scan through as a pass.
          if [ "$SHELLCHECK_RC" -eq 1 ] && [ "$ISSUES_FOUND" -eq 0 ]; then
            echo ""
            echo "❌ ShellCheck signalled findings (exit code 1) but none could be counted"
            echo "   The result is inconsistent, so this gate fails instead of reporting a clean run."
            exit 1
          fi

          # Determine pass/fail
          if [ "$ISSUES_FOUND" -gt 0 ]; then
            PASSED="false"
          else
            PASSED="true"
          fi

          # Now run with TTY format for human-readable display
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          # shellcheck disable=SC2086
          shellcheck --format=${{ inputs.format }} $SHELLCHECK_ARGS $SCRIPT_FILES 2>&1 || true
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Summary
          echo ""
          echo "📊 ShellCheck Results:"
          echo "   Files checked: $FILE_COUNT"
          echo "   Issues found:  $ISSUES_FOUND"
          echo "   Errors:        $ERROR_COUNT"
          echo "   Warnings:      $WARNING_COUNT"

          # Set outputs
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "files-checked=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "issues-found=$ISSUES_FOUND" >> "$GITHUB_OUTPUT"
          echo "error-count=$ERROR_COUNT" >> "$GITHUB_OUTPUT"
          echo "warning-count=$WARNING_COUNT" >> "$GITHUB_OUTPUT"

          # Determine exit status
          if [ "$PASSED" = "false" ] && [ "${{ inputs.fail-on-findings }}" = "true" ]; then
            echo ""
            echo "❌ ShellCheck found issues - see above for details"
            exit 1
          elif [ "$PASSED" = "false" ]; then
            echo ""
            echo "⚠️ ShellCheck found issues (fail-on-findings: false)"
          else
            echo ""
            echo "✅ All shell scripts passed ShellCheck validation"
          fi

      - name: 📊 Handle No Files
        if: steps.find-scripts.outputs.no-files == 'true'
        id: no-files
        shell: bash
        run: |
          echo "passed=true" >> "$GITHUB_OUTPUT"
          echo "files-checked=0" >> "$GITHUB_OUTPUT"
          echo "issues-found=0" >> "$GITHUB_OUTPUT"
          echo "error-count=0" >> "$GITHUB_OUTPUT"
          echo "warning-count=0" >> "$GITHUB_OUTPUT"
          echo "ℹ️ No shell scripts found - validation passed"

      - name: 📊 Summary
        if: always()
        shell: bash
        run: |
          echo "### 🐚 ShellCheck Validation Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          PASSED="${{ steps.shellcheck.outputs.passed || steps.no-files.outputs.passed || 'true' }}"
          FILES="${{ steps.shellcheck.outputs.files-checked || steps.no-files.outputs.files-checked || '0' }}"
          ISSUES="${{ steps.shellcheck.outputs.issues-found || steps.no-files.outputs.issues-found || '0' }}"
          ERRORS="${{ steps.shellcheck.outputs.error-count || steps.no-files.outputs.error-count || '0' }}"
          WARNINGS="${{ steps.shellcheck.outputs.warning-count || steps.no-files.outputs.warning-count || '0' }}"

          if [ "$PASSED" = "true" ]; then
            echo "✅ **Validation Passed**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Validation Failed**" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Files Checked** | $FILES |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Total Issues** | $ISSUES |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Errors** | $ERRORS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Warnings** | $WARNINGS |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### ⚙️ Configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Severity** | \`${{ inputs.severity }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Shell Dialect** | \`${{ inputs.shell-dialect }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Scan Directory** | \`${{ inputs.scan-directory }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Fail on Findings** | \`${{ inputs.fail-on-findings }}\` |" >> "$GITHUB_STEP_SUMMARY"
