name: 'Security Scan Meta Package'
description: 'Dependency vulnerability scanning with Trivy and opt-in secret scanning with Gitleaks'
author: 'BAUER GROUP'

inputs:
  scan-engine:
    description: >-
      Secret scan engine. 'none' (default): Gitleaks is opt-in and does not run, and
      the run says so with a notice. 'gitleaks': run the gitleaks-scan action - enable
      it in repositories without GitHub secret scanning and push protection. 'both' is
      still accepted and runs gitleaks. 'gitguardian' is deprecated: GitGuardian was
      removed, so it runs NO secret scanner and the run says so with a warning.
    required: false
    default: 'none'
  scan-type:
    description: 'Type of security scan to perform (secrets, vulnerabilities, all)'
    required: false
    default: 'all'
  fail-on-findings:
    description: 'Fail the workflow if security issues are found'
    required: false
    default: 'true'
  minimum-severity:
    description: 'Deprecated and ignored: it only ever configured GitGuardian.'
    required: false
    default: 'medium'
    deprecationMessage: 'minimum-severity only configured GitGuardian, which was removed; it is ignored and can be dropped.'
  exclude-paths:
    description: 'Paths to exclude from scanning (comma-separated)'
    required: false
    default: '.git,node_modules,vendor,target,dist,build'
  gitguardian-api-key:
    description: 'Deprecated and ignored: GitGuardian scanning was removed.'
    required: false
    default: ''
    deprecationMessage: 'GitGuardian scanning was removed from automation-templates; gitguardian-api-key is ignored and can be dropped.'
  github-token:
    description: 'GitHub Token for API access (optional for Gitleaks, required for org repos)'
    required: false
    default: ''
  gitleaks-config:
    description: 'Path to custom Gitleaks configuration file'
    required: false
    default: ''
  gitguardian-mode:
    description: 'Deprecated and ignored: GitGuardian scanning was removed.'
    required: false
    default: 'ci'
    deprecationMessage: 'GitGuardian scanning was removed from automation-templates; gitguardian-mode is ignored and can be dropped.'
  scan-history:
    description: 'Scan entire git history with Gitleaks'
    required: false
    default: 'false'
  verbose:
    description: 'Enable verbose output'
    required: false
    default: 'false'

outputs:
  security-score:
    description: 'Security score (0-100)'
    value: ${{ steps.summary.outputs.security-score }}
  best-engine-score:
    description: 'Kept for compatibility: equals security-score since only one secret engine remains'
    value: ${{ steps.summary.outputs.best-engine-score }}
  scan-results:
    description: 'Overall scan results summary'
    value: ${{ steps.summary.outputs.scan-results }}
  engines-used:
    description: 'Comma-separated list of engines that were executed'
    value: ${{ steps.summary.outputs.engines-used }}
  gitleaks-secrets:
    description: 'Whether Gitleaks found secrets (true/false); empty when Gitleaks did not run'
    value: ${{ steps.gitleaks-scan.outputs.secrets-found }}
  gitleaks-count:
    description: 'Number of secrets found by Gitleaks'
    value: ${{ steps.gitleaks-scan.outputs.secrets-count }}
  vulnerabilities-found:
    description: 'Whether vulnerabilities were found (true/false, or unknown when the Trivy report could not be evaluated)'
    value: ${{ steps.vulnerability-scan.outputs.vulnerabilities-found }}

runs:
  using: 'composite'
  steps:
    - name: 🛡️ Initialize Security Scan
      shell: bash
      env:
        SCAN_ENGINE: ${{ inputs.scan-engine }}
        SCAN_TYPE: ${{ inputs.scan-type }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        SCAN_HISTORY: ${{ inputs.scan-history }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
      run: |
        set -uo pipefail

        # Gitleaks is opt-in (2026-10): 'none' - the default - and an empty value
        # mean "not enabled" and get a notice, not a warning.
        # GitGuardian was removed (2026-10): in CI it scanned only the last commit and
        # could not report a finding. The old engine names stay accepted, see the
        # security-scan action for the reasoning: 'both' runs gitleaks, 'gitguardian'
        # runs no secret scanner (mapping it to gitleaks would override a caller that
        # chose it to keep gitleaks off).
        GITLEAKS_STATE="not scanned"
        case "$SCAN_ENGINE" in
          none | '')
            ENGINES_TO_USE=""
            GITLEAKS_STATE="disabled (opt-in, enable with scan-engine: 'gitleaks')"
            echo "::notice title=Gitleaks disabled::Gitleaks is opt-in and was not enabled (scan-engine: '${SCAN_ENGINE:-none}'), so this run scanned no secrets. Enable it with scan-engine: 'gitleaks' in repositories without GitHub secret scanning and push protection." ;;
          gitleaks)
            ENGINES_TO_USE="gitleaks" ;;
          both)
            ENGINES_TO_USE="gitleaks"
            echo "::notice title=GitGuardian removed::scan-engine 'both' now runs Gitleaks only, because GitGuardian was removed from automation-templates. Set scan-engine: 'gitleaks' to silence this notice." ;;
          *)
            ENGINES_TO_USE=""
            echo "::warning title=No secret scan ran::scan-engine '${SCAN_ENGINE}' runs no secret scanner (GitGuardian was removed from automation-templates). Valid values: 'none' (default, Gitleaks disabled) and 'gitleaks'." ;;
        esac

        echo "🛡️ Initializing Security Scan Meta Package"
        echo "==============================================="
        echo "Scan Engine: ${SCAN_ENGINE} (secret scanner: ${ENGINES_TO_USE:-none})"
        echo "Scan Type: ${SCAN_TYPE}"
        echo "Fail on Findings: ${FAIL_ON_FINDINGS}"
        echo "Scan History: ${SCAN_HISTORY}"
        echo "Exclude Paths: ${EXCLUDE_PATHS}"

        mkdir -p security-reports
        echo "ENGINES_TO_USE=$ENGINES_TO_USE" >> "$GITHUB_ENV"
        echo "GITLEAKS_STATE=$GITLEAKS_STATE" >> "$GITHUB_ENV"

    - name: 🔍 Run Gitleaks Security Scan
      id: gitleaks-scan
      if: contains(env.ENGINES_TO_USE, 'gitleaks')
      uses: bauer-group/automation-templates/.github/actions/gitleaks-scan@main
      with:
        fail-on-findings: 'false'  # Let meta package handle failure
        config-path: ${{ inputs.gitleaks-config }}
        exclude-paths: ${{ inputs.exclude-paths }}
        scan-history: ${{ inputs.scan-history }}
        verbose: ${{ inputs.verbose }}
        github-token: ${{ inputs.github-token }}
        format: 'json'

    - name: 🔬 Trivy Vulnerability Scan
      id: trivy-vuln-scan
      if: inputs.scan-type == 'all' || inputs.scan-type == 'vulnerabilities'
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'json'
        output: 'security-reports/trivy-results.json'
        severity: 'CRITICAL,HIGH,MEDIUM'
        scanners: 'vuln'
        exit-code: '0'

    - name: 📊 Evaluate Vulnerability Results
      id: vulnerability-scan
      if: inputs.scan-type == 'all' || inputs.scan-type == 'vulnerabilities'
      shell: bash
      run: |
        echo "🔬 Evaluating Trivy vulnerability scan results..."

        VULNS_FOUND="false"
        CRITICAL=0
        HIGH=0
        MEDIUM=0
        SCAN_OK=true

        REPORT="security-reports/trivy-results.json"

        # Fail closed on an unusable report. This step carries the same `if:` as the
        # Trivy step, so it only runs when Trivy ran: a missing or unparsable report
        # means the scan delivered no verdict, which is not the same as "no findings".
        # The previous code silently kept the counts at 0 in that case - and on an
        # empty report jq exits 0 without printing anything, so `|| echo "0"` never
        # fired and the counts became empty strings - which the gate below then read
        # as a clean result. A clean Trivy report is still a JSON object (it simply
        # carries no .Results), so this guard cannot trip on a healthy scan.
        if [ ! -f "$REPORT" ] || ! jq -e 'type == "object"' "$REPORT" >/dev/null 2>&1; then
          SCAN_OK=false
        else
          # `if ! jq ...` would only ever report the status of the negation, so jq's
          # real exit code is captured with set +e / set -e around the call.
          set +e
          COUNTS="$(jq -r '
            [.Results[]?.Vulnerabilities[]? | (.Severity // "UNKNOWN") | ascii_upcase] as $sev
            | [ ($sev | map(select(. == "CRITICAL")) | length),
                ($sev | map(select(. == "HIGH"))     | length),
                ($sev | map(select(. == "MEDIUM"))   | length) ]
            | @tsv' "$REPORT" 2>/dev/null)"
          JQ_RC=$?
          set -e

          read -r CRITICAL HIGH MEDIUM <<< "$COUNTS" || true
          for COUNT in "$CRITICAL" "$HIGH" "$MEDIUM"; do
            case "$COUNT" in
              ''|*[!0-9]*) SCAN_OK=false ;;
            esac
          done
          [ "$JQ_RC" -eq 0 ] || SCAN_OK=false
        fi

        if [ "$SCAN_OK" != "true" ]; then
          # 'unknown' is the sentinel the gate refuses to read as a pass (the same one
          # the security-scan action uses for a scanner that did not deliver a result).
          echo "::error::Trivy produced no readable $REPORT - vulnerabilities could not be evaluated"
          VULNS_FOUND="unknown"
          CRITICAL=0
          HIGH=0
          MEDIUM=0
        else
          TOTAL=$((CRITICAL + HIGH + MEDIUM))
          if [ "$TOTAL" -gt 0 ]; then
            VULNS_FOUND="true"
          fi

          echo "🔬 Trivy Vulnerability Results:"
          echo "  • Critical: $CRITICAL"
          echo "  • High: $HIGH"
          echo "  • Medium: $MEDIUM"
        fi

        echo "vulnerabilities-found=$VULNS_FOUND" >> "$GITHUB_OUTPUT"
        echo "trivy-critical=$CRITICAL" >> "$GITHUB_OUTPUT"
        echo "trivy-high=$HIGH" >> "$GITHUB_OUTPUT"
        echo "trivy-medium=$MEDIUM" >> "$GITHUB_OUTPUT"
        echo "Vulnerabilities found: $VULNS_FOUND"

    - name: 📊 Generate Security Summary
      id: summary
      shell: bash
      env:
        # 'skipped', not 'false': when Gitleaks did not run, nothing was found
        # because nothing was looked at, and 'false' reads as a clean scan.
        GITLEAKS_SECRETS: ${{ steps.gitleaks-scan.outputs.secrets-found || 'skipped' }}
        GITLEAKS_COUNT: ${{ steps.gitleaks-scan.outputs.secrets-count || '0' }}
        VULNS_FOUND: ${{ steps.vulnerability-scan.outputs.vulnerabilities-found || 'false' }}
        TRIVY_CRITICAL: ${{ steps.vulnerability-scan.outputs.trivy-critical || '0' }}
        TRIVY_HIGH: ${{ steps.vulnerability-scan.outputs.trivy-high || '0' }}
        TRIVY_MEDIUM: ${{ steps.vulnerability-scan.outputs.trivy-medium || '0' }}
      run: |
        set -uo pipefail
        echo "📊 Generating security summary..."

        ENGINES_USED="${ENGINES_TO_USE:-}"

        SCORE=100
        if [ "$GITLEAKS_SECRETS" == "true" ] && [ "$GITLEAKS_COUNT" -gt 0 ] 2>/dev/null; then
          PENALTY=$((GITLEAKS_COUNT * 20))
          if [ $PENALTY -gt 80 ]; then
            PENALTY=80
          fi
          SCORE=$((SCORE - PENALTY))
        fi

        VULN_PENALTY=$((TRIVY_CRITICAL * 30 + TRIVY_HIGH * 15 + TRIVY_MEDIUM * 5))
        if [ $VULN_PENALTY -gt 50 ]; then
          VULN_PENALTY=50
        fi
        if [ "$VULNS_FOUND" == "true" ]; then
          SCORE=$((SCORE - VULN_PENALTY))
        fi
        if [ $SCORE -lt 0 ]; then
          SCORE=0
        fi

        SUMMARY="Security Scan Complete"
        if [[ "$GITLEAKS_SECRETS" == "true" || "$VULNS_FOUND" == "true" ]]; then
          SUMMARY="Security Issues Found"
        fi

        {
          echo "security-score=$SCORE"
          echo "best-engine-score=$SCORE"
          echo "scan-results=$SUMMARY"
          echo "engines-used=$ENGINES_USED"
        } >> "$GITHUB_OUTPUT"

        cat > security-reports/dual-security-summary.md << EOF
        # 🛡️ Security Scan Meta Package Summary

        **Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        **Secret Engine:** ${ENGINES_USED:-none}
        **Score:** $SCORE/100
        **Status:** $SUMMARY

        | Scan | Result |
        |------|--------|
        | **Secrets (Gitleaks)** | $([[ "$ENGINES_USED" == *"gitleaks"* ]] && echo "$GITLEAKS_SECRETS ($GITLEAKS_COUNT)" || echo "${GITLEAKS_STATE:-not scanned}") |
        | **Vulnerabilities (Trivy)** | $VULNS_FOUND (critical $TRIVY_CRITICAL, high $TRIVY_HIGH, medium $TRIVY_MEDIUM) |

        ## 🔗 Resources

        - [Gitleaks Documentation](https://github.com/gitleaks/gitleaks)
        - [Trivy Documentation](https://trivy.dev/)
        - [OWASP Secrets Management](https://owasp.org/www-project-secrets-management-cheat-sheet/)
        EOF

        echo ""
        echo "🛡️ Security Scan Meta Package Summary:"
        echo "  • Secret Engine: ${ENGINES_USED:-none}"
        echo "  • Score: $SCORE/100"
        if [[ "$ENGINES_USED" == *"gitleaks"* ]]; then
          echo "  • Gitleaks Secrets: $GITLEAKS_SECRETS ($GITLEAKS_COUNT)"
        else
          echo "  • Gitleaks Secrets: ${GITLEAKS_STATE:-not scanned}"
        fi
        echo "  • Vulnerabilities: $VULNS_FOUND"
        echo "  • Status: $SUMMARY"

    - name: 📤 Upload Consolidated Security Reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dual-security-scan-reports
        path: |
          security-reports/
          gitleaks-reports/
        retention-days: 30

    - name: 🚨 Evaluate Security Findings
      if: inputs.fail-on-findings == 'true'
      shell: bash
      # Scanner results reach the script through env: instead of being interpolated
      # into the body, so nothing a scanner reports can be parsed as shell.
      env:
        GITLEAKS_SECRETS: ${{ steps.gitleaks-scan.outputs.secrets-found || 'skipped' }}
        VULNS_FOUND: ${{ steps.vulnerability-scan.outputs.vulnerabilities-found || 'false' }}
        TRIVY_CRITICAL: ${{ steps.vulnerability-scan.outputs.trivy-critical || '0' }}
        TRIVY_HIGH: ${{ steps.vulnerability-scan.outputs.trivy-high || '0' }}
        TRIVY_MEDIUM: ${{ steps.vulnerability-scan.outputs.trivy-medium || '0' }}
        SCORE: ${{ steps.summary.outputs.security-score }}
        ENGINES_USED: ${{ steps.summary.outputs.engines-used }}
      run: |
        SHOULD_FAIL=false

        if [ "$GITLEAKS_SECRETS" == "true" ]; then
          echo "❌ Critical: Gitleaks detected secrets"
          SHOULD_FAIL=true
        fi

        # Vulnerabilities used to print this warning and nothing else: SHOULD_FAIL was
        # never set, so a run with CRITICAL/HIGH/MEDIUM CVEs still ended in
        # "✅ Security scan completed successfully" and exit 0 while fail-on-findings
        # was 'true' - the gate reported a pass it had not earned. Findings now fail it,
        # matching the security-scan action, which fails on vulnerabilities-found alone.
        # 'unknown' fails too: a scan that produced no readable result is not a clean scan.
        if [ "$VULNS_FOUND" == "true" ]; then
          echo "❌ Critical: Trivy detected vulnerabilities (critical: $TRIVY_CRITICAL, high: $TRIVY_HIGH, medium: $TRIVY_MEDIUM)"
          SHOULD_FAIL=true
        elif [ "$VULNS_FOUND" == "unknown" ]; then
          echo "❌ Critical: Vulnerability scan produced no readable result - failing closed"
          SHOULD_FAIL=true
        fi

        if [ "$SHOULD_FAIL" == "true" ]; then
          echo ""
          echo "💥 Security Scan Failed Due to Critical Findings"
          echo "================================================"
          echo "  • Score: $SCORE/100"
          echo "  • Secret Engine: ${ENGINES_USED:-none}"
          if [ "$GITLEAKS_SECRETS" = "skipped" ]; then
            echo "  • Gitleaks Secrets: ${GITLEAKS_STATE:-not scanned}"
          else
            echo "  • Gitleaks Secrets: $GITLEAKS_SECRETS"
          fi
          echo "  • Vulnerabilities: $VULNS_FOUND"
          echo ""
          echo "🔗 Review the dual-security-scan-reports artifact for detailed information."
          exit 1
        else
          echo "✅ Security scan completed successfully"
          echo "No critical security issues detected."
        fi

branding:
  icon: 'shield'
  color: 'blue'
