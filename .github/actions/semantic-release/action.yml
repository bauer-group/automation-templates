name: 'Semantic Release'
description: 'Automated semantic versioning and release creation with changelog generation'
author: 'BAUER GROUP'

inputs:
  dry-run:
    description: 'Run in dry-run mode without creating release'
    required: false
    default: 'false'
  branches:
    description: 'Branches to release from (JSON array or single branch)'
    required: false
    default: 'main'
  extra-plugins:
    description: 'Extra semantic-release plugins to install'
    required: false
    default: ''
  node-version:
    description: 'Node.js version to use (semantic-release v25 requires >= 22.14 / >= 24.10)'
    required: false
    default: '24'
  token:
    description: 'GitHub token for authentication'
    required: true
  force-release:
    description: 'Force create release even without conventional commits'
    required: false
    default: 'false'
  changelog-title:
    description: >-
      Preamble kept pinned at the top of the changelog file (title + intro).
      Used only when the changelog has no existing preamble; an existing
      preamble (everything above the first "## " entry) is always preserved.
      Leave empty to use the built-in BAUER GROUP standard preamble.
    required: false
    default: ''

outputs:
  release-created:
    description: 'Whether a release was created'
    value: ${{ steps.release.outputs.new_release_published }}
  version:
    description: 'The new version'
    value: ${{ steps.release.outputs.new_release_version }}
  tag:
    description: 'The git tag'
    value: ${{ steps.tag.outputs.tag }}
  changelog:
    description: 'The changelog for this release'
    value: ${{ steps.release.outputs.new_release_notes }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build Config
      shell: bash
      env:
        DEFAULT_CHANGELOG_TITLE: ${{ inputs.changelog-title }}
      run: |
        echo "Building semantic-release config..."

        # Default release rules
        DEFAULT_RULES='[
          {"breaking": true, "release": "major"},
          {"type": "feat", "release": "minor"},
          {"type": "fix", "release": "patch"},
          {"type": "perf", "release": "patch"},
          {"type": "revert", "release": "patch"},
          {"type": "refactor", "release": "patch"}
        ]'

        FORCE_RULES='[
          {"breaking": true, "release": "major"},
          {"type": "feat", "release": "minor"},
          {"type": "fix", "release": "patch"},
          {"type": "perf", "release": "patch"},
          {"type": "revert", "release": "patch"},
          {"type": "refactor", "release": "patch"},
          {"type": "docs", "release": "patch"},
          {"type": "style", "release": "patch"},
          {"type": "chore", "release": "patch"},
          {"type": "test", "release": "patch"},
          {"type": "build", "release": "patch"},
          {"type": "ci", "release": "patch"},
          {"message": "*", "release": "patch"}
        ]'

        # Check for repo-specific config to merge
        EXTRA_PLUGINS="[]"
        CHANGELOG_FILE="CHANGELOG.md"
        GIT_ASSETS='["CHANGELOG.md"]'
        GIT_MESSAGE='"chore(release): ${nextRelease.version}\n\n${nextRelease.notes}"'
        RELEASE_RULES=""
        TAG_FORMAT=""
        CUSTOM_TITLE=""

        if [ -f ".github/config/release/semantic-release.json" ]; then
          echo "Found repository config - extracting custom settings..."
          REPO_CONFIG=".github/config/release/semantic-release.json"

          # Extract releaseRules if specified (REPLACES default rules)
          CUSTOM_RULES=$(jq -c '.plugins[] | select(type == "array") | select(.[0] == "@semantic-release/commit-analyzer") | .[1].releaseRules // empty' "$REPO_CONFIG" 2>/dev/null || echo "")
          if [ -n "$CUSTOM_RULES" ] && [ "$CUSTOM_RULES" != "null" ] && [ "$CUSTOM_RULES" != "[]" ]; then
            RELEASE_RULES="$CUSTOM_RULES"
            echo "  Using custom releaseRules from repo config"
          fi

          # Extract changelog file path if specified
          CUSTOM_CHANGELOG=$(jq -r '.plugins[] | select(type == "array") | select(.[0] == "@semantic-release/changelog") | .[1].changelogFile // empty' "$REPO_CONFIG" 2>/dev/null || echo "")
          if [ -n "$CUSTOM_CHANGELOG" ]; then
            CHANGELOG_FILE="$CUSTOM_CHANGELOG"
            echo "  Using custom changelog: $CHANGELOG_FILE"
          fi

          # Extract git assets if specified
          CUSTOM_ASSETS=$(jq -c '.plugins[] | select(type == "array") | select(.[0] == "@semantic-release/git") | .[1].assets // empty' "$REPO_CONFIG" 2>/dev/null || echo "")
          if [ -n "$CUSTOM_ASSETS" ] && [ "$CUSTOM_ASSETS" != "null" ]; then
            GIT_ASSETS="$CUSTOM_ASSETS"
            echo "  Using custom git assets: $GIT_ASSETS"
          fi

          # Extract git message if specified (keep as JSON string to preserve escapes)
          CUSTOM_MESSAGE=$(jq '.plugins[] | select(type == "array") | select(.[0] == "@semantic-release/git") | .[1].message // empty' "$REPO_CONFIG" 2>/dev/null || echo "null")
          if [ "$CUSTOM_MESSAGE" != "null" ] && [ "$CUSTOM_MESSAGE" != '""' ] && [ -n "$CUSTOM_MESSAGE" ]; then
            GIT_MESSAGE="$CUSTOM_MESSAGE"
            echo "  Using custom git message"
          fi

          # Extract extra plugins (exclude the plugins this action already provides:
          # commit-analyzer, exec, release-notes-generator, changelog, git, github)
          EXTRA_PLUGINS=$(jq -c '[.plugins[] | select(
            (type == "string" and . != "@semantic-release/commit-analyzer" and . != "@semantic-release/exec" and . != "@semantic-release/release-notes-generator" and . != "@semantic-release/changelog" and . != "@semantic-release/git" and . != "@semantic-release/github") or
            (type == "array" and .[0] != "@semantic-release/commit-analyzer" and .[0] != "@semantic-release/exec" and .[0] != "@semantic-release/release-notes-generator" and .[0] != "@semantic-release/changelog" and .[0] != "@semantic-release/git" and .[0] != "@semantic-release/github")
          )]' "$REPO_CONFIG" 2>/dev/null || echo "[]")

          if [ "$EXTRA_PLUGINS" != "[]" ] && [ "$EXTRA_PLUGINS" != "null" ]; then
            echo "  Found extra plugins: $EXTRA_PLUGINS"
          else
            EXTRA_PLUGINS="[]"
          fi

          # Extract tagFormat if specified
          CUSTOM_TAG_FORMAT=$(jq -r '.tagFormat // empty' "$REPO_CONFIG" 2>/dev/null || echo "")
          if [ -n "$CUSTOM_TAG_FORMAT" ]; then
            TAG_FORMAT="$CUSTOM_TAG_FORMAT"
            echo "  Using custom tagFormat: $TAG_FORMAT"
          fi

          # Extract changelogTitle if specified (repo config takes precedence over the
          # preserved-preamble / action-input default resolved further below)
          CUSTOM_TITLE=$(jq -r '.plugins[] | select(type == "array") | select(.[0] == "@semantic-release/changelog") | .[1].changelogTitle // empty' "$REPO_CONFIG" 2>/dev/null || echo "")
          if [ -n "$CUSTOM_TITLE" ]; then
            echo "  Using custom changelogTitle from repo config"
          fi
        else
          echo "No repository config found - using defaults"
        fi

        # Determine final release rules
        if [ -n "$RELEASE_RULES" ]; then
          echo "Using: custom releaseRules from repo"
        elif [ "${{ inputs.force-release }}" = "true" ]; then
          echo "Using: force-release rules (all commit types trigger release)"
          RELEASE_RULES="$FORCE_RULES"
        else
          echo "Using: standard releaseRules (feat/fix/perf/revert/refactor)"
          RELEASE_RULES="$DEFAULT_RULES"
        fi

        # Build the final config
        cat > .releaserc.json << EOF
        {
          "branches": ["${{ inputs.branches }}"],
          "plugins": [
            ["@semantic-release/commit-analyzer", {
              "preset": "conventionalcommits",
              "releaseRules": $RELEASE_RULES
            }],
            ["@semantic-release/exec", {
              "generateNotesCmd": "node \"$GITHUB_ACTION_PATH/notes/notes.mjs\" \"\${lastRelease.gitTag}\" \"\${nextRelease.gitTag}\" \"\${nextRelease.version}\""
            }],
            ["@semantic-release/changelog", {
              "changelogFile": "$CHANGELOG_FILE"
            }],
            ["@semantic-release/git", {
              "assets": $GIT_ASSETS,
              "message": $GIT_MESSAGE
            }],
            "@semantic-release/github"
          ]
        }
        EOF

        # Merge tagFormat if specified (via jq for safe JSON handling)
        if [ -n "$TAG_FORMAT" ]; then
          jq --arg tf "$TAG_FORMAT" '.tagFormat = $tf' .releaserc.json > .releaserc.tmp.json && mv .releaserc.tmp.json .releaserc.json
        fi

        # Built-in standard preamble (single source of truth). Used when neither the
        # repo, the existing file, nor the changelog-title input provide one — so an
        # empty input passed through by a caller workflow still yields a sensible header.
        read -r -d '' BUILTIN_PREAMBLE <<'PREAMBLE' || true
        # Changelog

        All notable changes to this project are documented here. This file is maintained
        automatically by [semantic-release](https://github.com/semantic-release/semantic-release)
        on every release to `main`.
        PREAMBLE

        # Resolve the changelog preamble (title) that stays pinned at the top of the
        # file. Priority: repo-config changelogTitle > existing file preamble > input >
        # built-in default. Preserving the existing preamble keeps any repo's own H1 +
        # intro on top instead of letting new entries push it down.
        if [ -n "$CUSTOM_TITLE" ]; then
          CHANGELOG_TITLE="$CUSTOM_TITLE"
          echo "changelogTitle: repo config"
        else
          CHANGELOG_TITLE="$(node "$GITHUB_ACTION_PATH/notes/preamble.mjs" "$CHANGELOG_FILE" 2>/dev/null || true)"
          if [ -n "$CHANGELOG_TITLE" ]; then
            echo "changelogTitle: preserved existing preamble of $CHANGELOG_FILE"
          elif [ -n "$DEFAULT_CHANGELOG_TITLE" ]; then
            CHANGELOG_TITLE="$DEFAULT_CHANGELOG_TITLE"
            echo "changelogTitle: from changelog-title input"
          else
            CHANGELOG_TITLE="$BUILTIN_PREAMBLE"
            echo "changelogTitle: built-in default"
          fi
        fi

        # Inject changelogTitle into the @semantic-release/changelog plugin options
        # (jq --arg keeps the multi-line value safely JSON-encoded)
        if [ -n "$CHANGELOG_TITLE" ]; then
          jq --arg t "$CHANGELOG_TITLE" '
            .plugins |= map(
              if type == "array" and .[0] == "@semantic-release/changelog"
              then [.[0], (.[1] + {changelogTitle: $t})]
              else . end)
          ' .releaserc.json > .releaserc.tmp.json && mv .releaserc.tmp.json .releaserc.json
        fi

        # Merge extra plugins if any
        if [ "$EXTRA_PLUGINS" != "[]" ]; then
          echo "Merging extra plugins into config..."
          # Insert extra plugins before @semantic-release/github
          jq --argjson extra "$EXTRA_PLUGINS" '
            .plugins = [.plugins[0], .plugins[1], .plugins[2]] + $extra + [.plugins[3], .plugins[4]]
          ' .releaserc.json > .releaserc.tmp.json && mv .releaserc.tmp.json .releaserc.json
        fi

        echo ""
        echo "Final config:"
        cat .releaserc.json | jq .

    - name: Install Changelog Notes Toolchain
      shell: bash
      run: |
        echo "Installing pinned, decoupled changelog notes toolchain..."
        cd "$GITHUB_ACTION_PATH/notes"
        npm ci --omit=dev --no-audit --no-fund

    - name: Semantic Release
      id: release
      uses: cycjimmy/semantic-release-action@v6
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      with:
        # Pin the semantic-release line to the current major. Notes generation is
        # decoupled (see notes/notes.mjs via @semantic-release/exec), so semantic-release
        # and the changelog toolchain move on their own current versions and can no
        # longer silently break each other.
        semantic_version: '25'
        dry_run: ${{ inputs.dry-run }}
        branches: ${{ inputs.branches }}
        # commit-analyzer still needs the conventionalcommits preset (parser only, so the
        # v10 line is fine); @semantic-release/exec runs our decoupled notes generator.
        extra_plugins: |
          @semantic-release/changelog
          @semantic-release/git
          @semantic-release/exec
          conventional-changelog-conventionalcommits@10
          ${{ inputs.extra-plugins }}

    - name: Set Tag Output
      id: tag
      shell: bash
      if: steps.release.outputs.new_release_published == 'true'
      run: |
        ACTUAL_TAG="${{ steps.release.outputs.new_release_git_tag }}"
        if [ -n "$ACTUAL_TAG" ]; then
          echo "tag=$ACTUAL_TAG" >> "$GITHUB_OUTPUT"
        else
          # Fallback to v-prefix if output is empty (backwards-compatible)
          echo "tag=v${{ steps.release.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"
        fi

branding:
  icon: 'package'
  color: 'green'