name: '🔔 Microsoft Teams Notification'
description: 'Send sophisticated Adaptive Card notifications to Microsoft Teams channels for repository events'
author: 'BAUER GROUP IT'
branding:
  icon: 'bell'
  color: 'blue'

inputs:
  webhook-url:
    description: 'Microsoft Teams webhook URL (Power Automate Workflows or legacy O365 connector). If empty, the notification is skipped with a warning instead of failing.'
    required: false
  event-type:
    description: 'Type of event (workflow_failure, workflow_success, issue_opened, issue_closed, pr_opened, pr_closed, pr_merged, push, release)'
    required: true
  title:
    description: 'Notification title'
    required: false
    default: 'Repository Event'
  summary:
    description: 'Event summary text'
    required: false
  details:
    description: 'Additional event details'
    required: false
  repository-name:
    description: 'Repository name'
    required: false
    default: ${{ github.repository }}
  repository-url:
    description: 'Repository URL'
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}
  actor:
    description: 'Event actor'
    required: false
    default: ${{ github.actor }}
  actor-avatar:
    description: 'Actor avatar URL'
    required: false
    default: ${{ github.server_url }}/${{ github.actor }}.png
  ref:
    description: 'Git reference'
    required: false
    default: ${{ github.ref }}
  sha:
    description: 'Commit SHA'
    required: false
    default: ${{ github.sha }}
  run-id:
    description: 'Workflow run ID'
    required: false
    default: ${{ github.run_id }}
  run-url:
    description: 'Workflow run URL'
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  pr-number:
    description: 'Pull request number'
    required: false
  pr-url:
    description: 'Pull request URL'
    required: false
  issue-number:
    description: 'Issue number'
    required: false
  issue-url:
    description: 'Issue URL'
    required: false
  theme-color:
    description: 'Custom theme color (hex without #)'
    required: false
  custom-facts:
    description: 'Additional facts as JSON array'
    required: false
  mention-users:
    description: 'Users to mention (comma-separated)'
    required: false
  config-file:
    description: 'Configuration file name (without extension) from .github/config/teams-notification/'
    required: false
    default: 'default'
  enable-retry:
    description: 'Enable retry on failure'
    required: false
    default: 'true'
  retry-count:
    description: 'Number of retry attempts'
    required: false
    default: '3'
  timeout:
    description: 'Request timeout in seconds'
    required: false
    default: '30'
  workflow-logs:
    description: 'Workflow logs or output to include'
    required: false
  show-logs:
    description: 'Show workflow logs section'
    required: false
    default: 'false'
  logs-title:
    description: 'Title for logs section'
    required: false
    default: 'Workflow Output'

outputs:
  status:
    description: 'Notification delivery status (success, skipped or failed)'
    value: ${{ steps.send.outputs.status }}
  response:
    description: 'Teams webhook response'
    value: ${{ steps.send.outputs.response }}
  card-payload:
    description: 'Generated Adaptive Card payload'
    value: ${{ steps.card.outputs.payload }}

runs:
  using: 'composite'
  steps:
    - name: 📋 Load Configuration
      id: config
      shell: bash
      env:
        CONFIG_NAME: ${{ inputs.config-file }}
        EVENT_TYPE: ${{ inputs.event-type }}
      run: |
        # Both values select a file path and a yq expression, so neither may be
        # interpolated into the script body. Restrict them to a safe character set
        # rather than trusting the caller: `../` in config-file would read an
        # arbitrary YAML file, and a crafted event-type would be evaluated as a yq
        # expression rather than looked up as a key.
        if [[ ! "$CONFIG_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::Invalid config-file '$CONFIG_NAME' - only letters, digits, dot, underscore and hyphen are allowed"
          exit 1
        fi
        if [[ ! "$EVENT_TYPE" =~ ^[A-Za-z0-9._-]*$ ]]; then
          echo "::error::Invalid event-type '$EVENT_TYPE' - only letters, digits, dot, underscore and hyphen are allowed"
          exit 1
        fi

        CONFIG_FILE=".github/config/teams-notification/${CONFIG_NAME}.yml"

        if [[ -f "$CONFIG_FILE" ]]; then
          echo "✅ Loading configuration from $CONFIG_FILE"

          # Parse YAML configuration. The event type is read from the environment via
          # strenv() and indexed with [], so it is treated as a key rather than
          # evaluated as part of the expression.
          THEME_COLOR=$(yq eval '.theme.colors[strenv(EVENT_TYPE)] // .theme.colors.default // "0078d4"' "$CONFIG_FILE")
          ENABLE_MENTIONS=$(yq eval '.features.mentions // true' "$CONFIG_FILE")
          ENABLE_FACTS=$(yq eval '.features.facts // true' "$CONFIG_FILE")
          CARD_STYLE=$(yq eval '.card.style // "default"' "$CONFIG_FILE")
          
          echo "theme-color=$THEME_COLOR" >> "$GITHUB_OUTPUT"
          echo "enable-mentions=$ENABLE_MENTIONS" >> "$GITHUB_OUTPUT"
          echo "enable-facts=$ENABLE_FACTS" >> "$GITHUB_OUTPUT"
          echo "card-style=$CARD_STYLE" >> "$GITHUB_OUTPUT"
        else
          echo "⚠️ Configuration file not found, using defaults"
          echo "theme-color=0078d4" >> "$GITHUB_OUTPUT"
          echo "enable-mentions=true" >> "$GITHUB_OUTPUT"
          echo "enable-facts=true" >> "$GITHUB_OUTPUT"
          echo "card-style=default" >> "$GITHUB_OUTPUT"
        fi

    - name: 📊 Prepare Event Data
      id: event-data
      shell: bash
      env:
        # Caller-controlled values reach shell commands here (case patterns, sed
        # pipelines), so they are passed through the environment rather than pasted
        # into the script body. `ref` is the sharpest one: a branch name is
        # attacker-chosen on a fork pull request.
        EVENT_TYPE: ${{ inputs.event-type }}
        INPUT_THEME_COLOR: ${{ inputs.theme-color }}
        CONFIG_THEME_COLOR: ${{ steps.config.outputs.theme-color }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_SHA: ${{ inputs.sha }}
        EVENT_CREATED_AT: ${{ github.event.created_at }}
        EVENT_UPDATED_AT: ${{ github.event.updated_at }}
      run: |
        # Determine theme color based on event type
        THEME_COLOR="$INPUT_THEME_COLOR"
        if [[ -z "$THEME_COLOR" ]]; then
          case "$EVENT_TYPE" in
            "workflow_success"|"pr_merged"|"release")
              THEME_COLOR="28a745" # Green
              ;;
            "workflow_failure"|"issue_opened")
              THEME_COLOR="dc3545" # Red
              ;;
            "pr_opened"|"pr_closed")
              THEME_COLOR="007bff" # Blue
              ;;
            "push")
              THEME_COLOR="6f42c1" # Purple
              ;;
            *)
              THEME_COLOR="$CONFIG_THEME_COLOR"
              ;;
          esac
        fi
        
        # Prepare status icon
        case "$EVENT_TYPE" in
          "workflow_success")
            STATUS_ICON="✅"
            STATUS_TEXT="Success"
            ;;
          "workflow_failure")
            STATUS_ICON="❌"
            STATUS_TEXT="Failed"
            ;;
          "pr_opened")
            STATUS_ICON="🔀"
            STATUS_TEXT="Pull Request Opened"
            ;;
          "pr_closed")
            STATUS_ICON="🔒"
            STATUS_TEXT="Pull Request Closed"
            ;;
          "pr_merged")
            STATUS_ICON="🎉"
            STATUS_TEXT="Pull Request Merged"
            ;;
          "issue_opened")
            STATUS_ICON="🐛"
            STATUS_TEXT="Issue Opened"
            ;;
          "issue_closed")
            STATUS_ICON="✅"
            STATUS_TEXT="Issue Closed"
            ;;
          "push")
            STATUS_ICON="🚀"
            STATUS_TEXT="Push"
            ;;
          "release")
            STATUS_ICON="🏷️"
            STATUS_TEXT="Release"
            ;;
          *)
            STATUS_ICON="📢"
            STATUS_TEXT="Repository Event"
            ;;
        esac
        
        echo "theme-color=$THEME_COLOR" >> "$GITHUB_OUTPUT"
        echo "status-icon=$STATUS_ICON" >> "$GITHUB_OUTPUT"
        echo "status-text=$STATUS_TEXT" >> "$GITHUB_OUTPUT"
        
        # Format branch/ref name
        REF_NAME="${INPUT_REF#refs/heads/}"
        REF_NAME="${REF_NAME#refs/tags/}"
        echo "ref-name=$REF_NAME" >> "$GITHUB_OUTPUT"
        
        # Short SHA
        SHORT_SHA="${INPUT_SHA:0:8}"
        echo "short-sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
        
        # Current timestamp in ISO 8601 format for Teams locale support
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
        
        # Format timestamp for display (German locale format)
        # Use current timestamp or event timestamp
        SOURCE_TIME="$TIMESTAMP"
        EVENT_CREATED="$EVENT_CREATED_AT"
        EVENT_UPDATED="$EVENT_UPDATED_AT"
        
        if [[ -n "$EVENT_CREATED" ]]; then
          SOURCE_TIME="$EVENT_CREATED"
        elif [[ -n "$EVENT_UPDATED" ]]; then
          SOURCE_TIME="$EVENT_UPDATED"
        fi
        
        # Format as German date/time: DD.MM.YYYY HH:MM UTC
        DISPLAY_TIMESTAMP=$(date -u -d "$SOURCE_TIME" +"%d.%m.%Y %H:%M UTC" 2>/dev/null || date -u +"%d.%m.%Y %H:%M UTC")
        echo "display-timestamp=$DISPLAY_TIMESTAMP" >> "$GITHUB_OUTPUT"

    - name: 🎨 Generate Adaptive Card
      id: card
      shell: bash
      env:
        # Free-form values arrive through env rather than being interpolated into the
        # script body. Interpolated, a value containing a quote, a newline or a
        # backslash produced invalid JSON and the notification failed - and multi-line
        # `details` is an advertised feature, so this triggered in normal use.
        NOTIFY_TITLE: ${{ inputs.title || steps.event-data.outputs.status-text }}
        NOTIFY_SUMMARY: ${{ inputs.summary }}
        NOTIFY_DETAILS: ${{ inputs.details }}
        NOTIFY_ACTOR: ${{ inputs.actor }}
        NOTIFY_REF_NAME: ${{ steps.event-data.outputs.ref-name }}
        NOTIFY_TIMESTAMP: ${{ steps.event-data.outputs.display-timestamp }}
        NOTIFY_LOGS_TITLE: ${{ inputs.logs-title }}
        NOTIFY_WORKFLOW_LOGS: ${{ inputs.workflow-logs }}
        NOTIFY_SHOW_LOGS: ${{ inputs.show-logs }}
      run: |
        # Emit a value as a correctly escaped JSON string, quotes included.
        json_string() {
          printf '%s' "${1-}" | jq -Rs .
        }

        # Create temporary file for card payload
        CARD_FILE=$(mktemp)

        # Build adaptive card JSON
        cat > "$CARD_FILE" << 'EOF'
        {
          "type": "message",
          "attachments": [
            {
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "type": "AdaptiveCard",
                "version": "1.5",
                "schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                "body": [
                  {
                    "type": "Container",
                    "style": "emphasis",
                    "items": [
                      {
                        "type": "TextBlock",
                        "text": "📦 **[${{ inputs.repository-name }}](${{ inputs.repository-url }})**",
                        "weight": "Bolder",
                        "size": "Large",
                        "color": "Accent",
                        "wrap": true,
                        "spacing": "None"
                      },
                      {
                        "type": "ColumnSet",
                        "spacing": "Medium",
                        "columns": [
                          {
                            "type": "Column",
                            "width": "auto",
                            "items": [
                              {
                                "type": "Image",
                                "url": "${{ inputs.actor-avatar }}",
                                "style": "Person",
                                "size": "Small"
                              }
                            ]
                          },
                          {
                            "type": "Column",
                            "width": "stretch",
                            "items": [
                              {
                                "type": "TextBlock",
        EOF
        # The heredoc is split here so the title can be emitted as escaped JSON.
        # Keeping the surrounding blocks quoted means nothing else in the card is
        # exposed to shell expansion.
        printf '                                "text": %s,\n' "$(json_string "**${NOTIFY_TITLE}**")" >> "$CARD_FILE"
        cat >> "$CARD_FILE" << 'EOF'
                                "weight": "Bolder",
                                "size": "Medium",
                                "wrap": true,
                                "spacing": "None"
                              },
                              {
                                "type": "TextBlock",
        EOF
        # The branch name is attacker-chosen on a fork pull request, so this line is
        # escaped rather than pasted into the JSON literal.
        printf '                                "text": %s,\n' \
          "$(json_string "👤 ${NOTIFY_ACTOR} • 🌿 ${NOTIFY_REF_NAME} • 📅 ${NOTIFY_TIMESTAMP}")" >> "$CARD_FILE"
        cat >> "$CARD_FILE" << 'EOF'
                                "size": "Small",
                                "color": "Default",
                                "wrap": true,
                                "spacing": "Small"
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  },
        EOF
        
        # Add summary if provided
        if [[ -n "$NOTIFY_SUMMARY" ]]; then
          {
            echo '                  {'
            echo '                    "type": "TextBlock",'
            printf '                    "text": %s,\n' "$(json_string "$NOTIFY_SUMMARY")"
            echo '                    "wrap": true,'
            echo '                    "spacing": "Medium"'
            echo '                  },'
          } >> "$CARD_FILE"
        fi

        # Add details if provided
        if [[ -n "$NOTIFY_DETAILS" ]]; then
          {
            echo '                  {'
            echo '                    "type": "TextBlock",'
            printf '                    "text": %s,\n' "$(json_string "$NOTIFY_DETAILS")"
            echo '                    "wrap": true,'
            echo '                    "size": "Medium",'
            echo '                    "color": "Default"'
            echo '                  },'
          } >> "$CARD_FILE"
        fi
        
        # Add facts section
        ENABLE_FACTS="${{ steps.config.outputs.enable-facts }}"
        if [[ "$ENABLE_FACTS" == "true" ]]; then
          cat >> "$CARD_FILE" << 'EOF'
                  {
                    "type": "FactSet",
                    "facts": [
                      {
                        "title": "🔗 Commit SHA:",
                        "value": "${{ steps.event-data.outputs.short-sha }}"
                      }
        EOF
          
          # Add event-specific facts
          PR_NUMBER="${{ inputs.pr-number }}"
          if [[ -n "$PR_NUMBER" ]]; then
            cat >> "$CARD_FILE" << 'EOF'
                      ,{
                        "title": "🔀 Pull Request:",
                        "value": "#${{ inputs.pr-number }}"
                      }
        EOF
          fi
          
          ISSUE_NUMBER="${{ inputs.issue-number }}"
          if [[ -n "$ISSUE_NUMBER" ]]; then
            cat >> "$CARD_FILE" << 'EOF'
                      ,{
                        "title": "🐛 Issue:",
                        "value": "#${{ inputs.issue-number }}"
                      }
        EOF
          fi
          
          cat >> "$CARD_FILE" << 'EOF'
                    ]
                  },
        EOF
        fi
        
        # Add workflow logs section if enabled
        if [[ "$NOTIFY_SHOW_LOGS" == "true" ]] && [[ -n "$NOTIFY_WORKFLOW_LOGS" ]]; then
          cat >> "$CARD_FILE" << 'EOF'
                  {
                    "type": "Container",
                    "style": "default",
                    "items": [
                      {
                        "type": "TextBlock",
        EOF
        printf '                        "text": %s,\n' "$(json_string "📋 **${NOTIFY_LOGS_TITLE}**")" >> "$CARD_FILE"
        cat >> "$CARD_FILE" << 'EOF'
                        "weight": "Bolder",
                        "size": "Medium",
                        "spacing": "Medium"
                      },
                      {
                        "type": "TextBlock",
        EOF
        # Raw workflow output: newlines and quotes are the norm here, not the exception.
        printf '                        "text": %s,\n' \
          "$(json_string "$(printf '```\n%s\n```' "$NOTIFY_WORKFLOW_LOGS")")" >> "$CARD_FILE"
        cat >> "$CARD_FILE" << 'EOF'
                        "wrap": true,
                        "fontType": "Monospace",
                        "size": "Medium",
                        "spacing": "Small"
                      }
                    ]
                  },
        EOF
        fi
        
        # Add actions section
        cat >> "$CARD_FILE" << 'EOF'
                  {
                    "type": "ActionSet",
                    "actions": [
        EOF
        
        # Repository action
        cat >> "$CARD_FILE" << 'EOF'
                      {
                        "type": "Action.OpenUrl",
                        "title": "📂 Repository",
                        "url": "${{ inputs.repository-url }}"
                      }
        EOF
        
        # Workflow run action
        RUN_URL="${{ inputs.run-url }}"
        if [[ -n "$RUN_URL" ]]; then
          cat >> "$CARD_FILE" << 'EOF'
                      ,{
                        "type": "Action.OpenUrl",
                        "title": "🔄 Workflow",
                        "url": "${{ inputs.run-url }}"
                      }
        EOF
        fi
        
        # PR action
        PR_URL="${{ inputs.pr-url }}"
        if [[ -n "$PR_URL" ]]; then
          cat >> "$CARD_FILE" << 'EOF'
                      ,{
                        "type": "Action.OpenUrl",
                        "title": "🔀 Pull Request",
                        "url": "${{ inputs.pr-url }}"
                      }
        EOF
        fi
        
        # Issue action
        ISSUE_URL="${{ inputs.issue-url }}"
        if [[ -n "$ISSUE_URL" ]]; then
          cat >> "$CARD_FILE" << 'EOF'
                      ,{
                        "type": "Action.OpenUrl",
                        "title": "🐛 Issue",
                        "url": "${{ inputs.issue-url }}"
                      }
        EOF
        fi
        
        # Close actions and card
        cat >> "$CARD_FILE" << 'EOF'
                    ]
                  }
                ],
                "msteams": {
                  "width": "Full"
                }
              }
            }
          ]
        }
        EOF
        
        # Output card payload
        CARD_PAYLOAD=$(cat "$CARD_FILE")
        echo "payload<<EOF" >> "$GITHUB_OUTPUT"
        echo "$CARD_PAYLOAD" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
        
        # Clean up
        rm "$CARD_FILE"

    - name: 🚀 Send Teams Notification
      id: send
      shell: bash
      env:
        # Everything here reaches a shell command, so none of it may be
        # interpolated into the script body. The card payload in particular
        # carries free-form user text: a single apostrophe in it would close the
        # -d '...' argument below and hand the rest to the shell.
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        CARD_PAYLOAD: ${{ steps.card.outputs.payload }}
        RETRY_COUNT_INPUT: ${{ inputs.retry-count }}
        TIMEOUT_INPUT: ${{ inputs.timeout }}
        ENABLE_RETRY: ${{ inputs.enable-retry }}
      run: |
        # Opt-in notifier: if no webhook URL is configured (e.g. the
        # TEAMS_WEBHOOK_URL secret is not set), skip cleanly instead of
        # failing the job. A warning annotation keeps the gap visible.
        if [[ -z "$WEBHOOK_URL" ]]; then
          echo "::warning title=Teams Notification Skipped::No webhook URL configured (TEAMS_WEBHOOK_URL secret missing) - skipping Teams notification"
          echo "status=skipped" >> "$GITHUB_OUTPUT"
          echo "response=No webhook URL configured" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Retry logic. Both values are declared `type: number`, but validate anyway:
        # they end up in an arithmetic context and as a curl argument.
        RETRY_COUNT=0
        MAX_RETRIES="${RETRY_COUNT_INPUT:-3}"
        REQUEST_TIMEOUT="${TIMEOUT_INPUT:-30}"
        [[ "$MAX_RETRIES" =~ ^[0-9]+$ ]] || MAX_RETRIES=3
        [[ "$REQUEST_TIMEOUT" =~ ^[0-9]+$ ]] || REQUEST_TIMEOUT=30
        SUCCESS=false
        
        while [[ $RETRY_COUNT -le $MAX_RETRIES ]] && [[ "$SUCCESS" != "true" ]]; do
          if [[ $RETRY_COUNT -gt 0 ]]; then
            echo "⏳ Retry attempt $RETRY_COUNT/$MAX_RETRIES"
            sleep $((RETRY_COUNT * 2))
          fi
          
          # Send webhook request
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}" \
            -X POST \
            -H "Content-Type: application/json" \
            --max-time "$REQUEST_TIMEOUT" \
            -d "$CARD_PAYLOAD" \
            "$WEBHOOK_URL" || echo "CURL_ERROR")
          
          # Parse response
          if [[ "$RESPONSE" == "CURL_ERROR" ]]; then
            echo "❌ Network error occurred"
            STATUS_CODE="000"
          else
            BODY=$(echo "$RESPONSE" | sed '$d' | sed '$d')
            STATUS_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
            TIME_TOTAL=$(echo "$RESPONSE" | grep "TIME_TOTAL:" | cut -d: -f2)
            
            echo "📊 Response Status: $STATUS_CODE"
            echo "⏱️ Response Time: ${TIME_TOTAL}s"

            # Accept any 2xx: legacy O365 connectors reply 200, the new
            # Power Automate Workflows endpoint replies 202 Accepted (async)
            if [[ "$STATUS_CODE" =~ ^2[0-9][0-9]$ ]]; then
              echo "✅ Teams notification sent successfully"
              SUCCESS=true
              echo "status=success" >> "$GITHUB_OUTPUT"
              echo "response=$BODY" >> "$GITHUB_OUTPUT"
            else
              echo "❌ Teams notification failed with status $STATUS_CODE"
              echo "📝 Response: $BODY"
            fi
          fi
          
          if [[ "$SUCCESS" != "true" ]] && [[ "$ENABLE_RETRY" == "true" ]]; then
            ((RETRY_COUNT++))
          else
            break
          fi
        done
        
        if [[ "$SUCCESS" != "true" ]]; then
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "response=Failed after $RETRY_COUNT attempts" >> "$GITHUB_OUTPUT"
          exit 1
        fi

